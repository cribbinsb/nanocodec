[package]
name = "nanocodec-cli"
description = "nanocodec command-line encoder and decoder (the `nanocodec` binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://cribbinsb.github.io/nanocodec/docs/cli.html"
keywords.workspace = true
categories.workspace = true
autotests = false

[[bin]]
name = "nanocodec"
path = "src/main.rs"
# The front-door library crate is also `nanocodec`: a binary has no API to
# document, and two `nanocodec` pages would overwrite each other.
doc = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
nc-av2.workspace = true
nc-common.workspace = true
nc-dsp.workspace = true
nc-vp9.workspace = true
nc-encoder.workspace = true
nc-av1.workspace = true
nc-h264.workspace = true
nc-hevc.workspace = true
nc-vvc.workspace = true

[features]
# `nanocodec stat` (decoder analysis): an analysis build of the CLI
# (docs/PROCEDURES.md "Inspect a stream").
analysis = ["nc-hevc/analysis", "nc-h264/analysis", "nc-av1/analysis", "nc-vp9/analysis", "nc-vvc/analysis", "nc-av2/analysis"]

[lints]
workspace = true
