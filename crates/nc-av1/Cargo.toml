[package]
name = "nanocodec-av1"
description = "nanocodec AV1 encoder backend for the shared engine, and an AV1 decoder for the streams it emits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nanocodec-av1"
keywords = ["video", "codec", "encoder", "decoder", "av1"]
categories.workspace = true

[lib]
name = "nc_av1"

[dependencies]
nc-common.workspace = true
nc-dsp.workspace = true
nc-encoder.workspace = true

[features]
# Decoder analysis records (`decoder::tile::analysis`): off in normal
# builds, so the decoder contains no analysis code
# (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
