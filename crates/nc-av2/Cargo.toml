[package]
name = "nanocodec-av2"
description = "nanocodec AV2 encoder backend for the shared engine (8-bit 4:2:0 subset), and an AV2 decoder (8-bit, single tile; not yet 10-bit, monochrome, several tiles or reference scaling)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nanocodec-av2"
keywords = ["video", "codec", "encoder", "decoder", "av2"]
categories.workspace = true

[lib]
name = "nc_av2"

[dependencies]
nc-encoder.workspace = true
nc-common.workspace = true
nc-dsp.workspace = true

[features]
# Decoder analysis records (`tile_analysis`): off in normal builds, so the
# decoder contains no analysis code (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
