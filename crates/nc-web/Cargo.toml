[package]
name = "nc-web"
description = "Browser WASM bindings for nanocodec encode and decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nc-av2.workspace = true
nc-common.workspace = true
nc-dsp.workspace = true
nc-vp9.workspace = true
nc-encoder.workspace = true
nc-h264.workspace = true
nc-hevc.workspace = true
nc-av1.workspace = true
nc-vvc.workspace = true
wasm-bindgen = "=0.2.105"

[features]
# The analysis module of the demo (`set_analysis`, `analysis_frame`):
# built as its own WASM module, pkg/analysis/ (tools/web/build.sh).
analysis = ["nc-hevc/analysis", "nc-h264/analysis"]

[lints]
workspace = true
