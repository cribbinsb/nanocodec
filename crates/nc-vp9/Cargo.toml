[package]
name = "nanocodec-vp9"
description = "nanocodec VP9 Profile 0 encoder backend for the shared engine, and a VP9 profile 0 and 2 decoder (libvpx test vectors pass; not yet profiles 1 and 3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nanocodec-vp9"
keywords = ["video", "codec", "encoder", "decoder", "vp9"]
categories.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
name = "nc_vp9"

[dependencies]
nc-common.workspace = true
nc-dsp.workspace = true
nc-encoder.workspace = true

[features]
# Decoder analysis records (`decoder::analysis`): off in normal builds, so
# the decoder contains no analysis code (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
