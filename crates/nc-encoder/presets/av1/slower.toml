# AV1 slower (`--preset slower`; `slow` until 2026-11-21): the shared slower bundle (presets/slower.toml,
# applied first: the second reference with the full decision) plus AV1's
# levers. Re-picked 2026-11-19 (docs/handoff/presets.md "Slow presets"):
# everything heavy on at once, then cut back by component cost. Alone on the
# Default (fixed QP J, 23 clips / x86 callgrind P instructions): the winner
# walk -1.5% / +16%, the pre-transform skip off -1.5% / +8%, the inter-frame
# intra search widened -0.8% / +5%, key-frame trellis -0.9% / 0%, the biased
# skip off -0.4% / +1%, four trellis survivors -0.3% / +20%. Left out: the
# final stage (+2.4%, worse), chroma trellis (+2.5%), 8x8 inter blocks (the
# planner set, +2.4%), the luma residual check on every vector (+0.9%), loop
# restoration (+0.3% at +142%), the sub-sample refinement gates (no gain in
# the bundle at +11%), the square winner walk and every transform-split
# trial (-0.1 J each for +12..+29 points).
#
# The winner walk: three quarter-sample moves along the row and column.
decision.winner_walk_steps = 3
decision.winner_walk_square = 0
# Inter-frame intra: every block searched, all seven candidates costed, the
# DC intra gate lower; key frames cost more candidates and every angle delta.
av1.inter_intra_search = 2
av1.inter_intra_rd_candidates = 7
av1.keyframe_intra_rd_candidates = 8
av1.keyframe_angle_deltas = 2
decision.intra_gate_variance = 16
# Every residual reaches the transform: no pre-transform skip, no biased skip.
av1.pre_tx_skip = 0
av1.skip_bias_pct = 100
av1.skip_bias_pct_base = 100
# Trellis on key frames too, with four survivors.
quant.trellis_key = 1
quant.trellis_states = 4
# The RD partition search (2026-11-21, docs/handoff/av1.md "RD partition
# search"): each inter node decided by coding the leaf and the quad split one
# level either side of the plan (node trials: logged symbols, CDF copies).
# Fixed QP J (24 clips) -4.5% [-5.0, -4.0] against this Slow without it; with
# 8x8 inter blocks on offer -5.4% for about twice the added instructions; no
# deeper split -1.9%, no larger leaf -1.3%. CBR k 0: L1 -4.24%, L2 -3.77%.
planner.rd_split = 1

# The Default's zero-trial split selector (planner.split_selector) stays off
# here until screened on this rung (docs/handoff/planner-selector.md).
planner.split_selector = 0

# Layer propagation on the flat stream's QP-cadence cycles (layer_propagation.rs,
# docs/handoff/temporal-lambda.md). nceval.train (k 0, base f953cd97d): L3 (n 108)
# -0.86 % [-1.39, -0.35] BETTER, final-check (n 34) -1.27 % [-1.82, -0.81] BETTER; whole encode cycles Graviton3 +2.70 %, Zen 5 +3.39 % (AV1 slow).
layers.propagation = 1
layers.propagation_flat = 1
layers.propagation_grid = 3
layers.propagation_prekey = 1
