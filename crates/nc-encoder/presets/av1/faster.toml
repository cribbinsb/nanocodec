# AV1 Faster: the speed point below AV1 Fast, at SVT-AV1 M12 (--rtc) speed or better
# (av1-faster agent, 2026-11-11; docs/handoff/av1-faster.md).
# av1-fast plus the levers with the least quality lost per CPU saved
# (single-lever J_real at k 0 against Jetson time, then cumulative
# bundles). The profile is flat (no stage over ~20%), so the speed comes
# from many small cuts; past about -10% time each further 1% costs 1.5-2%
# in bits.
# Jetson, CBR 600 kbps rung, chart clips: see the handoff for fps and BD.
#
# Everything in av1-fast, listed so the streams do not move with it.
light.decision.subpel_move_bias = 1.1
light.decision.subpel_move_bias_nonzero = 1.1
light.decision.subpel_fractional_bias = 1.1
light.decision.refine_cheap_vector = 0
av1.inter_tx_split = 0
av1.pre_tx_luma_dominant = 1
av1.pre_tx_skip = 1
light.av1.pre_tx_skip_model = 0
light.av1.pre_tx_skip_rd = 100
av1.pre_tx_skip_score = 70
av1.residual_rd_max_mv = 8
av1.transform_rd_gain_scale = 1.25
av1.transform_rd_skip = 2
av1.transform_rd_skip_chroma = 1
av1.transform_rd_uv_max_noise_sigma = 1
decision.subpel_walk = 2
decision.subpel_walk_max_noise_sigma = 1
av1.chroma_delta_q = -24
chroma.policy = 0
av1.chroma_noise_scale = 2
decision.codec_fullpel_probe = 1
decision.codec_fullpel_probe_min_lambdas = 0.0094
av1.cdef_per_superblock = 1
av1.cdef_local_strong_luma = 1
av1.cdef_local_strong_primary = 15
av1.cdef_local_strong_variance_min = 0
av1.cdef_local_noise_full_search_sigma = 0
av1.cdef_local_strong_model_scale = 3
av1.loop_filter = 0
light.planner.depth_removal_min_quantizer = 0
quant.trellis = 0
av1.keyframe_directional = 0
av1.keyframe_angle_deltas = 0
av1.keyframe_filter_intra = 0
# Key frames predict with DC only (SVT M11+ is DC-only on every frame): the
# transform-costed key mode search was 2.6-3.3x SVT M13's whole key frame.
# J_real +0.6% VAL / +1.2% proxy-6 / +0.4% held-out (14 clips of
# broad_independent_v1, every class); Jetson -3.0% time, x86 -4.5%
# instructions (150 f, the chart clips). (2026-11-11)
av1.keyframe_intra_modes = 0
decision.intra_directional = 0
av1.inter_intra_search = 0
#
# The Faster levers. Single-lever J_real (k 0, R6 clips, 60 f) / Jetson
# time, in the order of quality lost per time saved:
# 32x32 and 64x64 residuals keep their low frequencies in coding too
# (quality -0.4% / time -2.3%).
light.av1.partial_forward = 2
# More blocks skip luma before the transform (+2.3 / -4.3%).
light.av1.pre_tx_skip_energy = 100
# Sub-pel refinement skipped below Fast's 0.1 lambda of seed residual.
decision.codec_subpel_seed_lambdas = 0.1
# CDEF distortion sampled on every 8th row (+0.5 / -0.7%).
av1.cdef_search_row_step = 8
# The per-superblock CDEF choice searched on every 4th frame (+2.0 / -2.0%).
av1.cdef_local_search_period = 4
# Depth removal twice as eager (+2.4 / -1.4%).
light.planner.depth_removal_qp_scale = 4
#
# Rebuild (2026-11-11, J_real vs the first av1-faster, k 0, 150 f; VAL-proxy-5
# + lowlight_bdd_00ce95b0 / proxy-6): chroma skip 10 -> 7, seed gate 0.3 ->
# 0.5, plus the four below: -7.5% / -7.1% (PSNR-YUV -7.4 / -8.4, VMAF v1
# -9.8 / -7.0, MS-SSIM -2.0 / -6.2); Jetson -1.9% time, x86 instructions
# -0.4% (geomean of the chart clips). Worst-1% PSNR-Y +4.0% on the VAL set
# is one clip, bodycam_airport, where luma is at 46-51 dB and gives ~0.4 dB
# to chroma (worst 4-frame window 46.6 vs 46.7 dB at 600 kbps): judged
# invisible; proxy-6 +1.1%. Long GOP (900 f, one key, PSNR-YUV per third)
# +0.22..+0.30 dB crowd, +0.09..+0.23 pan, +0.34..+0.42 static: no drift.
# Gated L1T3 (h264-faster's gate; layers crowd and pan, keeps static,
# shaking and repeated sources flat).
layers.count = 3
layers.adaptive = 1
layers.adaptive_max_camera_motion = 16
layers.adaptive_max_compensable = 1
layers.adaptive_max_repeat_share = 0.25
layers.adaptive_max_static = 0.68
layers.adaptive_max_camera_jitter = 2
# P-frame rounding offset 32/128 (Fast 48): fewer small coefficients.
av1.inter_rounding_q7 = 32
# The local CDEF search keeps its period on noisy sources too (Fast searches
# every frame above noise sigma 1): `av1.cdef_local_noise_full_search_sigma`
# is 0 in the av1-fast block above.
# Biased residual skip on blocks below 0.25 lambda per sample (default 0.0625).
light.av1.skip_bias_energy = 0.25
#
# Not used (measured in the handoff): temporal layers (gated: no chart
# speed, worst-1% guard; fixed L1T3: bodycam guard), frame-level CDEF
# (+8.1% for -3.0%), the HME trio, 32x32 minimum inter blocks, integer
# probes off, `persist.reuse` 0 (-3.0% time for 0 quality, but it is the
# static-recovery fix: tests/static_recovery.rs).
# Pinned before AV1 Default's seed refinement gate (2026-11-14).
light.decision.seed_refine_ratio = 0
# Pinned before AV1 Default's key-period ceiling (2026-11-14).
rate.period_ceiling = 0
# Pinned before AV1 Default's unified reference plan (2026-11-14).
structure.unified = 0
# Pinned before AV1 Default's key still boost (2026-11-14).
rate.key_still_boost = 0
# Pinned before AV1 Default's inherited cadence depth (2026-11-15).
structure.inherited_depth = 0
# The engine's depth removal before 2026-11-15, pinned so this preset's
# streams do not move with the engine default.
light.planner.depth_removal_th_32_16 = 25
light.planner.depth_removal_th_16_8 = 50

# f-c3n (2026-11-16, zen5 goal record): Faster with its cheap-but-costly
# groups back at Fast's values (sub-pel seed lambda, exact-rank margin,
# full-pel window and its exit, chroma skip threshold, NEARMV count, the
# linear residual-drop rate), and Fast's
# quiet run-up before a scheduled key, which keeps the
# still-scene key from starving. Against the previous Faster (2026-11-16):
# final-check (600 f, keys every 10 s, 27 clips) quality J -9.78 %
# [-10.64, -9.01], key pulses -0.20 / -0.14 dB; x86 callgrind at 600 kbps
# +14.0 % (crowd +11.3, bodycam +14.4, lowlight +16.4), so J at k 0.6
# about -1.4 %; CBR L1 J -0.77 % [-2.98, +1.07] with that dCPU; Zen 5
# chart path (c8a.large) 376 -> 340 fps (SVT M12 427). The f-c3 variant
# (also pre-transform skip energy 30, skip bias off): quality J -11.74 %
# for +18.0 % CPU (about -0.9 % at k 0.6), 331 fps. One rate guard in
# both: one more rung of pool_meva_hospital_g301 overshoots (> 10 %); its
# key pulse improves 0.66 dB.
rate.prekey_quiet = 1

# The AV1 Default's 2026-11-16 bundle (79d53ba8b: no exact-rank margin, CDEF
# searched on every row, key-frame CfL) was measured on the Default only;
# pinned to the values this preset was screened with, so its streams do not
# move with the Default (key CfL alone was +45-52 % of a lowlight key frame).
decision.exact_rank_margin = 1.1
av1.keyframe_cfl = 0

# Effort by frame role, "base-only" (2026-11-16, docs/handoff/light-pipeline.md
# "Faster base-only"): keys and base frames code with Fast's per-block tools
# (below); non-base frames keep Faster's, the `light.*` values above. The
# base frames are the references the frames between them predict from, so
# their finer coding is spent once and paid back by every frame after.
# Against the previous Faster: c8a chart path x1.094 time (313.7 fps); lens
# Weighted / J -5.7 / -18.3 (the Faster -> Fast line at that time -1.5 /
# -15.2); CBR final-check (600 f, keys every 10 s) J -8.27 % [-9.60, -6.90]
# (line -3.38). Adopted over the periodic-key pulse guard (+1.11 dB,
# london_bus): the P frames before a key gain 0.6-2.5 dB and the frames
# after it are never worse in PSNR-Y; the key itself is 0.3-0.7 dB worse
# at 3 of 10 rung points, with 6-12 % fewer bits (its plan is rate
# control's: docs/handoff/rate-control.md).
decision.subpel_move_bias = 1
decision.subpel_move_bias_nonzero = 1
decision.subpel_fractional_bias = 1
decision.refine_cheap_vector = 1
av1.pre_tx_skip_model = 1
av1.pre_tx_skip_rd = 50
av1.partial_forward = 0
av1.pre_tx_skip_energy = 15
planner.depth_removal_min_quantizer = 0.8
planner.depth_removal_qp_scale = 2
planner.depth_removal_th_32_16 = 0
planner.depth_removal_th_16_8 = 0
av1.skip_bias_energy = 0.0625
decision.seed_refine_ratio = 1.1
effort.regular_fraction = 0
effort.light_nonbase_only = 1

# Adaptive tool thresholds (2026-11-17, docs/handoff/light-pipeline.md
# "Adaptive tool thresholds"): the sub-pel seed gate, the exact-rank margin
# and the integer-probe gate each move per clip and frame role (x0.5 to x4
# of the values above) towards the win rate their engine targets set, from
# the blocks just inside each gate. Against Faster (draw 2026-11-17, dCPU
# -2.0 % at k 0.6): L1 quality J -0.33 %; L2 J -1.58 % [-1.85, -1.34]; L3
# (ladder, 78 clips) J -1.43 % [-1.59, -1.28] BETTER, quality J full -0.3 %,
# no guards. x86 callgrind (gate build): chart clips CBR 600 x0.980, fixed QP
# (3 CTC sequences x 2 QPs) x0.992. Fixed-QP lens Weighted / J -5.7 / -18.3
# -> -6.1 / -18.4.
adapt.subpel = 1
adapt.rank = 1
adapt.probe = 1
# The motion search's zero-vector exits adapt too (2026-11-17, same
# handoff): against the Faster above, x86 callgrind x0.995 (chart clips, CBR
# 600); L1 quality J -0.81 %; L3 (78 clips, dCPU -0.5 % at k 0.6) J -0.59 %
# [-0.83, -0.36] BETTER; lens Weighted / J -6.1 / -18.4 -> -6.2 / -18.3.
# Depth removal's adaptation (`adapt.depth`) was level at +1.1 % CPU.
adapt.motion = 1
# Layer propagation (`layer_propagation.rs`, docs/handoff/block-aq.md "Layer propagation retry"):
# on layered mini-GOPs, T0 blocks the last period reused little go towards the top layer's
# quantizer, rounded to a 3-QP grid, stopping in the run-up to a scheduled key (`prekey`; without
# it the key was planned from the lowered level: long-window pulse +0.40 dB). Pool 2026-11-18:
# L3 J -1.32 % [-1.93, -0.77]; final-check J -0.88 % [-0.99, +0.21], no guard (PSNR-YUV +0.9 %,
# VMAF v1 -0.7 %, MS-SSIM -2.6 %; pan -3.1 %, lowlight +0.7 %); fixed-QP lens neutral.
layers.propagation = 1
layers.propagation_grid = 3
layers.propagation_prekey = 1
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
