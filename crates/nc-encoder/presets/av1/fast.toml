# Current Fast vs Default VAL: +4.384% PSNR/+3.451% V1; versus SVT
# +12.600% PSNR/-.690% V1. This remains a speed/quality tradeoff.
# Evidence: work/av1-post-demo-speed/seed010-val12/verification.json.
# Earlier probe-stage measurements below precede the seed .1 update.
