# AV1 SVC, three spatial layers: L3T1 (720p30 over 360p30 over 180p30, 2:1
# steps), the standard WebRTC ladder, so one stream serves thumbnail, mobile
# and full-size viewers. The AV1 Default's parameters plus the three-layer
# spatial defaults (docs/handoff/spatial-svc.md, section 12), written out so
# the tuner can move them. Its own optimisation target: measured on the SVC
# chart (eval/nceval/svc_chart.py, docs/results/svc-chart.md) by BD-J of
# operating point 0 at the total rate, with the 360p and 180p operating
# points as guards. `--temporal-layers 3` (or `--scalability L3T3`) gives L3T3.
spatial.layers = 3
spatial.s0_scale = 0.25
spatial.s1_scale = 0.5
# Nominal caps of the 180p and 360p layers (720p takes the rest plus their
# unspent bits): Gemini's recommendation from 10 pool clips (achieved shares
# 5 / 20 / 75%).
spatial.s0_rate_share = 0.08
spatial.s1_rate_share = 0.26
spatial.inter_layer = 1
spatial.enhancement_interval = 1
av1.compound = 1
# Takes AV1 Default's key still boost (rate.key_still_boost 6), key-period
# ceiling (rate.period_ceiling 1), unified second reference (structure.unified
# 1, L3T1 S0 slot 6 and L3T1_KEY slots 1/6/7) and inherited cadence depth
# (structure.inherited_depth 1): 11-clip [8] BD-J L3T1 720p +41.1% -> +39.2%
# [+40.5% -> +38.0%], 180p +6.2% -> +5.5%; L3T1_KEY 720p +7.7% -> +6.3%
# [+7.9% -> +5.7%], 360p +3.5% -> +2.5%, 180p +6.2% -> +5.7%.
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# The engine's still-level damping arrived with the AV1 Default (2026-11-19,
# docs/handoff/rate-control.md): not screened for this preset.
rate.still_level_damping = 0
# The key-period ledger's saving for the next period's key was dropped from the
# engine (2026-11-20, docs/handoff/rate-control.md): not screened for this preset.
rate.period_key_saving = 1
# The reuse term's key offsets unless the buffer bounds the key became the
# engine default (2026-11-21, docs/handoff/rate-control.md "Reuse offsets on
# keys"): not screened for SVC; AV1 L3 Medium's starved-key recovery
# (static_recovery) fell 0.2 dB outside its bound with it.
persist.reuse_keys = 1

# The Default's zero-trial split selector (planner.split_selector) stays off
# here until screened on this rung (docs/handoff/planner-selector.md).
planner.split_selector = 0
# Medium's key RD search and finer periodic keys (2026-11-21) and key trellis
# (2026-11-22) were screened on medium only.
planner.key_rd_split = 0
rate.key_level_finer = 0
quant.trellis_key = 0
# The inter-chroma skip's zero-residual veto (Default since 2026-11-22) is
# not screened on this rung yet: off, as before.
av1.chroma_skip_zero_scale = 0

# The zero-vector gates' superblock average (analysis.zero_gate_cell, engine
# default 0 since the 2026-11-22 bundle): not screened on this rung.
analysis.zero_gate_cell = 64
# Pinned before medium's fixed-QP cadence (period 8, base boost 4, no
# start-up cadence; 2026-11-22): screened on medium, slow and slower only.
rate.cadence_period = 4
rate.cadence_base_boost = 3
rate.cadence_startup_period = 8
# rate.key_cap_buffer 1.0 (engine default since 2026-11-22) not screened on this rung.
rate.key_cap_buffer = 0.8
# quant.trellis_lambda_scale 0.8 (AV1 default since 2026-11-23, medium) not yet screened on this rung.
quant.trellis_lambda_scale = 0.6
# Leaf penalty 1 in both modes: the fixed-QP profile codes leaf 2 (screened on medium's
# fixed QP only, 2026-11-24).
rate.cadence_leaf_penalty = 1

# Pinned before AV1 medium adopted proactive in-frame steering (Brief 21, 2026-11-24):
# not screened at L3/FC on this rung.
rate.in_frame = 0
