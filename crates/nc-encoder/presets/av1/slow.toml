# AV1 slow (`--preset slow`): the Default plus the RD partition search with its
# context gate (`nc_encoder` `rd_split.rs`, `depth_context.rs`;
# docs/handoff/rd-split-gate.md): inter nodes decided by coding the plan's
# alternative where the neighbours' and co-located leaf sizes suggest it.
# The rung between medium and slower on AV1's front (docs/handoff/presets.md
# "The ladder"). Against medium, preset-ladder 2026-11-21 (16a104a1b): whole-encode
# fps 136.7 -> 98.7 (1.38x the time) (combined: Graviton 3/4 and Zen 5, log-equal ARM/x86, 720p CBR 600,
# 4 quick clips); final check (34 clips, 600 f, keys every 10 s, draw 2026-11-21)
# J -2.92 % [-3.68, -1.75], no guard.
planner.rd_split = 1
planner.rd_split_context = 1
# The second reference on every frame, held: the last high-quality frame stays the
# second reference for up to 5 s (re-armed at a new one, released while the camera
# moves; docs/handoff/background-reference.md). With it this rung measured (151ac8ab8,
# same method) 1.48x medium's time, J -4.45 % against medium, no guard, against 1.36x and
# -2.36 % for the gate alone: 1.3 J better than the medium-slower chord.
structure.unified = 0
refs.second = 2
refs.second_hold = 5
refs.second_hold_rearm = 1
refs.second_hold_moving = 1

# Layer propagation on the flat stream's QP-cadence cycles (layer_propagation.rs,
# docs/handoff/temporal-lambda.md). nceval.train (k 0.1, base f953cd97d): L3 (n 108)
# -0.68 % [-1.34, -0.08] BETTER, final-check (n 34) -1.51 % [-2.09, -0.98] BETTER; whole encode cycles Graviton3 +2.70 %, Zen 5 +3.39 % (AV1 slow).
layers.propagation = 1
layers.propagation_flat = 1
layers.propagation_grid = 3
layers.propagation_prekey = 1
# Key RD search behind a 1.2 gate, one level each way, with the Default's key
# trellis and finer periodic keys: nceval.train against 3ebca4466 (draw
# 2026-11-22, k 0.1), L3 J -0.83% [-1.35, -0.32], final check (600 f) -0.57%
# [-0.88, -0.28], no guard; Zen 5 cycles +4.08% [+3.64, +4.52].
planner.key_rd_margin = 1.2
planner.key_rd_deeper = 1
planner.key_rd_shallower = 1
# The key-frame searches medium had (2026-11-22) stay on this rung, which
# screened them in its own window; medium reverted them (chart-timing cost).
planner.key_rd_split = 1
# Periodic keys at rate.key_cap_buffer 1.0 (the engine default), the first key at 0.8:
# nceval.train at both key shares (base 764c45048, front k), L3 byte-identical (one-key
# streams), final check BETTER at 1/150 and 1/300 (-1.11 / -0.39 %).
rate.key_cap_buffer_first = 0.8
# Cadence depth above 1 (structure.depth_max 1.35, noise cap 0.75): kept on this rung when
# medium dropped it (2026-11-24): re-validated under the benchmark's conditions, quick J
# (L1 / 1/150 / 1/300) slow -0.50 / -0.73 / 0.00%, slower -0.40 / -0.77 / -0.80%.
structure.depth_max = 1.35
structure.depth_deep_max_noise = 0.75
# Leaf penalty 1 in both modes: the fixed-QP profile codes leaf 2 (screened on medium's
# fixed QP only, 2026-11-24).
rate.cadence_leaf_penalty = 1

# Inherits rate.in_frame = 1 and rate.in_frame_proactive = 1 from AV1 Default
# (draw 2026-11-26, L3 n=98: J +0.00% [-0.19, +0.19], unweighted -0.05%,
# 0 guards, periodic-key pulse 2 s -0.04 dB / 10 s -0.03 dB).
# The Default's `persist.reuse_keys` 0 (2026-11-27) is not screened on this rung: the engine value.
persist.reuse_keys = 2
