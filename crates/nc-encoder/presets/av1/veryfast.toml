# The walk's quarter stage after an unmoved half stage is replaced by the step a parabola
# through the half stage's costs predicts (adapt.quarter, a switch probing the stage one
# opportunity in 8; at target 0.02 it takes the parabola nearly everywhere, which is where the
# gain comes from: docs/analysis/adaptive-thresholds-2026-11-23.md). nceval.train 2026-11-23
# (base 00f777521, CPU on its own encodes): dCPU L3 -0.64 %, final -1.54 / -1.20 % at
# 1/150 / 1/300; quality alone 0.00 %; at the CBR front slope k 0.4074 L3 J -0.27 %
# [-0.40, -0.11], final check -0.58 % [-0.71, -0.41].
adapt.quarter = 1
adapt.quarter_target = 0.02
decision.subpel_quarter_predict = 2

