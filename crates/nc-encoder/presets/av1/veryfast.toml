# The partial forward transform only at coarse quantizers (shared gate): with
# av1.partial_forward 2 and av1.inter_tx_split 0, large inter blocks could code no
# high frequencies at any quantizer, so P frames stopped at 28-34 dB where the key
# reaches 37-39 (first-key study, docs/analysis/first-key-2026-11-25.md on branch
# first-key). Quick on this rung (draw 2026-11-25, L1 24 clips, benchmark CBR
# conditions): J -2.05% [-4.14, -0.38]; long probes 1/150 +0.28%, 1/300 -0.76%;
# cycles -0.4 to +0.6% (c8i.2xlarge / c8g.2xlarge). Landed on the owner's order of
# 2026-11-25 with the L3, final-check and Fixed QP screens curtailed.
gate.partial_transform_min_quantizer = 0.5
