av1.chroma_skip_zero_scale = 0
av1.pre_tx_skip_model = 1
av1.pre_tx_skip_rd = 50
av1.pre_tx_skip_energy = 15
av1.skip_bias_energy = 0.0625
effort.regular_fraction = 0
effort.light_nonbase_only = 1
