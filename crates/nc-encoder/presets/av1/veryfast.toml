# AV1 Veryfast: the speed point below AV1 Faster, at SVT-AV1 M13 (--rtc) speed
# (av1-veryfast agent, 2026-11-16; docs/handoff/av1-veryfast.md).
# AV1 Faster plus the six levers with the least quality lost per time saved,
# picked from a single-lever ablation on Faster (lever ledger, base faster:
# `python3 -m nceval.levers table --codec av1 --base faster --rate lens`):
# c8a.large chart-path time, Jetson cycles, the fixed-QP lens and a CBR pool
# L1 screen per lever. The bundle against Faster: c8a chart path 348 -> 419
# fps (SVT M13 459, M12 430 in the same session), Jetson cycles -11.2%;
# final-check (600 f, keys every 10 s, 27 clips) quality J +10.42%
# [+9.35, +11.54], periodic-key pulse +0.29 dB balanced; fixed-QP lens J /
# Weighted against x264 medium -13.5 / +2.1 -> -7.0 / +8.4.
# Three temporal layers on every stream except shaking cameras (below, with
# the key planned against its mini-GOP's mean step): see "Fixed layers" and
# "Shaking cameras flat" at the end.
#
# AV1 Faster's settings, pinned so this preset does not move with it (its
# probe threshold is left out: Veryfast's base frames probe at the engine's
# threshold, as measured, and its other frames do not probe).
decision.subpel_move_bias = 1.1
decision.subpel_move_bias_nonzero = 1.1
decision.subpel_fractional_bias = 1.1
decision.refine_cheap_vector = 0
av1.inter_tx_split = 0
av1.pre_tx_luma_dominant = 1
av1.pre_tx_skip = 1
light.av1.pre_tx_skip_model = 0
light.av1.pre_tx_skip_rd = 100
av1.pre_tx_skip_score = 70
av1.residual_rd_max_mv = 8
av1.transform_rd_gain_scale = 1.25
av1.transform_rd_skip = 2
av1.transform_rd_skip_chroma = 1
av1.transform_rd_uv_max_noise_sigma = 1
decision.subpel_walk = 2
decision.subpel_walk_max_noise_sigma = 1
av1.chroma_delta_q = -24
chroma.policy = 0
av1.chroma_noise_scale = 2
av1.cdef_per_superblock = 1
av1.cdef_local_strong_luma = 1
av1.cdef_local_strong_primary = 15
av1.cdef_local_strong_variance_min = 0
av1.cdef_local_noise_full_search_sigma = 0
av1.cdef_local_strong_model_scale = 3
# Deblocking on key and base frames only (off on the rest, as before on every
# frame), as AV1 Faster. Fixed QP (24 clips) J -2.5% [-3.4, -1.8] (everywhere
# -3.1% at +5.0% P instructions); whole encode Zen 5 +2.79%, Graviton3 +2.42%,
# Graviton4 +2.75%. nceval.train (k 0.6): L3 (n 107) -1.91% [-2.30, -1.50],
# final-check (n 34) -2.55% [-3.39, -1.78] BETTER. L3's periodic-key pulse guard
# (bodycam_antare_0815, +0.78 dB) comes from better keys: there (150 f, key every
# 50, CBR 105/211/422) key PSNR-Y +1.08 / +0.92 / +0.58 dB, the P frames before
# the keys +0.49 / +0.30 / +0.12 dB and after them +0.48 / +0.27 / +0.21 dB, so
# not a block (owner rule). Keys unfiltered instead keeps the pulse but loses
# about a fifth of the gain there.
av1.loop_filter = 1
nonbase.av1.loop_filter = 0
planner.depth_removal_min_quantizer = 0
quant.trellis = 0
av1.keyframe_directional = 0
av1.keyframe_angle_deltas = 0
av1.keyframe_filter_intra = 0
av1.keyframe_intra_modes = 0
# Key frames no longer DC-only (owner decision, 2026-11-19: DC-only keys look
# bad): DC, the smooth modes, Paeth, vertical and horizontal ranked by SATD,
# re-ranked by the transform-domain model RD (KEY_LEVEL_RATE), the winner
# coded without a further trial; blocks DC predicts within 150 squared
# error per sample stay DC. AV1 Faster key (720p chart clips, q195) against
# DC-only: +25..+31 % key instructions, bytes -1.0..-1.9 %, PSNR-Y
# 0..+0.08 dB. CBR keys every 2 s (6 static + 6 moving clips): key PSNR-Y
# +0.075 / +0.062 dB, whole-stream +0.024 / +0.020 dB. Pool L1 (AV1 Faster):
# quality +0.13 % (neutral), J_real +1.27 % [+0.96, +1.59] at dCPU +1.9 %:
# J-neutral at about +2 % CPU, landed on the owner's call. Full final-check
# owed. docs/handoff/vp9-av2.md "AV2 on the Pareto frontier". Pinned back
# to DC here from 5a8d64c20 until the starved-key recovery was fixed in
# rate control (a requested key now carries the earlier key's unpaid loan,
# `carried_loan_boost`): `static_recovery` passes with them again.
# DC, smooth, vertical and horizontal only (the engine's core set): smooth
# vertical / horizontal and Paeth add 7 % of the gain (6 VAL clips, modelled
# RD over DC) for 3 of the 7 predictions.
av1.keyframe_satd_modes = 4
av1.keyframe_model_candidates = 7
av1.keyframe_intra_rd_candidates = 1
av1.keyframe_flat_gate = 150
# The gate per size: threshold x3 per doubling above 8x8 (mode choice pays on
# small blocks; fitted on every-mode-RD-costed key dumps, no lambda term).
# With the core set at gate 150: AV1 Faster key +13 % over DC-only (seven
# modes at gate 300 +18 %, at one gate 150 +28 %), bytes -1.1..-1.9 %
# (-0.5..-1.4 %, -1.0..-1.9 %), PSNR-Y -0.01..+0.05 dB.
av1.keyframe_flat_gate_size_scale = 3
decision.intra_directional = 0
av1.inter_intra_search = 0
av1.partial_forward = 2
light.av1.pre_tx_skip_energy = 100
decision.codec_subpel_seed_lambdas = 0.1
av1.cdef_search_row_step = 8
av1.cdef_local_search_period = 4
layers.count = 3
av1.inter_rounding_q7 = 32
light.av1.skip_bias_energy = 0.25
decision.seed_refine_ratio = 0
rate.period_ceiling = 0
structure.unified = 0
rate.key_still_boost = 0
structure.inherited_depth = 0
planner.depth_removal_th_32_16 = 25
planner.depth_removal_th_16_8 = 50
rate.prekey_quiet = 1
decision.exact_rank_margin = 1.1
av1.keyframe_cfl = 0
#
# The Veryfast levers. Each alone on Faster (2026-11-16): c8a chart-path
# time (chart clips at the 600k-rung QP matched per variant, 2 repeats) /
# Jetson cycles (jperf, min of 3, same clips and QPs) / CBR pool L1 quality J
# (draw 2026-11-16, 24 clips, dCPU 0) / fixed-QP lens J and Weighted (BD
# points against x264 medium, change from Faster):
# Chroma skipped below 7/8 of the luma SAD threshold (Faster: the codec's 5):
# -1.7% / -2.2% / +2.2% / +0.2, +0.2.
light.av1.chroma_skip_sad_num = 7
# Inter blocks of 32x32 and up only: -8.7% / -4.1% / +2.7% / +1.6, +1.8.
light.planner.inter_min_log2 = 5
# Depth removal twice as eager as Faster's: -1.9% / -1.1% / +0.9% / +0.5,
# +0.4.
planner.depth_removal_qp_scale = 8
# One NEARMV candidate: -0.8% / -1.6% / (not screened alone) / +0.2, +0.3.
light.av1.near_count = 1
# No integer-neighbour probes: -3.0% / -2.0% / +2.6% / +1.4, +1.2.
light.decision.codec_fullpel_probe = 0
# Key frames planned by source variance (not the RD key planner): -5.4% /
# -4.4% / +1.8% / +3.1, +2.9.
planner.intra_plan = 1
#
# Fixed layers. Three temporal layers on every stream, not Faster's gated
# ones: -6.7% c8a chart-path time
# and -8.4% Jetson cycles. Alone they deepened the periodic-key pulse (+0.86
# dB balanced; the layered key was planned at T0's level); the key planned
# against the mini-GOP's mean step (`rate.key_level_mean`) removes that.
# Against Veryfast with gated layers (2026-11-16): pool L3 (78 clips, ladder,
# dCPU -7.8% at k 0.6) J -0.73% [-2.11, +0.69], quality +4.5% (bodycam
# +14.7%: shaking cameras that the gates kept flat); final-check (600 f,
# keys every 10 s, 27 clips) quality J +2.65% [+1.86, +3.54], periodic-key
# pulse -0.93 dB balanced (worst clip +1.19 dB). Chart clips: x86
# instructions -10.1%. Taken for speed: it moves Veryfast from between
# SVT M12 and M13 to about M13's speed at better J (docs/handoff/av1-veryfast.md).
rate.key_level_mean = 1
#
# Shaking cameras flat (2026-11-16): fixed layers cost the bodycam class
# +14.7% quality on the pool (the shaking cameras Faster's jitter gate
# keeps flat, `AdaptiveRule::max_camera_jitter`). Layers stay adaptive with only the camera-jitter gate
# (Faster's other gates off, the camera-motion gate opened to 64 so that a
# steadily moving camera stays layered). A jitter limit of 8 keeps the
# chart bodycam (30 fps) layered and turns the pool's shaking 10 fps
# bodycams flat; 2 (Faster's) kept the chart bodycam flat and lost the
# speed. Against fixed layers: x86 instructions +0.5% on the chart clips
# (150 f, Veryfast's chart QPs), about +1.4% on the pool (class-balanced;
# bodycams +5.2%); pool L3 (78 clips, k 0.6) J -1.77% [-3.14, -0.39] at
# dCPU +0.5%, -1.23% [-2.60, +0.15] at +1.4%, quality -2.07% balanced
# (bodycam -8.4%); final-check (600 f, keys every 10 s, 28 clips) quality
# J -0.14% [-0.37, +0.10].
layers.adaptive_max_camera_motion = 64
layers.adaptive_max_compensable = 1
layers.adaptive_max_camera_jitter = 8
#
# Effort by frame role, "base-only" (2026-11-17, docs/analysis/zen5-fixed-qp-goal.md
# "Veryfast and Faster base-only re-mix"): keys and base frames (T0) code
# with Faster's values of the four Veryfast per-block levers and Fast's
# pre-transform skip and skip bias (below); the other frames keep the
# Veryfast values, the `light.*` lines above. The base frames are what the
# frames between them predict from. Against Veryfast (build e329c8b59):
# fixed-QP lens Weighted / J against x264 medium +7.7 / -6.2 -> +3.3 / -10.4;
# c8a.large fixed-QP chart timing 1087.3 -> 1044.3 and 1082.4 -> 1037.2 fps
# (two sessions; SVT-AV1 M13 986.4 / 978.9 in the same sessions); x86
# callgrind, CBR 600 kbit/s on the chart clips, +4.9 %; CBR pool L3 (draw
# 2026-11-17, 78 clips, dCPU +4.9 % at k 0.6) J -1.27 % [-1.89, -0.68]
# BETTER, quality -4.2 %, no guard. Fast's subpel and refinement values on
# the base frames as well: +2.4 / -10.6 at 1022 fps, CBR L3 -0.46 %
# [-1.11, +0.15] (dCPU +7.4 %); with Fast's depth removal and full forward
# transform too: +1.2 / -10.9 at 949 fps, slower than M13.
planner.inter_min_log2 = 4
av1.near_count = 3
decision.codec_fullpel_probe = 1
av1.chroma_skip_sad_num = 5
av1.pre_tx_skip_model = 1
av1.pre_tx_skip_rd = 50
av1.pre_tx_skip_energy = 15
av1.skip_bias_energy = 0.0625
effort.regular_fraction = 0
effort.light_nonbase_only = 1
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# The engine's still-level damping arrived with the AV1 Default (2026-11-19,
# docs/handoff/rate-control.md): not screened for this preset.
rate.still_level_damping = 0
# Zero-vector SADs from pre-analysis, as H.264 Veryfast (fast-analysis,
# 2026-11-21): the zz gates and the zero grid of static SBs read the
# pre-analysis 8x8 SADs instead of re-reading both frames. Jetson cycles
# -1.04% (pan / crowd / bodycam / static -0.28 / -1.02 / -0.96 / -1.90), x86
# -0.02% instructions; CBR pool at k 0.6 (dCPU -0.70) L1 -0.41%
# [-0.75, -0.06], L2 -0.15% [-0.35, +0.05], L3 -0.52% [-0.77, -0.29] BETTER
# (n 108), no guards; final-check (600 f, keys every 10 s, 34 clips) J -0.01%
# [-0.15, +0.17], no guards: quality unchanged on long windows for the CPU
# saved. static_recovery passes.
analysis.zero_sads_from_pre = 1

# The trellis's cheap substitute (`quant.rd_trim`, docs/handoff/cheap-rdoq.md): trailing
# ±1 and whole-block rules on coded luma. nceval.train (da811e9099, base eb55cd325, draw
# 2026-11-21, k 0.6): L3 J -0.70 % [-0.90, -0.51] n=108, final check J -0.11 % [-0.37,
# +0.10] n=34; cycles -0.7 / -0.6 / -0.1 % (Graviton 3 / 4, Zen 5).
quant.rd_trim = 1
quant.rd_trim_block = 1
