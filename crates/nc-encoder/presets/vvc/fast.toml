# VVC fast (`--preset fast`): the rung between medium and faster on VVC's front
# (docs/handoff/presets.md "The ladder"): VVC faster (presets/vvc/faster.toml, VVC's
# fast until 2026-11-21, with every parameter repeated here so it does not move when
# faster does) plus the two of the Default's levers with the most J per instruction
# that faster leaves out (ladder-spacing's per-lever screens on VVC Fast,
# 2026-11-20: ALF quality -5.1 % at +13.4 %, trellis -3.3 % at +22.8 % x86 P
# instructions). preset-ladder 2026-11-21 (16a104a1b): whole-encode fps 1.30x
# faster's time, medium 1.59x this rung's (combined: Graviton 3/4 and Zen 5,
# log-equal ARM/x86, 720p CBR 600, 4 quick clips); final check (34 clips, 600 f, keys
# every 10 s, draw 2026-11-21) J against medium +9.35 % [+8.65, +9.99], faster
# +16.29 %: 1.0 better than the medium-faster log-speed chord.
vvc.alf = 1
quant.trellis = 1
vvc.inter_intra_dc_only = 1
vvc.sao_skip_unchanged = 1
vvc.fast_forward = 1
vvc.pre_transform_zero_scale = 2
vvc.rd_candidates = 2
vvc.chroma_search = 0
decision.codec_subpel_seed_lambdas = 0.3
decision.refine_cheap_vector = 0
vvc.sao_search_interval = 8
vvc.isp = 0
vvc.temporal_mvp = 1
vvc.merge_candidates = 2
vvc.angular_candidates = 1
vvc.angular_step = 8
decision.exact_rank_margin = 1.0
decision.intra_directional = 0
vvc.tx64 = 1
vvc.sao_luma_lambda_scale = 1.4
vvc.chroma_qp_offset = -1
decision.lambda_scale = 0.8
vvc.inter_rounding = 95
vvc.unit_zero_rd = 0
rate.fixed_qp_profile = 0
planner.depth_removal_th_32_16 = 25
planner.depth_removal_th_16_8 = 50
adapt.subpel = 1
adapt.rank = 1
adapt.probe = 1
rate.fixed_qp_moving_key = 0
rate.period_ceiling = 1
rate.key_still_boost = 6
rate.prekey_quiet = 1
rate.still_level_damping = 0.5
structure.unified = 1
structure.inherited_depth = 1
decision.final_stage = 0
decision.subpel_quarter_needs_half_move = 1
decision.subpel_quarter_predict = 1
decision.max_cheap_vectors = 2
vvc.zero_residual_texture = 2
planner.split_selector = 0
vvc.sao_stats_row_step = 4
# Filter-search effort by usage (nc_encoder::UsageGate): on inter pictures, base
# ones included, CTUs coded as skip over at least 3/4 of their area keep SAO and ALF
# off without statistics (refreshed every 8 pictures, staggered). nceval.train (k 0.6,
# base 1cb80965c): L3 J -1.64 % [-1.92, -1.36] n108 BETTER, final check -0.05 %
# [-0.17, +0.08] n34 BETTER, no guard; whole encode cycles Graviton3 -2.32 %,
# Graviton4 -2.43 %, Zen 5 -1.56 % (non-base only: L3 -0.98 %;
# docs/handoff/filter-effort.md).
filter.usage_base = 1
filter.usage_quiet_share = 0.75

# Layer propagation (the codec Default's flat-stream form, docs/handoff/temporal-lambda.md)
# stays off here: its k 0.6 charge on +3-4 % CPU (VVC faster, measured) outweighs the quick gain
# (L1 +0.29 %, probe -0.47 %).
layers.propagation = 0
