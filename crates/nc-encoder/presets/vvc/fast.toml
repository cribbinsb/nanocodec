# (`rate.fixed_qp_moving_key = 6`). nceval.fixedqp ab (draw fixedqp-2026-11-24, n=24):
# 150 f J -1.6% [-3.0, -0.3], 600 f J -1.7% [-2.7, -1.0]; fixed-QP CPU (aws_cpu_ab, c8i / c8g):
# +1.07% / +0.94% (mean +1.01%; -1.69% J / 1% CPU vs front slope -0.290). CBR streams are byte-identical.
fixed_qp.refs.second_full = 0
