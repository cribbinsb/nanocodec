# VVC slower (`--preset slower`): the rung between slow and veryslow on VVC's front
# (docs/handoff/presets.md "The ladder"), from the gap study pl-s3k-vvc-slow (trial 78;
# seeded from both neighbours): slow (presets/vvc/slow.toml, below) with the RD
# partition search ungated, 8x8-minimum inter CUs, a wider intra search (10 RD and 5
# angular candidates), SAO searched on every CTB and no second reference (values set
# in place below). preset-ladder 2026-11-21 (ff40ad7bf): whole-encode 1.39x slow's time,
# veryslow 1.67x this rung's (Graviton 3/4 and Zen 5, 720p CBR 600); final check (34
# clips, 600 f, draw 2026-11-21) J -10.41 % against medium (slow -4.71, veryslow -12.78
# on the same build), 2.55 better than the slow-veryslow log-speed chord; L3 (108 clips,
# 150 f) -9.05 % (slow -4.37, veryslow -10.82), 2.15 better than the chord.
#
planner.rd_split = 1
planner.rd_split_context = 0
planner.rd_split_deepen_context = -3
# The Default's filter-search effort by usage (filter.usage_quiet_share, 2026-11-21)
# is not screened here.
filter.usage_quiet_share = 0
# Set by the pick, not in the file it starts from:
decision.codec_subpel_seed_lambdas = 0.07408
decision.final_margin_lambdas = 0.02475
decision.intra_gate_variance = 59
decision.subpel_walk = 1
decision.winner_walk_steps = 0
planner.inter_min_log2 = 3
planner.rd_split_merge_context = -4
planner.split_selector = 1
planner.split_selector_scale = 0.4525
refs.second = 0
structure.unified = 1
vvc.angular_candidates = 5
vvc.chroma_search_inter = 0
vvc.coarse_inter_intra = 1
vvc.fast_forward = 1
vvc.pre_transform_zero_scale = 2
vvc.rd_candidates = 10
vvc.sao_search_interval = 1
# Layer propagation (the Default's flat-stream form, docs/handoff/temporal-lambda.md)
# stays off: this rung was measured without it (on ff40ad7bf, before it reached slow).
layers.propagation = 0
# Key RD search behind a 1.5 gate, two levels each way, periodic keys 3 QP
# units finer (nceval.train against 3ebca4466, draw 2026-11-22, k 0): L3 J
# -1.25% [-1.71, -0.81], final check (600 f) -0.76% [-1.00, -0.51], no guard.
planner.key_rd_split = 1
planner.key_rd_margin = 1.5
planner.key_rd_deeper = 2
planner.key_rd_shallower = 2
rate.key_level_finer = 3
# Periodic keys at rate.key_cap_buffer 1.0 (the engine default), the first key at 0.8:
# nceval.train at both key shares (base 764c45048, front k), L3 byte-identical (one-key
# streams), final check BETTER at 1/150 and 1/300 (-0.67 / -0.34 %).
rate.key_cap_buffer_first = 0.8

# G2 motion / sub-pel exit shifts: VVC medium's (DEFAULT_PARAMS, 2026-11-23)
# pinned off here, not screened on this rung.
analysis.window_exit_shift_bias = 0
analysis.window_exit_shift_lambda = 0
analysis.window_exit_shift_noise = 0
analysis.window_exit_shift_nonbase = 0
analysis.zero_gate_shift_bias = 0
analysis.zero_gate_shift_lambda = 0
analysis.zero_gate_shift_neighbour_mv = 0
analysis.zero_gate_shift_noise = 0
analysis.zero_gate_shift_nonbase = 0
decision.skip_no_refine_shift_bias = 0
decision.skip_no_refine_shift_lambda = 0
decision.skip_no_refine_shift_noise = 0
decision.skip_no_refine_shift_nonbase = 0
decision.subpel_seed_shift_bias = 0
decision.subpel_seed_shift_lambda = 0
decision.subpel_seed_shift_noise = 0
decision.subpel_seed_shift_nonbase = 0
decision.subpel_seed_shift_size = 0
decision.subpel_seed_shift_zero_mv = 0

# The second reference by the cheap ranking at fixed QP, as before: VVC's fixed-QP profile
# took the full decision (`refs.second_full = 1`, 2026-11-24, Brief 20) screened on medium
# and slow only; this rung is not yet screened with it.
fixed_qp.refs.second_full = 0
