# VVC slow (`--preset slow`): the Default plus the RD partition search with its
# context gate (`nc_encoder` `rd_split.rs`, `depth_context.rs`;
# docs/handoff/rd-split-gate.md): inter nodes decided by coding the plan's
# alternative where the neighbours' and co-located leaf sizes suggest it.
# Deeper splits ungated (planner.rd_split_deepen_context 3): VVC's D -1 gate
# lost 1.2 J for 7 points of CPU.
# The rung between medium and slower on VVC's front (docs/handoff/presets.md
# "The ladder"). Against medium, preset-ladder 2026-11-21 (16a104a1b): whole-encode
# fps 79.5 -> 58.9 (1.35x the time) (combined: Graviton 3/4 and Zen 5, log-equal ARM/x86, 720p CBR 600,
# 4 quick clips); final check (34 clips, 600 f, keys every 10 s, draw 2026-11-21)
# J -3.71 % [-4.43, -3.15]; the long-window key-pulse guard
# at +0.52 dB against 0.50 passed on judgement (better P frames read as a pulse,
# 0/34 clips worse in rd-gate's train).
# rd-gate train (k 0.1): L3 J -0.86 % [-1.11, -0.61] n108, final check -4.32 %
# [-5.29, -3.25] n34.
planner.rd_split = 1
planner.rd_split_context = 1
planner.rd_split_deepen_context = 3
# The Default's filter-search effort by usage (filter.usage_quiet_share, 2026-11-21)
# is not screened here.
filter.usage_quiet_share = 0
# Medium's key RD search and finer periodic keys (2026-11-21) were screened on medium only.
planner.key_rd_split = 0
rate.key_level_finer = 0
# Periodic keys at rate.key_cap_buffer 1.0 (the engine default), the first key at 0.8:
# nceval.train at both key shares (base 764c45048, front k), L3 byte-identical (one-key
# streams), final check BETTER at 1/150 and 1/300 (-1.33 / -0.45 %).
rate.key_cap_buffer_first = 0.8

