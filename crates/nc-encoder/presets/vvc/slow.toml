# fps 79.5 -> 58.9 (1.35x the time) (combined: Graviton 3/4 and Zen 5, log-equal ARM/x86, 720p CBR 600,
# 4 quick clips); final check (34 clips, 600 f, keys every 10 s, draw 2026-11-21)
# J -3.71 % [-4.43, -3.15]; the long-window key-pulse guard
# at +0.52 dB against 0.50 passed on judgement (better P frames read as a pulse,
# 0/34 clips worse in rd-gate's train).
# rd-gate train (k 0.1): L3 J -0.86 % [-1.11, -0.61] n108, final check -4.32 %
# [-5.29, -3.25] n34.
planner.rd_split = 1
planner.rd_split_context = 1
planner.rd_split_deepen_context = 3
