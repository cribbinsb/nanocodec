# VP9 Fastest: the speed point below VP9 Faster (vp9-faster agent,
# 2026-11-12; docs/handoff/vp9-faster.md). Against libvpx VP9 rt 9 (chart
# 2026-11-12: BD-J -5.7%, 47.8 / 113 fps). vp9-faster plus the cheapest
# remaining cuts; bundle vs vp9-fast: J_real quality +30% (L1 draw of
# 2026-11-12, 24 clips; bodycam and lowlight lose most), Jetson -41.6% (CBR
# 600, chart clips), x86 instructions -41.7%. Long GOP (900 f, one key,
# 600 kbps): a constant loss, no drift (handoff).
#
# vp9-faster's round-1 levers (its libvpx real-time pair costs more than it
# saves here: +4.1% for -3.0% on top of this), then vp9-fast:
# vp9-fast, listed so these streams do not move with it. VP9 Fast: the
# speed point (docs/PROCEDURES.md "Preset roles"). Bars
# (coordinator, 2026-11-09): CPU <= ~1.4x our HEVC Fast on the Jetson, and
# J_real vs our HEVC Fast with no class guard failing; judged at Fast's k 0.6.
#
# Smaller inter transforms only for locally concentrated residual (HEVC's
# inter_tu_split_spread): crowd 720p q230, Jetson -7.2% / x86 -3.9% CPU;
# J_real TRAIN quality vs Default +1.6% full / +1.2% low (proxy-6).
vp9.inter_tx_split_spread = 1.5
# HEVC Fast's sub-pel gates (seed variance 0.05 lambdas, move biases 1.1)
# and the quarter-sample stage only after a half-sample move: with the
# spread gate off, Jetson about -6%, x86 -7.3% CPU; quality vs Default
# (proxy-4) +3.4% full / +2.5% low, pan worst.
# Since 2026-11-21 the seed gate also gates the bilinear ranking's winner
# refinement (fast-decision, docs/handoff/fast-decision.md): Jetson cycles
# -3.0%, x86 -3.55%; pool L3 J -1.30% [-1.43, -1.15] at k 0.6 (quality
# +0.85%), final-check quality +0.48% [+0.23, +0.97], no guards.
decision.codec_subpel_seed_lambdas = 0.05
decision.subpel_move_bias = 1.1
decision.subpel_move_bias_nonzero = 1.1
decision.subpel_fractional_bias = 1.1
decision.subpel_quarter_needs_half_move = 1
# 32x32 transforms code only their low 16x16 frequencies (encoder-side
# forward approximation; NEON computes only those): crowd 720p q230 Jetson
# -3.9%, x86 +1.6% (full forward then zeroed there), weighted -2.1%; J_real
# TRAIN quality vs Default +0.2% full / +0.3% low (proxy-6, no guards),
# J at Fast's k 0.6 about -1.0%.
vp9.partial_forward = 1
# Inter blocks whose largest transform codes at most 4 levels skip the
# smaller transform sizes: Jetson -9.4%, x86 -7.4% (weighted -8.7%); J_real
# full TRAIN at k 0.6 BETTER, -4.9% (quality +0.6% full / +0.1% low, no
# guards); long GOP (one key, 300 frames, crowd and pan at 400 kbps) holds
# its trend.
vp9.tx_search_min_levels = 4
# Trellis quantisation is a Default quality arm (J_real quality -1.3% for
# +6.4% host / +11.2% Jetson P-frame CPU); Fast keeps the plain quantiser.
quant.trellis = 0
# Fast keeps Default's start-up QP cadence (base boost 4) and cadence motion
# gate: proxy-6 J_real (k 0.6) vs both off BETTER -1.3%, no guard, pulse
# -0.02 dB; CPU-neutral (docs/handoff/vvc.md, qp-cascade).
# Default's key-frame trellis, unshaved levels, ungated P-frame intra and
# fine-quantizer small blocks are quality arms; Fast keeps the cheaper
# engine values.
quant.trellis_key = 0
vp9.shave_gap = 8
planner.depth_removal_min_quantizer = 0
# The P-frame intra mode estimate is on (2026-11-23 retune, end of file).
vp9.intra_mode_estimate = 1
# QP cadence 1.4x the engine's (the Default takes 1.2; 2026-11-11): J_real
# (k 0.6) vs 1, TRAIN -1.9%, VAL -1.7%, no guard.
rate.cadence_scale = 1.4
#
# The Faster levers (quality / Jetson time, each alone vs vp9-fast):
# Intra blocks of inter frames take DC without a mode search (-0.6 / -2.3%).
vp9.inter_intra_dc_only = 1
# No reuse-term refinement of still blocks (-0.2 / -1.2%; static_recovery
# still passes).
persist.reuse = 0
# Round 4 (2026-11-13): libvpx real-time intra masks (luma DC/V/H, chroma
# DC; vp9_speed_features.c): pool L1-L3 (n 127) quality +0.07%, J -0.75% [-1.08, -0.45], BETTER at k 0.6;
# Jetson -1.1%, x86 -6.2% on 31 f (its key frame).
vp9.intra_mode_search = 2
# Inter residual within 3x the zero proof's bound is dropped before the
# transform (+0.6 / -2.2%).
vp9.pre_transform_zero_scale = 3
# Inter blocks code their largest transform only (+4.8 / -6.2%; with the
# 16x16 cap together -12.9%).
vp9.inter_tx_depth = 0
# Non-base frames of the QP cadence (3 of 4) skip the loop filter
# (+3.4 / -4.4%; long GOP in the handoff).
nonbase.vp9.filter_level_scale = 0
#
# The Fastest levers (quality / Jetson time, alone vs vp9-fast where
# measured):
# Luma energy pre-transform skip (AV1's light-PD1 test) at 8 and inter
# transforms at most 16x16 (as vp9-faster). Re-tuned 2026-11-18 from 15 and
# 8x8, which cost most of Veryfast's BD on phone video calls (VC-1K, dark
# clips worst): pool L1 (2026-11-18 draw, n 24) quality J -8.34%, x86
# instructions +3.2% (callgrind, 60 f CBR 300/800 on three 720p CTC clips),
# J at k 0.6 -6.42%; L2 -5.22%, L3 -6.23% [-7.35, -5.06] (n 108);
# final-check quality -3.94% [-5.43, -2.76]. Energy 5: -9.54% for +5.8%;
# 0: -10.40% for +9.0%; the 16x16 cap alone: -2.52% for -2.2% but static
# class +4.45%.
vp9.pre_tx_skip_energy = 8
vp9.inter_max_tx_log2 = 4
# Intra blocks code their largest transform only.
vp9.intra_tx_depth = 0
# Key frames planned by source variance (+1.3 / -1.0%).
planner.intra_plan = 1
# Pre-analysis on even rows of a decimated half level (h264-faster's).
analysis.preanalysis_rows = 1
analysis.pyramid_downsample = 2
# HME: range 8, skipped below SAD 8 per pixel; level 1 back on (2026-11-23 retune, end
# of file).
analysis.hme_range_x = 8
analysis.hme_level1 = 1
analysis.skip_hme_sad_per_pixel = 8
# Half-sample vectors only.
decision.subpel_half_only = 1
# Non-base frames search a full-pel window of half width 1.
nonbase.analysis.window_half_width = 1
# Only the regular and smooth filters tried on switchable-filter blocks
# (libvpx real-time, vp9.filter_search_rt; 2026-11-13): pool L1-L3 (n 127)
# quality +0.18%, BETTER at k 0.6; Jetson -1.0%, x86 instructions about -2%.
vp9.filter_search_rt = 1
# Pinned before VP9 Default's CPU cut (2026-11-14, study vp9-default-speed trial #23).
vp9.inter_rounding_divisor = 4
vp9.lambda_per_step_squared = 0.09
quant.trellis_lambda_scale = 1
vp9.filter_level_scale = 1
# Pinned before VP9 Default's key-period ceiling (2026-11-14).
rate.period_ceiling = 0
# Pinned before VP9 Default's key still boost (2026-11-14).
rate.key_still_boost = 0
# Pinned before VP9 Default's unified reference plan (2026-11-15).
structure.unified = 0
# Pinned before VP9 Default's inherited cadence depth (2026-11-15).
structure.inherited_depth = 0
persist.reuse_level_price = 0
# The engine's depth removal before 2026-11-15, pinned so this preset's
# streams do not move with the engine default.
planner.depth_removal_th_32_16 = 25
planner.depth_removal_th_16_8 = 50
# Pinned before the engine-default quiet second before keys (2026-11-16).
rate.prekey_quiet = 0
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# Not screened with the Default's coded-cost key intra modes (2026-11-19).
vp9.intra_rd_candidates = 1

# The Default's cheap levers (2026-11-20 ladder spacing, docs/handoff/h264-fast.md
# method): its P-frame intra gate (variance 6.857, was 256), chroma offsets
# (-14 with the error-gap slope 3, was -8) and planner lambda (2.379, was 2).
# Single levers on the pool L1 draw (2026-11-20, k 0.6, quality J + 0.6 x
# callgrind dCPU with a key every 10 s, against Veryfast): intra gate -5.10
# (+0.2%), chroma -0.27 (+1.4%), planner lambda -0.24 (-0.4%). Bundle: x86
# instructions +1.0%; L3 (draw 2026-11-20, 108 clips) J -5.94% [-7.15,
# -5.23] BETTER; final-check (33 clips, 600 f) quality -8.95% [-10.54,
# -6.46] BETTER, no guard. Not taken: the rate set (-0.59, but its rate
# ceiling guard: 0.68% mean over target), the intra mode estimate (+0.27).
decision.intra_gate_variance = 6.857
# -11 since the 2026-11-23 retune (end of file).
vp9.chroma_delta_q = -11
vp9.chroma_delta_gap_slope = 3
planner.lambda_scale = 2.379

# Not screened with the Default's exact ranking and winner walk (2026-11-20).
vp9.exact_ranking = 0
# Still blocks (`still.*` detector) take the zero vector with no candidate,
# sub-sample or intra trial (`decision.static_zero_vector`, as H.264
# Faster/Veryfast; fast-paths agent, 2026-11-20, docs/handoff/fast-paths.md).
# Jetson cycles (90 f CBR 600) pan -1.1%, crowd +0.6%, bodycam -6.1%,
# lowlight -0.9%; x86 P instructions static -1.4%, bodycam -5.0%. CBR pool
# at k 0.6, dCPU -1.7%: L1 -0.92%, L2 -0.90%, L3 -1.09% [-1.34, -0.88]
# BETTER, n=108, no guards (quality per class within +-0.4%); final-check
# 600 f J +0.03% [-0.37, +0.25], no guards.
decision.static_zero_vector = 1
# The bilinear ranking's skip shortcut (`decision.skip_no_refine_lambdas`)
# became live when VP9 gained its skip vector (NEARESTMV, 2026-11-20);
# pinned off, as before, until screened on this rung.
decision.skip_no_refine_lambdas = 0
# Zero-vector SADs from pre-analysis, as H.264 / AV1 Veryfast, AV2 and HEVC
# Faster (fast-analysis, 2026-11-21): the zz gates and the zero grid of
# static SBs read the pre-analysis 8x8 SADs instead of re-reading both
# frames. Jetson cycles -0.99% (pan / crowd / bodycam / static -0.86 / -0.61
# / -1.47 / -1.04), x86 +0.28% instructions; quick (k 0.6) L1 -0.15%
# [-0.48, +0.18], probe -0.18%; final-check (600 f, keys every 10 s) J -0.00%
# [-0.15, +0.07], no guard; L3 -0.45% [-0.60, -0.28] BETTER (n 108).
# static_recovery passes.
analysis.zero_sads_from_pre = 1

# The Default's zero-trial split selector (planner.split_selector) stays off
# here (docs/handoff/planner-selector.md).
planner.split_selector = 0

# The trellis's cheap substitute (`quant.rd_trim`, docs/handoff/cheap-rdoq.md): trailing,
# interior (4 -> 8 bits) and whole-block rules. nceval.train (6fbb722d59, base f953cd97d,
# draw 2026-11-21, k 0.6): L3 J -0.11 % [-0.35, +0.14] n=108, final check J -0.34 %
# [-0.57, -0.04] n=34; cycles +0.7 / +0.5 / +0.8 % (Graviton 3 / 4, Zen 5).
quant.rd_trim = 1
quant.rd_trim_block = 1
quant.rd_trim_interior_bits = 4
quant.rd_trim_interior_hf_bits = 8
# Medium's key RD search and finer periodic keys (2026-11-21) were screened on medium only.
planner.key_rd_split = 0
rate.key_level_finer = 0
# Pinned before medium's fixed-QP cadence (period 8, base boost 4, no
# start-up cadence; 2026-11-22): screened on medium, slow and slower only.
rate.cadence_period = 4
rate.cadence_base_boost = 3
rate.cadence_startup_period = 8
# Periodic keys at rate.key_cap_buffer 1.0 (the engine default), the first key at 0.8:
# nceval.train at both key shares (base 764c45048, front k), L3 byte-identical (one-key
# streams), final check BETTER at 1/150 and 1/300 (-1.04 / -0.66 %).
rate.key_cap_buffer_first = 0.8

# Joint retune at the rung's front slope (2026-11-23, tune-rest; study tr-vp9-veryfast t22,
# eval/tune_spaces/tr-vp9-veryfast.txt) without its key moves (key planning 2, key-period
# ceiling, key still boost: with them the first key of static CCTV clips lost up to 3 dB,
# reverted 6962faa87): HME level 1, the P-frame intra mode estimate, the quarter step
# predicted from the half stage, residual bits 3.7 per level, chroma -11 (values above and
# below). nceval.train vs 1e17861a3, CBR front k 0.4503, CPU timed on the screens' own
# encodes (Zen 5 + Graviton 3/4): L3 dCPU -3.03 %, J -4.24 % [-4.89, -3.56] n=108; final
# check (full ladder) dCPU -1.53 / -0.67 % (1/150 / 1/300), J -2.15 % [-2.49, -1.85] n=64;
# no guard; first-key pulse at most +0.43 dB (pool_otw_homes_00015).
decision.subpel_quarter_predict = 1
vp9.residual_bits_per_level = 3.7

# The best 2 bilinear sub-pel finalists re-ranked on VP9's exact 8-tap luma filter
# (decision.exact_finalists, da9ac3b8c; this rung ranks bilinear, vp9.exact_ranking 0).
# nceval.train vs e682b6d3e, CBR front k 0.4503, CPU timed on the screens' own encodes:
# L3 dCPU +4.46 %, J -0.58 % [-1.11, -0.04] n=108; final check (full ladder) dCPU +4.86 /
# +4.77 % (1/150 / 1/300), J -0.52 % [-0.81, -0.25] n=64; no guard, first-key pulse at most
# +0.14 dB. VP9 faster with the same value: final check WORSE (+0.38 %), not taken.
decision.exact_finalists = 2

# Fixed QP only (`fixed_qp.`, 2026-11-24, Brief 19 Step 4; docs/analysis/fixed-qp-fast-rungs-2026-11-24.md):
# period-8 fixed-QP cadence (base boost 4, no start-up cadence) and coarser moving keys
# (`rate.fixed_qp_moving_key = 6`): nceval.fixedqp ab (draw fixedqp-2026-11-24, n=24) 150 f
# J -1.0% [-1.6, -0.6], 600 f -2.1% [-2.3, -1.6]; fixed-QP CPU (c8i / c8g) -0.66% / -1.00%.
# CBR streams are byte-identical.
# The fine-quantizer depth-removal floor (`fixed_qp.planner.depth_removal_min_quantizer = 0.86`)
# that landed with them was removed on 2026-11-25: it sat under this rung's front slope. On
# the benchmark's six quantizers (nceval.fixedqp ab, BD-J, draw fixedqp-2026-11-25, n=24,
# 150 f) the floor was worth J -3.7% [-4.5, -2.9]; its CPU (aws_cpu_ab, cycles, c8i / c8g)
# at qindex 110 / 160 / 210 was +17.9 / +13.1 / +4.8% and +14.5 / +11.4 / +2.9%, about
# +11.5 / +9% of the six quantizers' time (interpolated): 0.3-0.4% J per 1% CPU against
# 0.46-0.6 to VP9 faster, and it left the rung at 1.13x faster's speed in the benchmark's
# Fixed QP views (1.2x under rate control). Floors 0.5 / 0.6 / 0.7 cost J +2.9 / +1.6 /
# +0.7% against 0.86: the same line, no knee. VP9 faster keeps its floor (J -2.4% [-3.2,
# -1.6] for about +6-7.5% CPU, over its 0.13-0.19 slope).
# docs/analysis/benchmark-anomalies-2026-11-25.md.
fixed_qp.rate.cadence_period = 8
fixed_qp.rate.cadence_base_boost = 4
fixed_qp.rate.cadence_startup_period = 0
fixed_qp.rate.fixed_qp_moving_key = 6
# The Default's `persist.reuse_keys` 0 (2026-11-27) is not screened on this rung: the engine value.
persist.reuse_keys = 2
# The split override (2026-11-27) is off here: final 600f +0.21 % J [-0.00, +0.42] (1/150), pulse guard +0.69 dB.
planner.split_override = 0
