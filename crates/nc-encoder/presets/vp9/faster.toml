# Re-pointed 2026-11-21 (preset-ladder; docs/handoff/presets.md "The ladder"): VP9
# faster and veryfast were 1.13x apart. The gap study pl-s11t-vp9-faster (trial 59;
# seeded from this rung, fast and veryfast) moved faster toward fast (values set in
# place below). ff40ad7bf, against medium: whole-encode 1.22x the old faster's time
# (224.9 fps combined: veryfast 1.38x faster than this rung, fast 1.38x slower;
# Graviton 3/4 and Zen 5, 720p CBR 600); final check (34 clips, 600 f, draw 2026-11-21)
# J +20.48 % [+18.13, +23.23] (the old faster +28.56 %), 2.23 better than the
# medium-faster log-speed chord.
#
# VP9 Faster: the speed point below VP9 Fast (vp9-faster agent, 2026-11-12;
# docs/handoff/vp9-faster.md). vp9-fast plus the levers with the least
# quality lost per CPU saved: single-lever J_real (k 0, pool L1 draw of
# 2026-11-12, 24 clips) against Jetson CPU (CBR 600, chart clips).
# Bundle vs vp9-fast: J_real quality about +12% (L1: round 1 +6.6%, the
# libvpx real-time pair below +5.1% on top), Jetson -33.3% (1.50x).
# Long GOP: a constant loss, no drift (handoff).
#
# vp9-fast, listed so these streams do not move with it. VP9 Fast: the
# speed point (docs/PROCEDURES.md "Preset roles"). Bars
# (coordinator, 2026-11-09): CPU <= ~1.4x our HEVC Fast on the Jetson, and
# J_real vs our HEVC Fast with no class guard failing; judged at Fast's k 0.6.
#
# Smaller inter transforms only for locally concentrated residual (HEVC's
# inter_tu_split_spread): crowd 720p q230, Jetson -7.2% / x86 -3.9% CPU;
# J_real TRAIN quality vs Default +1.6% full / +1.2% low (proxy-6).
vp9.inter_tx_split_spread = 1.5
# HEVC Fast's sub-pel gates (seed variance 0.05 lambdas, move biases 1.1)
# and the quarter-sample stage only after a half-sample move: with the
# spread gate off, Jetson about -6%, x86 -7.3% CPU; quality vs Default
# (proxy-4) +3.4% full / +2.5% low, pan worst.
# Since 2026-11-21 the seed gate also gates the bilinear ranking's winner
# refinement (fast-decision, docs/handoff/fast-decision.md): Jetson cycles
# -2.3%, x86 -2.44%; pool L3 J -0.82% [-0.96, -0.67] at k 0.6 (quality
# +0.55%), final-check quality +0.36% [+0.28, +0.51], no guards.
decision.codec_subpel_seed_lambdas = 0.009689
decision.subpel_move_bias = 1.1
decision.subpel_move_bias_nonzero = 1.1
decision.subpel_fractional_bias = 1.1
decision.subpel_quarter_needs_half_move = 1
# Where that skips the quarter stage, the half stage's costs predict the
# quarter step and one probe confirms it (`decision.subpel_quarter_predict`,
# docs/analysis/literature-ideas-2026-11-21.md §4): fixed QP J -2.70 % of the
# full quarter stage's -2.80 %; whole-encode cycles Graviton3 +2.10 %,
# Graviton4 +1.87 %, Zen 5 +1.75 % (aws_cpu_ab); L3 J -0.44 % [-0.84, -0.06],
# final-check -0.68 % [-1.19, -0.36] at dCPU +1.47 %, about -0.20 / -0.44 %
# at the cloud dCPU +1.87 % (k 0.6).
decision.subpel_quarter_predict = 1
# 32x32 transforms code only their low 16x16 frequencies (encoder-side
# forward approximation; NEON computes only those): crowd 720p q230 Jetson
# -3.9%, x86 +1.6% (full forward then zeroed there), weighted -2.1%; J_real
# TRAIN quality vs Default +0.2% full / +0.3% low (proxy-6, no guards),
# J at Fast's k 0.6 about -1.0%.
vp9.partial_forward = 1
# Inter blocks whose largest transform codes at most 4 levels skip the
# smaller transform sizes: Jetson -9.4%, x86 -7.4% (weighted -8.7%); J_real
# full TRAIN at k 0.6 BETTER, -4.9% (quality +0.6% full / +0.1% low, no
# guards); long GOP (one key, 300 frames, crowd and pan at 400 kbps) holds
# its trend.
vp9.tx_search_min_levels = 4
# Trellis quantisation is a Default quality arm (J_real quality -1.3% for
# +6.4% host / +11.2% Jetson P-frame CPU); Fast keeps the plain quantiser.
quant.trellis = 0
# Fast keeps Default's start-up QP cadence (base boost 4) and cadence motion
# gate: proxy-6 J_real (k 0.6) vs both off BETTER -1.3%, no guard, pulse
# -0.02 dB; CPU-neutral (docs/handoff/vvc.md, qp-cascade).
# Default's key-frame trellis, unshaved levels, ungated P-frame intra and
# fine-quantizer small blocks are quality arms; Fast keeps the cheaper
# engine values.
quant.trellis_key = 0
vp9.shave_gap = 8
planner.depth_removal_min_quantizer = 0
# QP cadence 1.4x the engine's (the Default takes 1.2; 2026-11-11): J_real
# (k 0.6) vs 1, TRAIN -1.9%, VAL -1.7%, no guard.
rate.cadence_scale = 1.4
# The Default's jointly tuned planner lambda (2026-11-12) is not screened for
# this preset: it keeps the previous value.
planner.lambda_scale = 2.052
#
# The Faster levers (quality / Jetson time, each alone vs vp9-fast):
# Intra blocks of inter frames take DC without a mode search (-0.6 / -2.3%).
vp9.inter_intra_dc_only = 1
# No reuse-term refinement of still blocks (-0.2 / -1.2%; static_recovery
# still passes).
persist.reuse = 0
# Round 4 (2026-11-13): libvpx real-time intra masks (luma DC/V/H, chroma
# DC; vp9_speed_features.c): pool L1-L3 (n 127) quality -0.34% (better), J -0.94% [-1.09, -0.78], BETTER at k 0.6;
# Jetson -0.8%.
vp9.intra_mode_search = 2
# Inter residual within 3x the zero proof's bound is dropped before the
# transform (+0.6 / -2.2%).
vp9.pre_transform_zero_scale = 1
# Inter transforms at most 16x16 (+1.9 / -4.6%).
vp9.inter_max_tx_log2 = 4
# Inter blocks code their largest transform only (+4.8 / -6.2%; with the
# 16x16 cap together -12.9%).
vp9.inter_tx_depth = 1
# Non-base frames of the QP cadence (3 of 4) skip the loop filter
# (+3.4 / -4.4%; long GOP in the handoff).
nonbase.vp9.filter_level_scale = 0.4404
#
# Round 2: libvpx's real-time encoder (vp9_pickmode.c, BSD; reimplemented).
# Transform blocks under its variance thresholds skip the transform, coding
# DC from the residual sum or nothing (+2.0 / -5.0% alone; +1.2 / -2.1% on
# round 1).
vp9.nonrd_skip_scale = 1
# Residual RD and transform trials price levels at 4 bits per unit of
# magnitude instead of their token costs (block_yrd; +3.1 / -8.0% alone).
vp9.residual_bits_per_level = 7
#
# Round 3 (2026-11-13), libvpx real-time ports. Bundle vs round 2: pool
# L1-L3 (2026-11-13 draw, n 127) quality J_real -0.59% (better), J at
# k 0.6 BETTER; Jetson -9.4%, x86 instructions -12.6% (with the exact
# speed-ups of the same round); long GOP (900 f, one key, 600 kbps)
# within 0.04 dB per third of round 2, no drift.
# Only the regular and smooth filters tried, and the whole-block skip
# test (together quality +0.005%, L3 n 127; Jetson -2.5%).
vp9.filter_search_rt = 1
vp9.nonrd_block_test = 1
# Intra blocks of inter frames code their largest transform only (libvpx
# real-time): quality -0.26% (better, pool L1), x86 instructions -6.1%.
# (Its search with exact token costs was ~12% of a P frame.)
vp9.inter_intra_tx_depth = 0
# Pinned before VP9 Default's CPU cut (2026-11-14, study vp9-default-speed trial #23).
vp9.inter_rounding_divisor = 4
vp9.lambda_per_step_squared = 0.09
quant.trellis_lambda_scale = 1
vp9.filter_level_scale = 1
# Pinned before VP9 Default's unified reference plan (2026-11-15).
structure.unified = 0
# Pinned before VP9 Default's inherited cadence depth (2026-11-15).
structure.inherited_depth = 0
persist.reuse_level_price = 0
# The engine's depth removal before 2026-11-15, pinned so this preset's
# streams do not move with the engine default.
planner.depth_removal_th_32_16 = 25
planner.depth_removal_th_16_8 = 50
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# Not screened with the Default's coded-cost key intra modes (2026-11-19).
vp9.intra_rd_candidates = 1

# The Default's cheap levers (2026-11-20 ladder spacing, docs/handoff/h264-fast.md
# method): its P-frame intra gate (variance 6.857, was 64), its rate set (quiet
# second before a key, key-period ceiling, key still boost 6), the intra mode
# estimate and its chroma offsets (-14 with the error-gap slope 3, was -8).
# Single levers on the pool L1 draw (2026-11-20, k 0.6, quality J + 0.6 x
# callgrind dCPU with a key every 10 s, against Faster): intra gate -2.11
# (+0.5%), rate set -0.90 (0.0%), mode estimate -0.22, chroma -0.21 (+1.2%).
# Bundle: x86 instructions +1.4%; L3 (draw 2026-11-20, 108 clips) J -3.67%
# [-4.79, -3.26]; final-check (33 clips, 600 f) quality -7.63% [-8.43,
# -6.59], every clip better. Both pulse guards trip on
# external_uvg_volleyball_720p (+2.1 / +3.1 dB), whose 2 s keys the key still
# boost codes finer than the P frames before them, as in every Default;
# adopted on judgement. Not taken: planner lambda (+0.17); left out on cost
# alone: key intra RD candidates and mode search (keys +25..+53%),
# inter-intra transform depth (+3.1%), structure (+2.6%).
decision.intra_gate_variance = 6.857
vp9.intra_mode_estimate = 1
vp9.chroma_delta_q = -7
vp9.chroma_delta_gap_slope = 3
rate.prekey_quiet = 1
rate.period_ceiling = 1
rate.key_still_boost = 6

# Not screened with the Default's exact ranking and winner walk (2026-11-20).
vp9.exact_ranking = 0
# Still blocks (`still.*` detector) take the zero vector with no candidate,
# sub-sample or intra trial (`decision.static_zero_vector`; fast-paths
# agent, 2026-11-20, docs/handoff/fast-paths.md). Jetson cycles (90 f CBR
# 600) pan -0.8%, crowd +0.1%, bodycam -5.2%, lowlight +0.2%. CBR pool at
# k 0.6, dCPU -1.45%: L1 -0.81%, L2 -0.79%, L3 -1.29% [-1.37, -1.00]
# BETTER, n=108, no guards; final-check 600 f J -0.01% [-0.35, +0.38],
# no guards.
decision.static_zero_vector = 1
# The bilinear ranking's skip shortcut (`decision.skip_no_refine_lambdas`)
# became live when VP9 gained its skip vector (NEARESTMV, 2026-11-20);
# pinned off, as before, until screened on this rung.
decision.skip_no_refine_lambdas = 0

# The Default's zero-trial split selector (planner.split_selector) stays off
# here (docs/handoff/planner-selector.md).
planner.split_selector = 0
# Set by the pick, not in the file it starts from:
effort.light_nonbase_only = 1
effort.regular_fraction = 1
nonbase.vp9.partial_forward = 1

# The trellis's cheap substitute (`quant.rd_trim`, docs/handoff/cheap-rdoq.md): trailing
# ±1 and whole-block rules at 1.5x the mode-decision λ. nceval.train (3c98c85f0f, base
# eb55cd325, draw 2026-11-21, k 0.6): L3 J -0.48 % [-0.73, -0.24] n=108, final check J
# -1.25 % [-1.76, -0.80] n=34; cycles +1.2 / +1.3 / +0.9 % (Graviton 3 / 4, Zen 5).
quant.rd_trim = 1
quant.rd_trim_block = 1
quant.rd_trim_lambda_scale = 1.5
# Medium's key RD search and finer periodic keys (2026-11-21) were screened on medium only.
planner.key_rd_split = 0
rate.key_level_finer = 0

# The zero-vector gates' superblock average (analysis.zero_gate_cell, engine
# default 0 since the 2026-11-22 bundle): not screened on this rung.
analysis.zero_gate_cell = 64
# Pinned before medium's fixed-QP cadence (period 8, base boost 4, no
# start-up cadence; 2026-11-22): screened on medium, slow and slower only.
rate.cadence_period = 4
rate.cadence_base_boost = 3
rate.cadence_startup_period = 8

# The bilinear ranking's winner refinement gate adapts per clip and frame role (adapt.refine,
# as on H.264 Veryfast; docs/analysis/adaptive-thresholds-2026-11-23.md). nceval.train
# 2026-11-23 vs fa55faa23 at k 0.3258, CPU on its own encodes (key1 -1.34 %, 1/150 -1.13 %,
# 1/300 +0.06 %): L3 J -0.35 % [-0.42, -0.29], final check -0.20 % [-0.31, -0.08], both BETTER.
adapt.refine = 1
adapt.refine_target = 0.02

# Fixed QP only (`fixed_qp.`, 2026-11-24, Brief 19 Step 4; docs/analysis/fixed-qp-fast-rungs-2026-11-24.md):
# period-8 fixed-QP cadence (base boost 4, no start-up cadence), coarser moving keys
# (`rate.fixed_qp_moving_key = 6`), and fine-quantizer depth-removal floor (`0.86`).
# nceval.fixedqp ab (draw fixedqp-2026-11-24, n=24): 150 f J -3.6% [-4.4, -2.3],
# 600 f J -5.2% [-5.8, -3.5]; fixed-QP CPU (aws_cpu_ab, c8i / c8g): +7.95% / +6.18%
# (mean +7.07%; -0.74% J / 1% CPU vs front slope -0.177). CBR streams are byte-identical.
fixed_qp.rate.cadence_period = 8
fixed_qp.rate.cadence_base_boost = 4
fixed_qp.rate.cadence_startup_period = 0
fixed_qp.rate.fixed_qp_moving_key = 6
fixed_qp.planner.depth_removal_min_quantizer = 0.86
