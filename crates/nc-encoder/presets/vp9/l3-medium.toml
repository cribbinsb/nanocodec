# VP9 SVC, three spatial layers: L3T1 (720p30 over 360p30 over 180p30, 2:1
# steps), the standard WebRTC ladder, packed as VP9 Annex B superframes
# [S0, S1, S2] with per-layer probability contexts (`frame_context_idx` =
# spatial_id, docs/handoff/spatial-svc.md §14). The VP9 Default's parameters
# plus the three-layer spatial defaults, written out so the tuner can move
# them. Its own optimisation target: measured on the SVC chart
# (eval/nceval/svc_chart.py, docs/results/svc-chart.md) by BD-J of operating
# point 0 at its receiver rate, with the 360p and 180p operating points as
# guards. `--temporal-layers 3` (or `--scalability L3T3`) gives L3T3;
# `--scalability L3T1_KEY` / `L3T3_KEY` gives WebRTC K-SVC.
spatial.layers = 3
spatial.s0_scale = 0.25
spatial.s1_scale = 0.5
# Nominal caps of the 180p and 360p layers (720p takes the rest plus their
# unspent inter bits); K-SVC (`spatial.inter_layer = 2`) uses
# `spatial.key_s0_rate_share` (0.08) and `spatial.key_s1_rate_share` (0.24).
spatial.s0_rate_share = 0.08
spatial.s1_rate_share = 0.26
spatial.inter_layer = 1
spatial.enhancement_interval = 1
# Pinned before VP9 Default's CPU cut (2026-11-14, study vp9-default-speed trial
# #23), as vp9-svc: this preset was measured with those values.
vp9.inter_rounding_divisor = 4
vp9.lambda_per_step_squared = 0.09
planner.lambda_scale = 3.1625
vp9.filter_level_scale = 1
vp9.chroma_delta_q = -8
# Mode 2 skips the 10-mode intra search on interior blocks of >=360p non-reset
# inter frames while keeping directional intra on key/repair enhancement
# pictures, refined blocks, sub-360p layers and blocks touching a frame edge
# (L3T1_KEY Callgrind -3.6% crowd / -2.1% bodycam, -1.9% 3-clip mean; 11-clip
# [8] vs 0: L3T1 720p +33.0% -> +32.8% [+32.9% -> +32.8%], 180p +2.3% -> +2.3%;
# L3T1_KEY 720p +2.0% -> +2.9% [+1.5% -> +1.6%], 180p +2.4% -> +2.5%).
vp9.inter_intra_dc_only = 2
# Takes VP9 Default's key still boost (rate.key_still_boost 6), key-period
# ceiling (rate.period_ceiling 1) and unified second reference
# (structure.unified 1; T1 only via SECOND_REFERENCE_WITH_LAYERS, respecting
# L3T3's 8-slot DPB limit), plus the engine's inherited cadence depth
# (structure.inherited_depth 1) with its companion level-priced still
# refinement (persist.reuse_level_price 1): 11-clip [8] BD-J L3T1 720p +34.7%
# -> +33.0% [+35.3% -> +32.9%], 360p +24.2% -> +23.5%, 180p +2.9% -> +2.3%;
# L3T1_KEY 720p +3.6% -> +2.0% [+3.5% -> +1.5%], 360p +2.3% -> +1.6%, 180p
# +3.0% -> +2.4%.
structure.inherited_depth = 1
persist.reuse_level_price = 1
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# Not screened with the Default's coded-cost key intra modes (2026-11-19).
vp9.intra_rd_candidates = 1
# The key-period ledger's saving for the next period's key was dropped from the
# engine (2026-11-20, docs/handoff/rate-control.md): not screened for this preset.
rate.period_key_saving = 1
