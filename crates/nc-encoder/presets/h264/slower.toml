# H.264 slower (`--preset slower`): slow plus more inter search: RD refinement of the
# final vectors (h264.rd_refine 1), sub-sample refinement down to a lower residual
# variance (h264.subpel_skip_variance 13.76, the Default's 24) and a wider final-stage
# pricing margin (decision.final_margin_lambdas 0.217, slow's 0.1). The rung's previous
# form (slow's decisions widened further, intra gates, RD transform size; 92a9d8966) was
# level with slow (L3 J -0.01 % [-0.67, +0.66]) at more CPU, off H.264's front.
# h264-ladder 2026-11-24: study slower2-h264 from slow (tune search, 600 f, both key
# shares, k 0.1419; eval/tune_spaces/ladder-h264-slower.txt), trial 2. Against slow on
# fresh clips: nceval.quick L1 J -1.31 % [-1.90, -0.95], probe -0.72 % [-0.87, -0.47]
# (quality); full-ladder final check (600 f, 1/150 and 1/300, draw 2026-11-24, quality)
# J -0.89 % [-1.05, -0.80] BETTER, guards none, worst-1 % Y -2.8 %, flicker flat. CPU on
# rented cores (aws_cpu_ab --key-shares, CBR 600), cycles at 1/150 / 1/300: zen5 +54.1 /
# +56.6 %, Graviton 3 +58.2 / +61.5 %, Graviton 4 +58.2 / +60.6 %.
#
# Every parameter of slow follows (so this rung does not move when slow does).
# Restored decision.final_margin_lambdas = 0.1 (slow's value) and removed
# h264.subpel_skip_variance = 13.76 (Default's 24) per benchmark-anomalies-2026-11-25.md
# ("Left open"): c8i/c8g CPU -2.5 / -2.7 %, formal L3 (n=98, draw 2026-11-27,
# --local --strict-buffer) J -0.23 % [-0.43, -0.05] BETTER, 0 guards,
# periodic-key pulse 2 s -0.04 dB / 10 s +0.21 dB (faster AND better).
decision.final_margin_lambdas = 0.1
decision.final_max_winner_lambdas = 0
decision.final_intra_energy_ratio = 0
h264.final_chroma = 1
decision.winner_walk_steps = 3
decision.winner_walk_square = 1
decision.winner_walk_min_lambdas = 0
