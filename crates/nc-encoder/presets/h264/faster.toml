# H.264 faster (`--preset faster`; `fast` until 2026-11-21, when the old faster was retired and a rung between this one and medium took the name): the Default without trellis quantisation, plus the two speed
# levers that pass the J_real screen and the long-GOP trend (2026-11-09;
# docs/handoff/h264-fast.md). Against the Default without trellis, CBR
# ladder, full TRAIN 150 f: J_real -1.5% at k 0.6 (quality +1.4% full /
# +0.7% low, no guard); Jetson -6.1% crowd09 / -3.4% bodycam_bc1 at
# openh264-rate-matched QPs; single-key 300 f trend flat.
# The wider chroma zero bound (h264.inter_zero_chroma_scale) passed 150 f
# but decays chroma over long GOPs, so it stays at 1.
quant.trellis = 0
h264.inter_zero_luma_scale = 1.25
decision.subpel_quarter_needs_half_move = 1
# The Default's speed levers before its quality set (2026-11-10), pinned so
# this preset's streams do not move with the Default.
decision.codec_fullpel_probe = 0
decision.refine_cheap_vector = 0
decision.subpel_walk = 0
h264.intra4x4_all_modes = 0
analysis.window_half_width = 3
quant.trellis_lambda_scale = 1
h264.split_gate_lambda = 0
# Fast keeps Default's start-up QP cadence (base boost 4) and cadence motion
# gate: proxy-6 J_real (k 0.6) vs both off BETTER -0.4% (crowd -2.4%), no
# guard, pulse -0.04 dB; CPU-neutral (docs/handoff/vvc.md, qp-cascade).
# Gated temporal layers (layer-gate agent, 2026-11-11; docs/handoff/
# hierarchical-p.md "Layer gate"): L1T3 wherever the adaptive gate allows,
# with the cheap settings below on the frames nothing references. The CBR
# layer step ratios stay at the engine's (T0 0.35, T1 0.7 of the top
# layer's step): h264-faster's milder 0.5 / 0.75 drifted down over 900-frame
# single-key runs (crowd -0.26 dB, pan -0.16 by the last third), these do
# not (crowd +0.07 / -0.03 / 0.00, pan -0.08 / -0.16 / -0.08 PSNR-YUV). J_real
# vs flat h264-fast (k 0.6, dCPU -0.4% x86, full gate): TRAIN 18 clips -8.8%,
# VAL 11 clips -8.3%, no guard, pulse +0.03 / 0.00 dB.
layers.count = 3
layers.adaptive = 1
layers.adaptive_max_camera_motion = 16
layers.adaptive_max_compensable = 1
layers.adaptive_max_repeat_share = 0.25
layers.adaptive_max_static = 0.68
layers.adaptive_max_camera_jitter = 2
decision.nonbase_disposable_only = 1
nonbase.decision.subpel_half_only = 1
nonbase.analysis.window_half_width = 1
nonbase.decision.intra_gate_variance = 1024
nonbase.analysis.hme_from_seed = 1
nonbase.h264.deblock_inter = 0
nonbase.h264.inter_zero_luma_scale = 3
# The Default's QP cadence scale 1.4 (2026-11-11) lost here on worst-1%
# windows (held-out / VAL); Fast keeps the engine's.
rate.cadence_scale = 1
# Default dropped its motion-search shortcuts (2026-11-14, fixed-qp program); this preset keeps them.
analysis.static_sad_per_pixel = 1
analysis.one_position_sad_per_pixel = 1.3333334
analysis.skip_hme_sad_per_pixel = 2
# H.264 Default's fixed-QP profile is unpinned (2026-11-24, Brief 19 Step 4; CBR stays byte-identical).
# The Default's split search without the uniform-vector exit (2026-11-15),
# pinned so this preset's streams do not move with the Default.
h264.split_uniform_qpel = 4
# Pinned before the Default's winner walk (2026-11-18, docs/handoff/rd-depth.md).
decision.winner_walk_steps = 0
# Pinned before the Default's final decision stage (2026-11-18,
# docs/handoff/rd-mode-decision.md).
decision.final_stage = 0
# Pinned before the engine's coarser fixed-QP key under camera motion became the default
# (rate.fixed_qp_moving_key 6, 2026-11-19, docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# The Default's cheap levers (h264-spacing, 2026-11-19): its intra gate (16), mode-decision
# lambda (0.6625), mixed-motion search, rate-control set (quiet second before keys, key-period
# ceiling, key still boost, still-scene damping) by dropping their pins, plus Intra_8x8 and
# RD intra modes in key frames only. x86 P-frame instructions +0.7% (callgrind, cost clips).
# Pool draw 2026-11-19 against the old Fast (k 0.6): L1 J -4.34% [-5.65, -3.06], L2 -5.66%
# [-6.79, -4.66], L3 (108 clips, single point) -5.93% [-6.54, -5.33]; the periodic-key
# pulse guard reads +0.25 dB (class mean, at its limit) and +0.76 on one clip
# (vc1k_android_indoor_fastmotion): there the keys are 0.6-1.0 dB better, the P frames
# before them -0.6 to +0.5 dB, all frames +0.1 and +0.3 dB (150 / 299 kbps): the pulse is
# a better key, not a worse P frame.
# Each alone at L1 (J at k 0.6): intra gate -1.44%, key Intra_8x8 -1.38%, rate set -0.85%,
# lambda -0.40%, key RD intra -0.43%, mixed motion -0.32%. The Default's heavier levers
# lose at k 0.6 here (quality / dCPU): final stage -6.0% / +14.5%,
# winner walk -2.1% / +9.8%, trellis -2.1% / +26.6%, integer probes -1.8% / +6.6%.
h264.intra8x8 = 1
h264.intra_rd = 1
# Pinned before the Default's key-frame Intra_8x8 search (coded-cost modes, gate 4,
# Intra_8x8 trellis; 2026-11-21): not screened for this preset.
key.h264.intra8x8_rd_candidates = 0
key.h264.intra8x8_gate_satd = 9.6
key.h264.trellis_i8x8 = 0
key.h264.trellis_intra_lambda_ratio = 1

# The zero-vector gates' superblock average (analysis.zero_gate_cell, engine
# default 0 since the 2026-11-22 bundle): not screened on this rung.
analysis.zero_gate_cell = 64
# The first key at rate.key_cap_buffer 1.0 too, over H.264's first-key 0.8 (backend
# DEFAULT_PARAMS): nceval.train at both key shares (base df1506a5, k front slope) passed
# with it (docs/handoff/rate-control.md "Key distance").
rate.key_cap_buffer_first = 1.0

# G2 motion / sub-pel exit shifts: H.264 medium's (DEFAULT_PARAMS, 2026-11-23)
# pinned off here, not screened on this rung.
analysis.window_exit_shift_bias = 0
analysis.window_exit_shift_lambda = 0
analysis.window_exit_shift_noise = 0
analysis.window_exit_shift_nonbase = 0
analysis.zero_gate_shift_bias = 0
analysis.zero_gate_shift_lambda = 0
analysis.zero_gate_shift_neighbour_mv = 0
analysis.zero_gate_shift_noise = 0
analysis.zero_gate_shift_nonbase = 0
decision.skip_no_refine_shift_bias = 0
decision.skip_no_refine_shift_lambda = 0
decision.skip_no_refine_shift_noise = 0
decision.skip_no_refine_shift_nonbase = 0
decision.subpel_seed_shift_bias = 0
decision.subpel_seed_shift_lambda = 0
decision.subpel_seed_shift_noise = 0
decision.subpel_seed_shift_nonbase = 0
decision.subpel_seed_shift_size = 0
decision.subpel_seed_shift_zero_mv = 0

# Bilinear ranking with the exact re-ranking of its two best sub-pel finalists
# (decision.exact_finalists 2, h264.exact_ranking 0 in place of exact ranking of every
# candidate; h264-ladder 2026-11-23, Gemini brief 13). nceval.train (unit d1f2b52064, base
# da9ac3b8c, k 0.2435 the CBR front slope, CPU on its own encodes, zen5 + Graviton 3/4):
# dCPU final check -3.82 / -4.12 % at 1/150 / 1/300; L3 J -0.22 % [-0.81, +0.40]
# AMBIGUOUS (no loss), final check (full ladder) J -1.25 % [-1.58, -0.93] BETTER, no guard.
decision.exact_finalists = 2
h264.exact_ranking = 0

# Fixed QP only (`fixed_qp.`, 2026-11-24, Brief 19 Step 4; docs/analysis/fixed-qp-fast-rungs-2026-11-24.md):
# unpinning `rate.fixed_qp_profile`, coarser moving keys (`rate.fixed_qp_moving_key = 6`),
# and relaxing the low-QP inter zero luma scales (1.0 base / 2.0 non-base). nceval.fixedqp ab
# (draw fixedqp-2026-11-24, n=24): 150 f J -4.3% [-5.0, -3.0], 600 f J -3.7% [-4.1, -2.9];
# fixed-QP CPU (aws_cpu_ab, c8i / c8g): +3.04% / +3.09% (mean +3.07%; -1.21% J / 1% CPU vs
# front slope -0.209). CBR streams are byte-identical.
fixed_qp.rate.fixed_qp_moving_key = 6
fixed_qp.h264.inter_zero_luma_scale = 1
fixed_qp.nonbase.h264.inter_zero_luma_scale = 2
# The fixed-QP profile's key offset as screened here (8): the profile's 9 (2026-11-25;
# 10 on 2026-11-24, Brief 20) was screened on medium/slow/slower only.
fixed_qp.h264.keyframe_qp_offset = 8
