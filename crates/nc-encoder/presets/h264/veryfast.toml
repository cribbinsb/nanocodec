# H.264 Fastest: the speed point below Faster (h264-fastest agent, 2026-11-11;
# docs/handoff/h264-fastest.md). h264-faster plus the four levers that buy
# Jetson time at the least compression; the cuts measured beyond them
# (CAVLC, deblocking off in P frames, DC-only intra test, narrower search,
# SAD-threshold static gates) cost far more bits than their speed is worth,
# decay over long GOPs, or buy no time.
# h264-faster's settings, pinned so this preset does not move with it.
quant.trellis = 0
decision.subpel_quarter_needs_half_move = 1
decision.codec_fullpel_probe = 0
decision.refine_cheap_vector = 0
decision.subpel_walk = 0
h264.intra4x4_all_modes = 0
analysis.mixed_motion = 0
quant.trellis_lambda_scale = 1
h264.split_gate_lambda = 0
h264.split_gate_satd = 96
h264.split_refine_steps = 1
h264.intra4x4_gate_satd = 64
analysis.hme_range_x = 8
# Level-1 HME back on (2026-11-21, nceval.train k 0.6, base 9771674cf): L3 J -1.35 %
# [-2.51, +0.24] n=108, final-check -2.88 % [-3.66, -2.33] n=34, no guard; cycles with
# window 3 (rejected: marginal L3 +0.46 %) +0.7..+1.4 % (Graviton 3/4, Zen 5).
analysis.hme_level1 = 1
# HME skip bound 4 (was 8) and a one-row vertical window (was 0): nceval.train
# 2026-11-22 (k 0.6, base 292f0b725) both L3 J -3.45 % [-4.00, -2.91] n=108,
# final-check -3.59 % [-4.09, -3.10] n=39, no guard; marginal window -2.07 / -2.29,
# skip bound -0.95 / -0.94; cycles both +2.3 / +2.3 / +1.3 % (Graviton 3 / 4, Zen 5).
analysis.skip_hme_sad_per_pixel = 4
analysis.window_half_width = 2
analysis.window_half_height = 1
decision.static_zero_vector = 1
h264.exact_ranking = 0
# The bilinear ranking's winner refinement keeps only H.264's own variance
# gate (`h264.subpel_skip_variance`): the engine's seed gate there
# (`decision.codec_subpel_seed_lambdas`, 0.1 from DEFAULT_PARAMS) saved
# -0.1/-0.2% x86 instructions (Veryfast/Faster), not screened
# (docs/handoff/fast-decision.md).
decision.codec_subpel_seed_lambdas = 0
layers.count = 3
layers.adaptive = 1
layers.adaptive_max_camera_motion = 16
layers.adaptive_max_compensable = 1
layers.adaptive_max_repeat_share = 0.25
layers.adaptive_max_static = 0.68
layers.adaptive_max_camera_jitter = 2
decision.nonbase_disposable_only = 1
nonbase.h264.deblock_inter = 0
nonbase.decision.subpel_half_only = 1
nonbase.analysis.window_half_width = 1
nonbase.decision.intra_gate_variance = 1024
nonbase.h264.inter_zero_luma_scale = 3
nonbase.analysis.hme_from_seed = 1
rate.cadence_scale = 1
# The Fastest levers; Jetson time each on top of the others (jfps, chart
# timing clips, 600 kbps rung), J_real alone vs h264-faster (k 0, proxy-4,
# 60 f: ranking only).
# 16x16 macroblocks only, no split search: time -2.4%, J +0.0%.
h264.partition_search = 0
# P-frame intra macroblocks rank all four Intra_16x16 and chroma modes, no
# longer DC only (2026-11-19, intra-p-ranking): DC-only blocks look crude.
# x86 P-frame instructions +1.6% (callgrind, fixed QP, three CTC clips); pool
# L3 (draw 2026-11-19, 108 clips, k 0.6 with that CPU) J -1.31%
# [-1.88, -0.76] BETTER, quality -2.27%, every class better (bodycam -4.0%,
# videocall -3.3%, static -1.0%), no guard.
h264.inter_intra_dc_only = 0
# Reuse term off: time -2.5%, J -0.2% (static_recovery still passes).
persist.reuse = 0
# Inter zero-residual bound 2x (was 3x, time -1.6 %, J +0.5 % then): 2026-11-21
# nceval.train (k 0.6, base 9771674cf) L3 J -2.06 % [-2.72, -1.22] n=108, final-check
# -4.08 % [-4.88, -3.59] n=34, no guard; cycles +2.6..+2.7 % (Graviton 3/4, Zen 5).
h264.inter_zero_luma_scale = 2
# Zero-vector SADs from pre-analysis (lean-preanalysis, 2026-11-11):
# Jetson -1.5% cycles, x86 +0.1% instructions; pool levels J_real -0.36%
# [-0.61, -0.09] (L2+L3, quality +0.2%), no guards; 900-frame single-key
# static run within 0.1 dB per third.
analysis.zero_sads_from_pre = 1
# H.264 Faster's jointly tuned decision values (2026-11-12), screened for this
# preset on 2026-11-14 (equal-CPU study h264-fastest-eq-2026-11-14, trial #4):
# mode-decision lambda 0.775, intra gate 25.2 (was 50.4), the refinement skip
# at 0.105 lambdas, the one-position SAD exit at 0.667 per sample and the
# static-skip chroma scale 1.56. Disjoint L3 (79 clips, single-point) J -3.88%
# [-4.53, -3.28], no guard, every class better; CPU x86 +0.2%, Jetson -0.3%.
decision.skip_no_refine_lambdas = 0.105
analysis.one_position_sad_per_pixel = 0.667
h264.static_skip_chroma_scale = 1.56
# Intra modes by coded cost (Default since 2026-11-13, study
# h264-default-arms-2026-11-13) stay off here: pinned, byte-identical.
h264.intra_rd = 0
# Default dropped its motion-search shortcuts (2026-11-14, fixed-qp program); this preset keeps them.
analysis.static_sad_per_pixel = 1
# The Default's split search without the uniform-vector exit (2026-11-15),
# pinned so this preset's streams do not move with the Default.
h264.split_uniform_qpel = 4
# Pinned before the Default's winner walk (2026-11-18, docs/handoff/rd-depth.md).
decision.winner_walk_steps = 0
# Pinned before the Default's final decision stage (2026-11-18,
# docs/handoff/rd-mode-decision.md).
decision.final_stage = 0
# Pinned before the engine's coarser fixed-QP key under camera motion became the default
# (rate.fixed_qp_moving_key 6, 2026-11-19, docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# The Default's cheap levers (h264-spacing, 2026-11-19): its intra gate (16) and mode-decision
# lambda (0.6625) in place of the jointly tuned 25.2 and 0.775 above, its rate-control set
# (quiet second before keys, key-period ceiling, key still boost, still-scene damping) by
# dropping their pins, and Intra_8x8 in key frames. x86 P-frame instructions +1.2%.
# Pool draw 2026-11-19 against the old preset (k 0.6): L1 J -3.41% [-4.18, -2.76], L2 -4.54% [-5.65, -3.46], L3 (108 clips, single
# point) -3.92% [-4.38, -3.50]. Verdict WORSE
# on the periodic-key pulse guard alone (+0.47 dB class mean): the quiet second holds the P
# frames before a key and the key is coded finer. Direct check on the worst clip
# (external_otw_square_native, keys every 2 s, Veryfast at 82 / 163 kbps): key +1.1 / +1.2 dB,
# the 8 frames after it +1.3 / +1.3, the P frames before it -0.6 / -0.8, all frames +0.3 / +0.3
# dB at 2 % less rate: adopted on judgement, as in the Default and Fast.
# Each alone at L1 (J at k 0.6): intra gate -0.18% (ladder), key Intra_8x8 -1.40%, rate set -0.54%,
# lambda -0.88%; key RD intra -0.02% (left off).
h264.intra8x8 = 1
# Pinned before the Default's key-frame Intra_8x8 search (coded-cost modes, gate 4,
# Intra_8x8 trellis; 2026-11-21): not screened for this preset.
key.h264.intra8x8_rd_candidates = 0
key.h264.intra8x8_gate_satd = 9.6
key.h264.trellis_i8x8 = 0
key.h264.trellis_intra_lambda_ratio = 1

# The zero-vector gates' superblock average (analysis.zero_gate_cell, engine
# default 0 since the 2026-11-22 bundle): not screened on this rung.
analysis.zero_gate_cell = 64
# Pinned before H.264 Default's DC-aware vector ranking (2026-11-22): not
# screened on this rung.
decision.rank_dc_weight = 0
# Periodic keys at rate.key_cap_buffer 1.0 (the engine default), the first key at 0.8:
# nceval.train at both key shares (base 764c45048, front k), L3 byte-identical (one-key
# streams), final check BETTER at 1/150 and 1/300 (-1.02 / -0.46 %).
rate.key_cap_buffer_first = 0.8

# G2 motion / sub-pel exit shifts: H.264 medium's (DEFAULT_PARAMS, 2026-11-23)
# pinned off here, not screened on this rung.
analysis.window_exit_shift_bias = 0
analysis.window_exit_shift_lambda = 0
analysis.window_exit_shift_noise = 0
analysis.window_exit_shift_nonbase = 0
analysis.zero_gate_shift_bias = 0
analysis.zero_gate_shift_lambda = 0
analysis.zero_gate_shift_neighbour_mv = 0
analysis.zero_gate_shift_noise = 0
analysis.zero_gate_shift_nonbase = 0
decision.skip_no_refine_shift_bias = 0
decision.skip_no_refine_shift_lambda = 0
decision.skip_no_refine_shift_noise = 0
decision.skip_no_refine_shift_nonbase = 0
decision.subpel_seed_shift_bias = 0
decision.subpel_seed_shift_lambda = 0
decision.subpel_seed_shift_noise = 0
decision.subpel_seed_shift_nonbase = 0
decision.subpel_seed_shift_size = 0
decision.subpel_seed_shift_zero_mv = 0

# The bilinear ranking's winner refinement gate adapts per clip and frame role (adapt.refine):
# a quality lever here, it refines more where refining pays (lowlight-like clips) and less on
# static content (docs/analysis/adaptive-thresholds-2026-11-23.md). nceval.train 2026-11-23
# (base 00f777521, CPU on its own encodes): dCPU L3 -0.35 %, final -1.44 / +0.55 % at
# 1/150 / 1/300; at the CBR front slope k 0.3217 L3 J -0.45 % [-0.62, -0.30], final check
# -0.51 % [-0.72, -0.31] (quality alone L3 -0.34 %).
adapt.refine = 1
adapt.refine_target = 0.02

# The exact re-ranking of the bilinear ranking's two best sub-pel finalists
# (decision.exact_finalists 2; h264-ladder 2026-11-23, Gemini brief 13). nceval.train
# (unit d6ccd0faf1, base da9ac3b8c, k 0.3217 the CBR front slope, CPU on its own encodes):
# dCPU final check +2.01 / +3.25 % at 1/150 / 1/300; L3 J -0.21 % [-0.52, +0.10]
# AMBIGUOUS (no loss), final check (full ladder) J -0.73 % [-1.05, -0.46] BETTER, no guard,
# worst-1 % Y -3.5 %. Three finalists: final check -0.38 % at +4.3..+4.7 % CPU, not taken.
decision.exact_finalists = 2

# Fixed QP only (`fixed_qp.`; Brief 19, docs/analysis/fixed-qp-fast-rungs-2026-11-24.md):
# unpin H.264's fixed-QP profile (`cadence_leaf_penalty=2`, `base_lambda_scale=0.8`,
# `keyframe_qp_offset=8`) + moving-key (+6) and relax the low-QP inter zero-residual
# scale (`2 -> 1`, nonbase `3 -> 2`). Pool `nceval.fixedqp ab`, draw `fixedqp-2026-11-24`,
# n=24: 600 f J -6.8% [-7.3, -6.0] (PSNR -6.5%, VMAF -5.1%, MS-SSIM -9.3%); c8i / c8g
# fixed-QP cycles +8.52 / +10.19% (slope -0.73%/1% vs ladder -0.528%). CBR unchanged.
fixed_qp.rate.fixed_qp_moving_key = 6
fixed_qp.h264.inter_zero_luma_scale = 1
fixed_qp.nonbase.h264.inter_zero_luma_scale = 2
# The fixed-QP profile's key offset as screened here (8): the profile's 9 (2026-11-25;
# 10 on 2026-11-24, Brief 20) was screened on medium/slow/slower only.
fixed_qp.h264.keyframe_qp_offset = 8
