# H.264 slow (`--preset slow`): the Default plus two of slower's decision components,
# the ones with the most J per instruction there (presets/h264/slower.toml): the final
# decision stage widened (pricing margin, no winner limit or energy gate, chroma
# priced) and the winner walk (three square steps on every winner). H.264 has no
# quadtree below the macroblock, so no RD partition search (the other codecs' slow).
# The rung between medium and slower on H.264's front (docs/handoff/presets.md "The
# ladder"). Against medium, preset-ladder 2026-11-21 (16a104a1b): whole-encode fps
# 1.31x the time (combined: Graviton 3/4 and Zen 5, log-equal ARM/x86, 720p CBR 600,
# 4 quick clips; slower is 1.33x this rung's time); final check (34 clips, 600 f, keys
# every 10 s, draw 2026-11-21) J -2.57 % [-2.95, -2.02], no guard, 0.73 better than the
# medium-slower log-speed chord. The final stage alone: 1.21x, J -1.18 % (on the chord).
decision.final_margin_lambdas = 0.1
decision.final_max_winner_lambdas = 0
decision.final_intra_energy_ratio = 0
h264.final_chroma = 1
decision.winner_walk_steps = 3
decision.winner_walk_square = 1
decision.winner_walk_min_lambdas = 0
