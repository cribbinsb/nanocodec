# HEVC veryslow (`--preset veryslow`; `slow` until 2026-11-21, then `slower`): the
# shared bundle of the slowest rung (presets/slowest.toml,
# applied first: the second reference with the full decision) plus HEVC's
# levers. Re-picked 2026-11-20 (docs/handoff/presets.md "Slow presets"):
# everything heavy on at once, then cut back by component cost. Alone on the
# Default (fixed QP J, 21 clips / x86 callgrind P instructions): the winner
# walk -2.2% / +15%, SAO searched on every row and picture with band offsets
# -1.8% / +34%, four trellis survivors with the chroma trellis -1.1% / +47%,
# the second reference -0.6% / +22%, the P-frame intra search widened -0.4% /
# +20% (-0.8% inside the bundle). Left out: whole-CU pricing on inter error
# (-0.5 J in the bundle for +57 points), exact staged transforms (0.0% at
# +8%), the sub-sample walk (-0.1%), the inter transform-split spread, five
# merge candidates and the TU16 chroma heuristic (+0.6%, worse), 8x8 inter
# CUs (+0.3%, worse; they pay under the RD partition search, below).
#
# The winner walk: three quarter-sample moves along the row and column.
decision.winner_walk_steps = 3
decision.winner_walk_square = 0
# It also walks a winner at merge candidate 0 (the skip vector HEVC gained
# 2026-11-20). Kept unwalked: fixed QP J -0.2 % [-0.3, -0.1] (quick draw
# fixedqp-2026-11-20, n 22) but final-check (33 clips, 600 f, CBR ladder)
# J +0.49 % [-0.13, +0.76] with the drone quality_low guard tripped (+4.0).
decision.winner_walk_keeps_skip = 0
# SAO: statistics on every row, types searched on every picture, band
# offsets evaluated beside the edge classes (HEVC §8.7.3).
hevc.sao_stats_row_step = 1
hevc.sao_search_interval = 1
hevc.sao_band = 1
# Four trellis survivors, chroma trellised at a quarter of the λ.
quant.trellis_states = 4
quant.trellis_chroma = 0.25
# P-frame intra: the full angular search (HEVC's 35 modes), eight modes
# costed, and the NxN and intra transform-split gates open.
hevc.coarse_inter_intra = 0
hevc.intra_rd_candidates = 8
hevc.intra_nxn_min_cost = 0
hevc.intra_tu_split_min_cost = 0
hevc.intra_tu_split_spread = 1
# The final decision stage between the walked winner and merge candidate 0
# (engine margin 0.1 λ); intra stays the ranking's and whole-CU pricing's.
# Fixed QP (quick draw fixedqp-2026-11-21, n 24) J -0.3 % [-0.4, -0.1]
# (with intra -0.3 % [-0.6, -0.0]); final-check (34 clips, 600 f, CBR
# ladder, against 1ea4bd5b7) J -0.17 % [-0.34, +0.02] BETTER.
decision.final_stage = 1
decision.final_intra_candidate = 0
# The RD partition search (2026-11-21, docs/handoff/hevc.md "RD partition
# search"): each inter node decided by coding the leaf and the quad split one
# level either side of the plan, with 8x8 inter CUs on offer. Fixed QP J (24
# clips, against the Slow before the final stage) -7.8% at +105% P
# instructions (without the 8x8 CUs -5.3% at +77%; no deeper split -3.6% at
# +65%, no larger leaf -1.8% at +16%).
planner.rd_split = 1
planner.inter_min_log2 = 3

# The Default's zero-trial split selector (planner.split_selector) stays off
# here until screened on this rung (docs/handoff/planner-selector.md).
planner.split_selector = 0
# The Default's SAO skip on all-skip CTUs (2026-11-21). nceval.train on this rung
# (then named slower; k 0, base 1cb80965c): L3 J -0.18 % [-0.45, +0.08] n108 BETTER,
# final check -0.01 % [-0.29, +0.27] n34 AMBIGUOUS; whole encode cycles Graviton3
# -3.52 %, Graviton4 -3.47 %, Zen 5 -3.67 % (docs/handoff/filter-effort.md).
hevc.sao_skip_unchanged = 1
# The Default's filter-search effort by usage (filter.usage_quiet_share, 2026-11-21)
# is not screened here.
filter.usage_quiet_share = 0

# Layer propagation on the flat stream's QP-cadence cycles (layer_propagation.rs,
# docs/handoff/temporal-lambda.md). nceval.train (k 0, base f953cd97d, this rung then named slower): L3 (n 108)
# -0.76 % [-1.28, -0.28] BETTER, final-check (n 34) -0.49 % [-0.98, -0.04] BETTER; whole encode cycles Graviton3 +2.32 %, Zen 5 +2.82 % (HEVC Default).
layers.propagation = 1
layers.propagation_flat = 1
layers.propagation_grid = 3
layers.propagation_prekey = 1
# Key frames: VVC slower's key RD search shape (1.5 gate, two levels each way) and periodic
# keys 2 QP units finer (HEVC medium's). With the search pinned off this rung coded cheaper,
# worse keys than medium (key ladder inverted). nceval.train against 038043e0f (draw
# 2026-11-22, idea key-search-on-rungs-above-medium): L3 J -1.30% [-1.83, -0.79], final check
# (600 f) -0.59% [-1.00, -0.19], no guard. One-frame key BD-J -7.3 %.
planner.key_rd_split = 1
planner.key_rd_margin = 1.5
planner.key_rd_deeper = 2
planner.key_rd_shallower = 2
rate.key_level_finer = 2

# G2 motion / sub-pel exit shifts: HEVC medium's (DEFAULT_PARAMS, 2026-11-22)
# pinned off here, not screened on this rung.
analysis.window_exit_shift_bias = 0
analysis.window_exit_shift_lambda = 0
analysis.window_exit_shift_noise = 0
analysis.window_exit_shift_nonbase = 0
analysis.zero_gate_shift_bias = 0
analysis.zero_gate_shift_lambda = 0
analysis.zero_gate_shift_neighbour_mv = 0
analysis.zero_gate_shift_noise = 0
analysis.zero_gate_shift_nonbase = 0
decision.skip_no_refine_shift_bias = 0
decision.skip_no_refine_shift_lambda = 0
decision.skip_no_refine_shift_noise = 0
decision.skip_no_refine_shift_nonbase = 0
decision.subpel_seed_shift_bias = 0
decision.subpel_seed_shift_lambda = 0
decision.subpel_seed_shift_noise = 0
decision.subpel_seed_shift_nonbase = 0
decision.subpel_seed_shift_size = 0
decision.subpel_seed_shift_zero_mv = 0
# Periodic keys at rate.key_cap_buffer 1.0 (the engine default), the first key at 0.8:
# nceval.train at both key shares (base 764c45048, front k), L3 byte-identical (one-key
# streams), final check BETTER at 1/150 and 1/300 (-1.21 / -0.28 %).
rate.key_cap_buffer_first = 0.8
