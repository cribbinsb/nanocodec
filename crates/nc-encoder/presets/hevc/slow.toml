# HEVC slow (`--preset slow`): the Default plus the RD partition search with its
# context gate (`nc_encoder` `rd_split.rs`, `depth_context.rs`;
# docs/handoff/rd-split-gate.md): inter nodes decided by coding the plan's
# alternative where the neighbours' and co-located leaf sizes suggest it.
# The rung between medium and slower on HEVC's front (docs/handoff/presets.md
# "The ladder"). Against medium, preset-ladder 2026-11-21 (16a104a1b): whole-encode
# fps 131.4 -> 97.8 (1.34x the time) (combined: Graviton 3/4 and Zen 5, log-equal ARM/x86, 720p CBR 600,
# 4 quick clips); final check (34 clips, 600 f, keys every 10 s, draw 2026-11-21)
# J -3.64 % [-4.76, -2.46], no guard.
# rd-gate train (k 0.1, base a10208d08): L3 J -0.15 % [-0.46, +0.16] n108,
# final check -4.07 % [-4.87, -2.99] n34, no guard.
planner.rd_split = 1
planner.rd_split_context = 1
# The Default's filter-search effort by usage (filter.usage_quiet_share, 2026-11-21)
# is not screened here.
filter.usage_quiet_share = 0

# Layer propagation on the flat stream's QP-cadence cycles (layer_propagation.rs,
# docs/handoff/temporal-lambda.md). nceval.train (k 0.1, base f953cd97d): L3 (n 108)
# -0.67 % [-1.32, -0.09] BETTER, final-check (n 34) -1.27 % [-2.07, -0.78] BETTER; whole encode cycles Graviton3 +2.32 %, Zen 5 +2.82 % (HEVC Default).
layers.propagation = 1
layers.propagation_flat = 1
layers.propagation_grid = 3
layers.propagation_prekey = 1
