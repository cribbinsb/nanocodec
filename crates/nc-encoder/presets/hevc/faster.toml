# HEVC Faster: the speed point below HEVC Fast, against SVT-AV1 M13 (--rtc)
# (hevc-faster agent, 2026-11-11; docs/handoff/hevc-faster.md).
# hevc-fast plus the levers with the least quality lost per CPU saved
# (single-lever J_real at k 0 against Jetson time, then cumulative bundles).
# The profile is flat (no stage over ~15%), so the speed comes from many
# small cuts; past about -10% time each further 1% costs about 1% in bits.
# Jetson, CBR 600 kbps rung, chart clips: see the handoff for fps and BD.
#
# Everything in hevc-fast, listed so the streams do not move with it.
hevc.inter_tu_split = 0
# P-frame intra CUs take the coarse search (planar, DC, pure H/V and the
# MPMs ranked by SATD + sqrt(lambda) bits), no longer DC only (2026-11-19,
# intra-p-ranking: DC-only blocks look crude). x86 P instructions +1.4%
# (callgrind, fixed QP 37, Johnny / WestWindEasy / ControlledBurn +0.1 /
# +3.3 / +0.9%); pool L3 (draw 2026-11-19, n 108, ladder, k 0.6 with that
# CPU) J -0.06% [-0.27, +0.15] BETTER, quality -0.90%, worst-1% VMAF
# -2.2%, worst-1% Y -1.2%, no guard (bodycam -3.6%, static +0.5%).
hevc.inter_intra_dc_only = 0
hevc.tu16_chroma_concentration = 0.5
hevc.sao_stats_row_step = 4
hevc.fast_forward16 = 1
hevc.fast_forward32 = 1
decision.refine_cheap_vector = 0
decision.codec_fullpel_probe = 0
decision.subpel_move_bias = 1.1
decision.subpel_move_bias_nonzero = 1.1
decision.subpel_fractional_bias = 1.1
planner.depth_removal_min_quantizer = 0
hevc.early_merge_lambdas = 0.03
hevc.chroma_qp_offset = -3
hevc.intra_leaf_cost = 0
hevc.intra_nxn = 0
hevc.intra_tu_depth = 0
hevc.sao_skip_unchanged = 1
quant.trellis = 0
rate.cadence_startup_base_boost = 5
decision.intra_directional = 0
#
# The Faster levers. Single-lever J_real (k 0, proxy-6 + lowlight_bdd_00c497ae,
# 150 f, CBR ladder, vs hevc-fast) / Jetson time (CBR 600, chart clips):
# Chroma SAO off (0.0 / -1.0%).
hevc.sao_chroma = 0
# Two cheap (merge) vectors ranked per block (+0.3 / -0.9%).
decision.max_cheap_vectors = 2
# 32x32 inter residuals keep only their low 16x16 frequencies (+0.1 /
# -0.2%; x86 instructions -3.2%, lowlight -8.9%).
hevc.partial_forward = 1
# Key frames use the coarse intra mode search (+0.7 / -0.4%; x86 -0.9%).
hevc.key_intra_coarse = 1
# Exact-filter candidates ranked against a margin of 1.5 and a planner lambda
# of 3.163 (below), jointly tuned 2026-11-13 (equal-CPU study
# hevc-hevc-faster-eq2-2026-11-13, trial #2; was 0.9 and 2): disjoint L3 J
# -1.08% [-1.53, -0.64], no guard. Evidence in the commit.
decision.exact_rank_margin = 1.5
# Depth removal twice as eager (+1.2 / -1.0%).
planner.depth_removal_qp_scale = 4
# Inter residuals skipped before the transform below 2x the zero bound, as
# the Default and Fast (2026-11-19 ladder spacing, below; was 3).
hevc.pre_transform_zero_scale = 2
# Sub-pel refinement skipped below 0.3 lambda of seed residual (Fast 0.05;
# +4.7 / -6.5%).
decision.codec_subpel_seed_lambdas = 0.3
# The quarter-sample stage only after a half-sample move (+0.4 / -2.5%).
decision.subpel_quarter_needs_half_move = 1
# Where that skips the quarter stage, the quarter step the half stage's costs
# predict is taken unmeasured when its predicted gain is at least 5 % of the
# distortion (`decision.subpel_quarter_predict` 2; the exact ranking then
# measures it), docs/analysis/literature-ideas-2026-11-21.md §4: fixed QP J
# -1.09 % (the full quarter stage -0.79 %, one confirming probe -0.76 %);
# whole-encode cycles Graviton3 +1.03 %, Graviton4 +0.56 %, Zen 5 +0.69 %
# (aws_cpu_ab); L3 J -0.26 % [-0.55, +0.03], final-check -0.70 % [-1.02,
# -0.49] at dCPU +0.68 %, about -0.22 / -0.66 % at the cloud dCPU +0.74 %.
decision.subpel_quarter_predict = 2
# Inter rounding offset 85/512 (HM's; Fast 128): -0.5 alone, -1.7 in the
# bundle, at no measurable time.
hevc.inter_rounding = 85
# Round 2 (hevc-faster2 agent, 2026-11-11), against round 1 on the pool's
# L1 draw (24 clips) / Jetson CPU (CBR 600, chart clips) / x86 instructions:
# Luma transforms up to 32x32 again, as the Default (2026-11-19 ladder
# spacing, below; round 2 had capped them at 16x16 for Jetson -4.8%).
hevc.max_transform_log2 = 5
# Non-base frames of the QP cadence skip inter residuals below 4x the zero
# bound (-0.3 / -1.9%: free).
nonbase.hevc.pre_transform_zero_scale = 4
# The Default's jointly tuned rounding, planner and TU16 chroma values
# (2026-11-12) are not screened for this preset: it keeps the previous values.
hevc.intra_rounding = 171
# Except the planner lambda: 3.163 since 2026-11-13 (with the rank margin above).
planner.lambda_scale = 3.163
planner.split_rate_factor = 2
# Default's four merge candidates and no depth removal (2026-11-14, fixed-qp
# program) stay off here: pinned, byte-identical.
hevc.merge_candidates = 2
planner.depth_removal_th_32_16 = 25
planner.depth_removal_th_16_8 = 50
# The Default's cheap levers (2026-11-19 ladder spacing, h264-fast.md method):
# its rate set (quiet second before a key, key-period ceiling, key still
# boost 4), its structure (unified reference plan, inherited cadence depth),
# 32x32 transforms and zero bound 2 (above). Single levers on the pool L1
# draw (k 0.6, quality J + 0.6 x callgrind dCPU against Faster): max
# transform 32 -3.50 (+2.6%), zero bound 2 -1.60 (+1.1%), structure -1.22
# (+1.2%), rate set -0.85 (0.0%). Bundle (x86 P instructions +5.1%): L3
# (draw 2026-11-19, 108 clips, ladder) J -5.54% [-6.18, -4.93] BETTER, no
# guard; final-check (36 clips, 600 f, keys every 10 s) quality -9.14%
# [-10.49, -7.82], every clip better; its periodic-key pulse guard trips
# (worst clip +0.59 dB): as in the Default and H.264 Fast the quiet second
# holds the P frames before a key and the key is coded finer (key +0.15 ..
# +0.49 dB, P before -0.1 .. -0.4, all frames 0 .. +0.38), adopted on
# judgement. static_recovery passes. Not taken: CU intra pricing, sub-pel
# seed, rounding, chroma SAO (J +0.3 .. +1.2), depth removal 0 and the inter
# TU split (+16 / +13% CPU).
rate.prekey_quiet = 1
rate.period_ceiling = 1
rate.key_still_boost = 4
structure.unified = 1
structure.inherited_depth = 1
# The Default's sub-sample refinement gates before 2026-11-15, pinned so this
# preset's streams do not move with the Default.
decision.skip_no_refine_lambdas = 0.25
decision.refine_cheap_min_lambdas = 0.05

# Adaptive tool thresholds (2026-11-17, docs/handoff/light-pipeline.md
# "Adaptive tool thresholds"): the sub-pel seed gate and the exact-rank
# margin move per clip and frame role towards the engine's target win
# rates; here they mostly loosen. Against HEVC Faster (draw 2026-11-17):
# x86 callgrind x1.014 (chart clips, CBR 600); L1 (ladder) quality J
# -1.21 %; L3 (78 clips, dCPU +1.4 % at k 0.6) J -0.99 % [-1.41, -0.61]
# BETTER; fixed-QP lens Weighted / J +17.4 / +4.8 -> +16.2 / +3.4.
adapt.subpel = 1
adapt.rank = 1
adapt.probe = 1
# Whole-CU pricing of intra leaves (Default, 2026-11-19) was not screened here.
decision.cu_price_intra_lambdas = 0
# Pinned before the engine's coarser fixed-QP key under camera motion became the default
# (rate.fixed_qp_moving_key 6, 2026-11-19, docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
# Zero-vector SADs from pre-analysis, as H.264 / AV1 Veryfast and AV2 Faster
# (fast-analysis, 2026-11-21): the zz gates and the zero grid of static SBs
# read the pre-analysis 8x8 SADs instead of re-reading both frames. Jetson
# cycles -0.88% (pan / crowd / bodycam / static -0.04 / -0.67 / -1.24 /
# -1.57), x86 +0.02% instructions; quick (k 0.6) L1 -0.18% [-0.49, +0.17],
# probe +0.02%; final-check (600 f, keys every 10 s) J -0.01% [-0.21, +0.25],
# no guard; L3 -0.48% [-0.69, -0.26] BETTER (n 108). static_recovery passes.
analysis.zero_sads_from_pre = 1

# The Default's zero-trial split selector (planner.split_selector) stays off
# here until screened on this rung (docs/handoff/planner-selector.md).
planner.split_selector = 0
# The Default's filter-search effort by usage (filter.usage_quiet_share, 2026-11-21)
# is not screened here.
filter.usage_quiet_share = 0
# Medium's key RD search (2026-11-21) was screened on medium only. Medium's finer periodic
# keys (rate.key_level_finer 2) are not pinned since periodic keys are capped at 1.0 buffers
