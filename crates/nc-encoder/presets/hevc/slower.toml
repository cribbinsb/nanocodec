# HEVC slower (`--preset slower`): the rung between slow and veryslow on HEVC's front
# (docs/handoff/presets.md "The ladder"), from the gap study pl-s2-hevc-slow (trial 39;
# seeded from both neighbours): slow (presets/hevc/slow.toml, below) with the RD
# partition search ungated, the final decision stage, a two-step winner walk, a wider
# intra search (6 RD candidates, NxN), SAO band offsets searched every 4th CTB,
# trellis on chroma, 8x8-minimum inter CUs and the second reference on the high-quality
# frames. preset-ladder 2026-11-21 (ff40ad7bf): whole-encode 1.71x slow's time,
# veryslow 1.94x this rung's (Graviton 3/4 and Zen 5, 720p CBR 600); final check (34
# clips, 600 f, draw 2026-11-21) J -7.52 % [-8.79, -5.70] against medium (slow -3.41,
# veryslow -13.52 on the same build), within 0.41 of the slow-veryslow log-speed chord.
#
planner.rd_split = 1
planner.rd_split_context = 0
# Set by the pick, not in the file it starts from:
decision.final_intra_candidate = 1
decision.final_stage = 1
decision.winner_walk_keeps_skip = 1
decision.winner_walk_steps = 2
hevc.coarse_inter_intra = 0
hevc.intra_nxn_min_cost = 1
hevc.intra_rd_candidates = 6
hevc.sao_band = 1
hevc.sao_search_interval = 4
hevc.sao_skip_unchanged = 1
planner.inter_min_log2 = 4
planner.rd_split_deepen_context = 0
planner.rd_split_merge_context = 0
planner.split_selector = 0
planner.split_selector_scale = 0.3465
quant.trellis_chroma = 0.3725
quant.trellis_states = 1
# The second reference on the high-quality frames only (the unified plan), as slow:
# a `refs.second = 2` pin here was masked by the plan (TierPlan::planned) and removed
# (2026-11-24, docs/analysis/second-reference-consistency-2026-11-24.md; streams identical).
structure.unified = 1
# The Default's filter-search effort by usage (filter.usage_quiet_share, 2026-11-21)
# is not screened here.
filter.usage_quiet_share = 0
# Key frames: VVC slower's key RD search shape (1.5 gate, two levels each way) and periodic
# keys 2 QP units finer (HEVC medium's). With the search pinned off this rung coded cheaper,
# worse keys than medium (key ladder inverted). nceval.train against 038043e0f (draw
# 2026-11-22, idea key-search-on-rungs-above-medium): L3 J -0.37% [-0.99, +0.26], final check
# (600 f) -0.73% [-0.97, -0.51], no guard. One-frame key BD-J -5.7 %.
planner.key_rd_split = 1
planner.key_rd_margin = 1.5
planner.key_rd_deeper = 2
planner.key_rd_shallower = 2
rate.key_level_finer = 2

# G2 motion / sub-pel exit shifts: HEVC medium's (DEFAULT_PARAMS, 2026-11-22)
# pinned off here, not screened on this rung.
analysis.window_exit_shift_bias = 0
analysis.window_exit_shift_lambda = 0
analysis.window_exit_shift_noise = 0
analysis.window_exit_shift_nonbase = 0
analysis.zero_gate_shift_bias = 0
analysis.zero_gate_shift_lambda = 0
analysis.zero_gate_shift_neighbour_mv = 0
analysis.zero_gate_shift_noise = 0
analysis.zero_gate_shift_nonbase = 0
decision.skip_no_refine_shift_bias = 0
decision.skip_no_refine_shift_lambda = 0
decision.skip_no_refine_shift_noise = 0
decision.skip_no_refine_shift_nonbase = 0
decision.subpel_seed_shift_bias = 0
decision.subpel_seed_shift_lambda = 0
decision.subpel_seed_shift_noise = 0
decision.subpel_seed_shift_nonbase = 0
decision.subpel_seed_shift_size = 0
decision.subpel_seed_shift_zero_mv = 0
# Periodic keys at rate.key_cap_buffer 1.0 (the engine default), the first key at 0.8:
# nceval.train at both key shares (base 764c45048, front k), L3 byte-identical (one-key
# streams), final check BETTER at 1/150 and 1/300 (-1.19 / -0.53 %).
rate.key_cap_buffer_first = 0.8
