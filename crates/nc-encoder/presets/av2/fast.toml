# AV2 Fast: the speed point (docs/PROCEDURES.md "Preset roles"), judged at
# Fast's k 0.6 against our AV1 Fast (J_real board row). Levers ranked one by
# one against the AV2 Default (proxy-4, 60 f; quality % for Jetson CPU %,
# crowd/bodycam 720p CBR 600) and combined against AV1 Fast (proxy-6,
# 150 f); evidence in docs/handoff/av2.md "AV2 Fast". J_real vs AV1 Fast:
# TRAIN (18 clips) quality -5.7% full / -6.5% low, VAL (11 clips, full gate)
# -6.1% / -8.3%, no guard either (periodic-key pulse -0.09 / -0.11 dB).
# CPU vs AV1 Fast (crowd / bodycam 720p CBR 600, 150 f): Jetson
# instructions 1.55x / 1.36x (cycles 1.44x / 1.31x); x86 1.51x / 1.50x
# (static 1.60x). Default / Fast 1.45x / 1.58x (Jetson).
#
# AV1 Fast's search breadth where the quality cost is small: no cheap-
# vector refinement (+0.5% for -6.0%) and AV1 Default's exact-rank margin
# 1.1 (+0.1% for -2.5%).
decision.refine_cheap_vector = 0
light.decision.exact_rank_margin = 1.1
# AV1 Fast's sub-pel gates (seed 0.1 lambdas, move biases 1.1) on non-base
# frames only: on every frame they lost pan quality (proxy-6 vs AV1 Fast:
# pan class +4.1% with them, +1.0% non-base only).
nonbase.decision.codec_subpel_seed_lambdas = 0.1
nonbase.decision.subpel_move_bias = 1.1
nonbase.decision.subpel_move_bias_nonzero = 1.1
nonbase.decision.subpel_fractional_bias = 1.1
# Pre-transform luma skip (SVT light-PD1; +1.1% for -5.0%), the texture
# zero test at allowance 8 (+1.5% for -4.6%) and the skip estimate at 8
# (+0.5% for -1.8%).
nonbase.av2.pre_tx_skip = 1
nonbase.av2.zero_test_texture_scale = 8
nonbase.av2.skip_estimate = 8
# Luma-only deblocking (av2-fast-speed, 2026-11-13): the chroma channels
# cost 2.8% x86 instructions / 2.7% Jetson time for little: PSNR-YUV +2.0%
# but VMAF v1 -1.4%, MS-SSIM 0.0% (L2). Pool levels, rotation 2026-11-13,
# k 0.6, dCPU -2.7: L2 J -1.49%, L2+L3 pooled -1.14% [-1.49, -0.81]
# BETTER, no guard.
av2.deblock_chroma = 0
# CDEF's single-set probe measured on every 16th row of 8x8 units, not
# every 4th (av2-fast-speed, then the model's off-or-model check): x86
# -1.4%, Jetson -1.6%; L2 quality 0.0%, L2+L3 J -0.95% [-1.16, -0.76]
# BETTER at k 0.6, no guard.
av2.cdef_check_row_period = 16
# Trellis quantisation is a Default quality arm (+2.9% for -9.7%). CDEF
# codes one set chosen by the shared probe (off, the quantiser model and a
# short strength ladder; nc-encoder cdef_model.rs), not the search's sets.
# Probe vs the model alone (cdef-model-fix, 2026-11-18): VC-1K fixed QP J
# -14.0%, lens J -1.0, CBR L1 -3.4%, c8a +3.8% (search: -14.1%, ~+6%).
quant.trellis = 0
av2.cdef = 1
# Kept from the Default because they cost more than they save: deblocking
# (off: +3.2% for -4.9%, and +8% J_real against AV1 Fast in the bundle),
# the split inter layout (p_tx_split 0: +1.7% for -3.4%, pan guard) and the
# key-frame intra search (cut to AV1 Fast's breadth: worst-1% NEG and
# static classes, J_real +3% against AV1 Fast).
# Depth removal at threshold scale 1, as the Default (finer partitions on
# moving content): tuned jointly (eval/nceval/tune_pool.py, study
# av2-av2-fast-eq2-2026-11-11, trial #1, equal x86 CPU). Study clips J -1.49%,
# study L3 -1.06% [-1.40, -0.71] (overfit gap +0.43); re-checked at head
# 5911b553 on the study's rotation: L3 escalated to the full ladder (its
# single-point deltas trended with the rung, t -4.3) J -1.32% [-1.65, -0.97]
# on the 79 disjoint clips, L2 (ladder) -1.30% [-1.67, -0.96], no guard. CPU
# x86 +0.8%, Jetson cycles +0.2%.
planner.depth_removal_qp_scale = 1
# The Default's chroma P-frame rounding (48/128) is a Default quality arm;
# Fast keeps chroma at luma's 32/128.
av2.inter_chroma_rounding_delta_q7 = 0
# The Default's qindex-ramped finer chroma (av2.chroma_delta_q_coarse -12)
# stays off: 2026-11-20 ladder spacing, below.
av2.chroma_delta_q_coarse = 0
# The Default's luma give-back (P rounding 36/128, lambda 0.125 per squared
# step) is a Default quality arm, not screened on Fast.
av2.inter_rounding_q7 = 32
nonbase.av2.lambda_per_step_squared = 0.135
# The Default's jointly tuned planner lambda (2026-11-12) on light
# superblocks too: 2026-11-20 ladder spacing, below.
light.planner.lambda_scale = 2.58125
# AV2 Default's fixed-QP profile (2026-11-15) stays off here: pinned, byte-identical.
rate.fixed_qp_profile = 0
# The Default's parity hiding on non-base frames and no depth removal on
# light superblocks (2026-11-20 ladder spacing). With the light planner
# lambda above, single levers on the pool L1 draw (2026-11-20, k 0.6,
# quality J + 0.6 x callgrind dCPU with a key every 10 s, against Fast):
# light planner -0.88 (+0.6%), parity hiding -0.50 (+0.1%). Together (x86
# about +0.75%): L3 (108 clips, ladder) J -0.26% [-0.56, +0.06] BETTER;
# final-check (33 clips, 600 f) quality -1.19% [-1.45, -0.58], pulse worst
# clip +0.52 dB (guard 0.50), adopted. The Default's chroma rounding and finer chroma
# (L1 -0.60 at +2.7%) were in the first bundle: final-check quality -3.39%
# but worst-1% luma frames +3.3% (26/33 clips worse), so they stay off.
# Not taken: flat structure (quality -3.1%
# for +5.8%, J +0.42), the Default's luma rounding, non-base skip gates and
# sub-pel margins, chroma deblocking (+5.3%), CDEF search, trellis.
nonbase.av2.parity_hiding = 1
light.planner.depth_removal_th_32_16 = 0
light.planner.depth_removal_th_16_8 = 0

# AV1 Faster's gated temporal layers (L1T3 where the camera is steady and the
# scene neither mostly static nor repeated; shared engine) and the engine's
# coordinate-walk sub-sample search (av2-fast-rungs, 2026-11-18). Lens vs the
# previous Fast: W -16.1 -> -18.1, J -24.7 -> -25.1 at -18.5 % c8a fixed-QP
# time (568.2 against 463.3 fps, M12 893.8); CBR pool L1 quality -0.28 % at
# -1.3 % x86 instructions (the gates keep the chart clips mostly flat).
layers.count = 3
layers.adaptive = 1
layers.adaptive_max_camera_motion = 16
layers.adaptive_max_compensable = 1
layers.adaptive_max_repeat_share = 0.25
layers.adaptive_max_static = 0.68
layers.adaptive_max_camera_jitter = 2
decision.subpel_walk = 2
decision.subpel_walk_max_noise_sigma = 1

# Effort by frame role, "base-only" (2026-11-17, docs/analysis/zen5-fixed-qp-goal.md
# "Base-only on the other codecs"): keys and base frames code with the
# Default's per-block tools (below); non-base frames keep Fast's, the
# `light.*` / `nonbase.*` values above (same values as before). Frame-level
# settings (rounding, chroma offsets, loop filter, key step) stay Fast's.
av2.lambda_per_step_squared = 0.125
av2.parity_hiding = 1
av2.pre_tx_skip = 0
av2.skip_estimate = 4
av2.zero_test_texture_scale = 4
decision.exact_rank_margin = 0
planner.depth_removal_th_16_8 = 0
planner.depth_removal_th_32_16 = 0
planner.lambda_scale = 2.58125
effort.regular_fraction = 0
effort.light_nonbase_only = 1

# Mode-decision trials price coefficient levels with the fitted model
# (av2-cheap-rate, 2026-11-18; coeff::rate_model): c8a fixed-QP lens 607.0 ->
# 670.5 fps (+10.5 %; M12 897.6, same session) at W -18.1 -> -17.7 / J -25.1 ->
# -24.6; CBR 600 x86 instructions -6.0 % (lowlight -9.9, crowd -4.4, bodycam -3.6).
# CBR pool at dCPU -6.0, k 0.6: L1 J -2.76 % (drone class quality +5.8 at L1
# only), L2 -3.27 %, L3 -3.30 % [-3.55, -3.04] BETTER (n 78); final-check
# quality +0.74 % [+0.45, +0.89], pulse balanced +0.01 dB, worst clip +0.75 dB.
# Long single-key run: within 0.11 dB, no drift.
av2.coeff_rate_model = 1
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0

# Rate control and references as the Default (av2-pareto, 2026-11-19): the
# engine's QP cadence scale, key-period ceiling, key still boost, inherited
# cadence depth, unified reference plan and quiet second before keys, which
# Fast had pinned off as each landed for the Default. x86 instructions (CBR
# 600, 150 f; bodycam / crowd / lowlight) -0.7 / -1.2 / -0.8 %. CBR pool
# against the old Fast (k 0.6, dCPU -0.9, rotation 2026-11-19): L1 J -1.25 %
# [-1.94, -0.60], L2 -3.95 % [-4.88, -2.96], L3 -3.31 % [-3.91, -2.69]
# BETTER (n 108; quality alone -2.77 %, static class -6.1 %), no guard,
# periodic-key pulse within -1.20..+0.28 dB (2 s keys, one clip a class).
# Fixed QP lens (box) W / J -19.8 / -25.4 -> -20.2 / -25.6. Long single-key run (900 f, CBR 600, PSNR-Y per third against
# the old Fast): crowd_mot20_02 0.00 / +0.01 / 0.00 dB, chirla static
# -0.04 / +0.21 / +0.34 dB.
# The engine's still-level damping arrived with the AV2 Default (2026-11-19,
# docs/handoff/rate-control.md): not screened for this preset.
rate.still_level_damping = 0
# AV2 Default's key still boost moved 4 -> 6 (2026-11-19, docs/handoff/rate-control.md):
# not screened for this preset.
rate.key_still_boost = 4
