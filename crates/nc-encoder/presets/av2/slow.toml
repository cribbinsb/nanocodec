# AV2 slow (`--preset slow`): the Default plus the RD partition search with its
# context gate (`nc_encoder` `rd_split.rs`, `depth_context.rs`;
# docs/handoff/rd-split-gate.md): inter nodes decided by coding the plan's
# alternative where the neighbours' and co-located leaf sizes suggest it.
# The rung between medium and slower on AV2's front (docs/handoff/presets.md
# "The ladder"). Against medium, preset-ladder 2026-11-21 (16a104a1b): whole-encode
# fps 105.5 -> 80.0 (1.32x the time) (combined: Graviton 3/4 and Zen 5, log-equal ARM/x86, 720p CBR 600,
# 4 quick clips); final check (34 clips, 600 f, keys every 10 s, draw 2026-11-21)
# J -4.39 % [-4.74, -3.63], no guard.
# rd-gate train (k 0.1, base a10208d08): L3 J -0.97 % [-1.62, -0.34] n108,
# final check -4.27 % [-4.70, -3.48] n34, no guard.
planner.rd_split = 1
planner.rd_split_context = 1

# Layer propagation (the codec Default's flat-stream form, docs/handoff/temporal-lambda.md)
