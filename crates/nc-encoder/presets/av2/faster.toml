# AV2 Faster: the rung below AV2 Fast (av2-fast-rungs agent, 2026-11-18;
# docs/handoff/vp9-av2.md "AV2 Faster and Veryfast"). AV2 Fast plus AV1
# Veryfast's temporal structure with Faster's static-scene gate, the engine's
# coordinate-walk sub-sample search, wider non-base skip and split gates, one
# non-base inter layout and the key planner's 16x16 floor. Lens (vs x264
# medium) W -13.3 / J -22.2 against Fast's -16.1 / -24.7, c8a fixed-QP
# time and CBR pool levels in the handoff and the lever ledger (base fast).
#
# AV2 Fast, listed so these streams do not move with it:
decision.refine_cheap_vector = 0
light.decision.exact_rank_margin = 1.1
nonbase.decision.codec_subpel_seed_lambdas = 0.1
nonbase.decision.subpel_move_bias = 1.1
nonbase.decision.subpel_move_bias_nonzero = 1.1
nonbase.decision.subpel_fractional_bias = 1.1
nonbase.av2.pre_tx_skip = 1
nonbase.av2.zero_test_texture_scale = 8
av2.deblock_chroma = 0
av2.cdef_check_row_period = 16
quant.trellis = 0
av2.cdef = 1
planner.depth_removal_qp_scale = 1
av2.inter_chroma_rounding_delta_q7 = 0
av2.chroma_delta_q_coarse = 0
av2.inter_rounding_q7 = 32
nonbase.av2.lambda_per_step_squared = 0.135
rate.cadence_scale = 0.7
light.planner.lambda_scale = 2
rate.period_ceiling = 0
rate.key_still_boost = 0
rate.fixed_qp_profile = 0
structure.inherited_depth = 0
nonbase.av2.parity_hiding = 0
light.planner.depth_removal_th_32_16 = 25
light.planner.depth_removal_th_16_8 = 50
structure.unified = 0
rate.prekey_quiet = 0
av2.lambda_per_step_squared = 0.125
av2.parity_hiding = 1
av2.pre_tx_skip = 0
av2.skip_estimate = 4
av2.zero_test_texture_scale = 4
decision.exact_rank_margin = 0
planner.depth_removal_th_16_8 = 0
planner.depth_removal_th_32_16 = 0
planner.lambda_scale = 2.58125
effort.regular_fraction = 0
effort.light_nonbase_only = 1

# Temporal layers (shared engine): fixed L1T3 with AV1 Veryfast's camera
# gates (jitter 8, camera motion 64, compensable 1) and the layered key planned
# against its mini-GOP's mean step (`rate.key_level_mean`), plus AV1 Faster's
# static-scene gate (0.68). Codec reason for the static gate: AV2's layered
# keys on static scenes dip far below the P frames before them (chirla 1080x720,
# keys every 2 s, CBR 400: key PSNR-Y 30.7 dB against Fast's 34.5 without the
# gate, 34.4 with it). Lens vs Fast: W +0.7 / J +1.0 for -21.2 % c8a time;
# CBR x86 instructions -7.1 %.
layers.count = 3
layers.adaptive_max_camera_motion = 64
layers.adaptive_max_compensable = 1
layers.adaptive_max_camera_jitter = 8
layers.adaptive_max_static = 0.68
rate.key_level_mean = 1
# The engine's SVT coordinate-walk sub-sample search (as AV1 Fast / Faster):
# lens W -0.85 / J -0.46 at -0.2 % time.
decision.subpel_walk = 2
decision.subpel_walk_max_noise_sigma = 1
# Non-base frames: wider residual-free skip and split-layout gates, one inter
# luma layout (AV1 Faster's `av1.inter_tx_split` 0) and the pre-transform
# skip's energy gate at AV1 Faster's light 100. Lens singles vs Fast: skip
# estimate 32 W +0.5 for -2.1 % time, split gate 16 W +0.4 for -2.0 %, one
# layout W +2.3 for -6.0 %, energy W +0.9 for -2.1 %.
nonbase.av2.skip_estimate = 32
nonbase.av2.inter_split_min_nonzero = 16
nonbase.av2.p_tx_split = 0
nonbase.av2.pre_tx_skip_energy = 100
# Key frames: no 8x8 blocks (the planner's 16x16 floor). Key-frame x86
# instructions (Johnny 720p q160) -15 %; lens W +0.8 for -3.5 % time. AV2's
# cheaper key intra search (one RD candidate, no angle deltas) was left out:
# it lowered periodic keys by 1.9 dB on static content.
planner.intra_min_log2 = 4

# Mode-decision trials price coefficient levels with the fitted model instead
# of the context walk (av2-cheap-rate, 2026-11-18; coeff::rate_model, VAL error
# 5.7 % of level bits, bias +0.3 %). c8a fixed-QP lens 692.5 -> 754.4 fps (M12
# 897.6, same session) at W -13.3 -> -12.8 / J -22.2 -> -21.7; CBR 600 x86
# instructions -6.1 % (lowlight -10.2, crowd -4.3, bodycam -3.8). CBR pool at
# dCPU -6.1, k 0.6: L1 J -2.85 %, L2 -3.29 %, L3 -3.37 % [-3.58, -3.15] BETTER
# (n 78); final-check quality +0.79 % [+0.40, +1.01] (a speed rung's cost),
# periodic-key pulse balanced +0.01 dB, worst clip +0.88 dB (meva_admin static,
# its first key -0.10 dB). Long single-key run: no drift (within 0.08 dB).
av2.coeff_rate_model = 1
# Pinned before the Default's coarser fixed-QP key under camera motion (2026-11-19,
# docs/handoff/rd-depth.md): not screened for this preset.
rate.fixed_qp_moving_key = 0
