[package]
name = "nc-h264"
description = "nanocodec H.264 backend: parameter sets, CABAC, integer transforms, macroblock coding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nc-common.workspace = true
nc-dsp.workspace = true
nc-encoder.workspace = true

[features]
# Decoder analysis hooks (`decoder::stats`): off in normal builds, so the
# decoder contains no analysis code (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
