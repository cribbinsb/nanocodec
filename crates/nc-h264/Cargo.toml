[package]
name = "nanocodec-h264"
description = "nanocodec H.264 encoder backend for the shared engine, and an H.264 decoder for progressive Constrained Baseline, Main, High and High 10 streams (not yet interlaced streams or sizes above level 5.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nanocodec-h264"
keywords = ["video", "codec", "encoder", "decoder", "h264"]
categories.workspace = true

[lib]
name = "nc_h264"

[dependencies]
nc-common.workspace = true
nc-dsp.workspace = true
nc-encoder.workspace = true

[features]
# Decoder analysis hooks (`decoder::stats`): off in normal builds, so the
# decoder contains no analysis code (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
