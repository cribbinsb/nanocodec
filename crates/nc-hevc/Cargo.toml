[package]
name = "nanocodec-hevc"
description = "nanocodec HEVC encoder backend for the shared engine, and an HEVC decoder for the streams it emits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nanocodec-hevc"
keywords = ["video", "codec", "encoder", "decoder", "hevc"]
categories.workspace = true

[lib]
name = "nc_hevc"

[dependencies]
nc-common.workspace = true
nc-encoder.workspace = true
nc-dsp.workspace = true

[features]
# Decoder analysis hooks (`dec::stats`): off in normal builds, so the
# decoder contains no analysis code (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
