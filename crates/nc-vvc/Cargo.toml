[package]
name = "nc-vvc"
description = "H.266/VVC shared-engine backend and subset decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
nc-common.workspace = true
nc-dsp.workspace = true
nc-encoder.workspace = true

[features]
# Decoder analysis records (`analysis`, `decoder_blocks::analysis`): off in
# normal builds, so the decoder contains no analysis code
# (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
