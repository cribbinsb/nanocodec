[package]
name = "nanocodec-vvc"
description = "nanocodec H.266/VVC encoder backend for the shared engine, and a VVC Main 10 decoder (226 of 283 official H.266.1 conformance streams; not yet: reserved NAL types and layer ids above 0 are rejected, not ignored)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nanocodec-vvc"
keywords = ["video", "codec", "encoder", "decoder", "vvc"]
categories.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
name = "nc_vvc"

[dependencies]
nc-common.workspace = true
nc-dsp.workspace = true
nc-encoder.workspace = true

[features]
# Decoder analysis records (`analysis`, `decoder_blocks::analysis`): off in
# normal builds, so the decoder contains no analysis code
# (docs/handoff/stream-analysis.md).
analysis = ["nc-common/analysis"]

[lints]
workspace = true
