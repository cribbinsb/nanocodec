[package]
name = "nanocodec-capi"
description = "C ABI for embedding the nanocodec encoders and decoders (staticlib/cdylib + include/nanocodec.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://cribbinsb.github.io/nanocodec/docs/c-api.html"
keywords.workspace = true
categories.workspace = true

# The C library is `libnanocodec`. No rlib and no rustdoc: Rust code uses the
# `nanocodec` crate, whose library has the same name (two `libnanocodec.rlib`
# or two `nanocodec` doc pages in one build overwrite each other). The API
# documentation is the header, include/nanocodec.h.
[lib]
name = "nanocodec"
crate-type = ["staticlib", "cdylib"]
doc = false

[features]
# Exports `nc_debug_panic`, a deliberate panic inside the ABI guard, for
# tools/ci/capi_check.sh. Never in a shipped build.
panic-probe = []

[dependencies]
nc-common.workspace = true
nc-encoder.workspace = true
nc-rtp.workspace = true
nc-h264.workspace = true
nc-hevc.workspace = true
nc-av1.workspace = true
nc-vp9.workspace = true

[lints]
workspace = true
