# nanocodec Cargo workspace. Layout and rules: CLAUDE.md, docs/ARCHITECTURE.md.

[workspace]
resolver = "3"
members = [
    "crates/nc-common",
    "crates/nc-dsp",
    "crates/nc-analysis",
    "crates/nc-checkasm",
    "crates/nc-encoder",
    "crates/nc-av1",
    "crates/nc-vp9",
    "crates/nc-av2",
    "crates/nc-h264",
    "crates/nc-hevc",
    "crates/nc-vvc",
    "crates/nc-capi",
    "crates/nc-cli",
    "crates/nc-web",
    "crates/nanocodec",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "BSD-3-Clause"
repository = "https://github.com/cribbinsb/nanocodec"
homepage = "https://cribbinsb.github.io/nanocodec/"
keywords = ["video", "codec", "encoder", "decoder", "realtime"]
categories = ["multimedia::video", "multimedia::encoding"]

[workspace.dependencies]
# Published as `nanocodec-*` (crates.io), used as `nc_*` in Rust: each key is
# the directory and library name. The version is what a published crate
# resolves; the path is what the workspace builds.
nc-common = { package = "nanocodec-common", version = "0.6.0", path = "crates/nc-common" }
nc-dsp = { package = "nanocodec-dsp", version = "0.6.0", path = "crates/nc-dsp" }
nc-analysis = { package = "nanocodec-analysis", version = "0.6.0", path = "crates/nc-analysis" }
nc-encoder = { package = "nanocodec-encoder", version = "0.6.0", path = "crates/nc-encoder" }
nc-av1 = { package = "nanocodec-av1", version = "0.6.0", path = "crates/nc-av1" }
nc-av2 = { package = "nanocodec-av2", version = "0.6.0", path = "crates/nc-av2" }
nc-vp9 = { package = "nanocodec-vp9", version = "0.6.0", path = "crates/nc-vp9" }
nc-h264 = { package = "nanocodec-h264", version = "0.6.0", path = "crates/nc-h264" }
nc-hevc = { package = "nanocodec-hevc", version = "0.6.0", path = "crates/nc-hevc" }
nc-vvc = { package = "nanocodec-vvc", version = "0.6.0", path = "crates/nc-vvc" }

[workspace.lints.rust]
# `deny`, not `forbid`, so that nc-dsp can allow it on its kernel modules
# only. Every other crate additionally has `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Pixel code converts between integer widths constantly, always with known
# ranges; these lints would bury real findings.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Kernel argument lists mirror their mathematical definition.
too_many_arguments = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# The browser module (tools/web/build.sh). Thin LTO decodes as fast as fat
# LTO in WASM with less cold build time; `strip = true` drops the ~0.52 MB
# `custom:name` section at zero runtime or build-time cost. Lower opt levels
# hurt decode speed (`opt-level = 2`: -3.1% geomean for -1.0 MB; `opt-level = "s"`
# with `nanocodec-dsp` at 3: -21.9% geomean for -1.7 MB), and Binaryen
# `wasm-opt -O3` adds +1.46 MB (+9.4%) for +1.7% decode fps (2026-11-22,
# Zen 5, six codecs, `docs/results/decoder-yardstick-2026-11-22.md`).
[profile.web]
inherits = "release"
lto = "thin"
strip = true

# The landing gate's release builds (host checkasm, the browser module smoke
# test): release code generation without whole-program LTO, split into
# codegen units and incremental, so a rebuild after a one-crate change takes
# seconds instead of a full fat-LTO link. LTO and unit splitting change no
# results, only speed; measured releases still use `release`.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The workspace tests (tools/ci/check.sh): the gate profile's optimised code with
# debug assertions and overflow checks on, which catch a wrapped narrow (i16/u16)
# coefficient or SAD. Its own profile, so the gate builds are not rebuilt.
[profile.gate-test]
inherits = "gate"
debug-assertions = true
overflow-checks = true

# Benchmarks and checkasm want release code generation with debug info for
# profiling.
[profile.profiling]
inherits = "release"
debug = true

# Unoptimised DSP kernels keep every temporary of the inlined transform
# graphs in its own stack slot (forward 64x64: ~470 KiB per call), which put
# debug test threads near their 2 MiB stack. Basic optimisation coalesces
# them; debug assertions and overflow checks stay on.
[profile.dev.package.nanocodec-dsp]
opt-level = 1

# Tests run encodes and decodes of whole pictures; unoptimised they took 75 s
# of the workspace test run, at opt-level 1 they take 17 s, for 19 s more
# cold build (2026-11-10, -j8, see docs/PROCEDURES.md "Landing"). Debug
# assertions and overflow checks stay on.
[profile.test]
opt-level = 1
