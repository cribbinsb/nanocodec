# VP9 SVC3 Fast: vp9-svc3's three spatial layers (L3T1, 720p30 over 360p30
# over 180p30) at vp9-svc-fast's levers: VP9 Fast's coding levers
# (presets/vp9-fast.toml, copied below), each lower layer's source by the 2x2
# mean (`spatial.base_box_downscale`) and a bilinear search proxy of each
# upscaled lower layer (`spatial.proxy_bilinear`), both applied at every exact
# 2:1 step. VP9 Fast's partial forward transform is kept: `Vp9Backend`
# transforms enhancement pictures coded from the upscaled lower layer only
# (key or repair units) without partial-forward pruning
# (static_recovery.rs `vp9_three_layer_svc_recovers_every_upper_layer`).
