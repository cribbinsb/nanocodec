# The shared slow bundle: what every codec's `slow` rung starts from, applied
# by the engine (nc_encoder::presets) before the codec's
# presets/<codec>/slow.toml, which adds the levers that pass for that codec.
# A lever is in slow when its measured J gain pays for its CPU at k 0.025
# (docs/analysis/lever-gradients-2026-11-15.md); this file holds the one
# that passes for every codec that can signal it.
#
# The last high-quality frame (key or cadence base) as a second reference on
# every frame with the full mode decision, not only on the high-quality
# frames the unified plan offers it on. CBR L3 against each Default: HEVC
# -1.65% at +24.8% Jetson cycles, AV1 -2.00% at +22%, VVC -1.91% at +13.7%,
# AV2 -1.46% at +11.9%; VP9 fixed QP -2.2% at +8.3%.
structure.unified = 0
refs.second = 1
refs.second_full = 1
