# AV1 SVC Fast: av1-svc's two spatial layers (L2T1, 720p30 over a 360p30 base)
# at AV1 Fast's coding levers, plus two SVC-only speed levers: the base
# layer's source by the 2x2 mean (`spatial.base_box_downscale`) and a bilinear
# search proxy of the upscaled base (`spatial.proxy_bilinear`). Target: at or
# above libaom svc_encoder_rtc rt 10's speed, far ahead of it on BD-J
# (docs/results/svc-chart.md). Screened on 5 chart clips (one per class, 150
# frames, the SVC chart's rungs), BD-J of operating point 0 vs x264 medium:
# av1-svc -38.5%; Fast levers -31.6%; + bilinear proxy -31.5%; + box
# downscale -31.4% (both levers free in quality). Callgrind, crowd_mot17_09,
# 60 frames, 600 kbps: 174 -> 126 -> 122 -> 106 M instructions per frame.
# AV1 Faster's levers cost far more here than single-layer (-22.0%).
