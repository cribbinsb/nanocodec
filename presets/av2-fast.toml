# AV2 Fast: the speed point (docs/PROCEDURES.md "Preset roles"), judged at
# Fast's k 0.6 against our AV1 Fast (J_real board row). Levers ranked one by
# one against the AV2 Default (proxy-4, 60 f; quality % for Jetson CPU %,
# crowd/bodycam 720p CBR 600) and combined against AV1 Fast (proxy-6,
# 150 f); evidence in docs/handoff/av2.md "AV2 Fast". J_real vs AV1 Fast:
# TRAIN (18 clips) quality -5.7% full / -6.5% low, VAL (11 clips, full gate)
# -6.1% / -8.3%, no guard either (periodic-key pulse -0.09 / -0.11 dB).
# CPU vs AV1 Fast (crowd / bodycam 720p CBR 600, 150 f): Jetson
# instructions 1.55x / 1.36x (cycles 1.44x / 1.31x); x86 1.51x / 1.50x
# (static 1.60x). Default / Fast 1.45x / 1.58x (Jetson).
#
# AV1 Fast's search breadth where the quality cost is small: no cheap-
# vector refinement (+0.5% for -6.0%) and AV1 Default's exact-rank margin
# 1.1 (+0.1% for -2.5%).
decision.refine_cheap_vector = 0
decision.exact_rank_margin = 1.1
# AV1 Fast's sub-pel gates (seed 0.1 lambdas, move biases 1.1) on non-base
# frames only: on every frame they lost pan quality (proxy-6 vs AV1 Fast:
# pan class +4.1% with them, +1.0% non-base only).
nonbase.decision.codec_subpel_seed_lambdas = 0.1
nonbase.decision.subpel_move_bias = 1.1
nonbase.decision.subpel_move_bias_nonzero = 1.1
nonbase.decision.subpel_fractional_bias = 1.1
# Pre-transform luma skip (SVT light-PD1; +1.1% for -5.0%), the texture
# zero test at allowance 8 (+1.5% for -4.6%) and the skip estimate at 8
# (+0.5% for -1.8%).
av2.pre_tx_skip = 1
av2.zero_test_texture_scale = 8
av2.skip_estimate = 8
# Luma-only deblocking (av2-fast-speed, 2026-11-13): the chroma channels
# cost 2.8% x86 instructions / 2.7% Jetson time for little: PSNR-YUV +2.0%
# but VMAF v1 -1.4%, MS-SSIM 0.0% (L2). Pool levels, rotation 2026-11-13,
# k 0.6, dCPU -2.7: L2 J -1.49%, L2+L3 pooled -1.14% [-1.49, -0.81]
# BETTER, no guard.
av2.deblock_chroma = 0
# CDEF's model strengths checked on every 16th row of 8x8 units, not every
# 4th (av2-fast-speed): x86 -1.4%, Jetson -1.6%; L2 quality 0.0%, L2+L3
# J -0.95% [-1.16, -0.76] BETTER at k 0.6, no guard.
av2.cdef_check_row_period = 16
# Trellis quantisation is a Default quality arm (+2.9% for -9.7%); CDEF uses
# the quantiser model's strengths instead of the search (+2.2% for -6.2%).
quant.trellis = 0
av2.cdef = 1
# Kept from the Default because they cost more than they save: deblocking
# (off: +3.2% for -4.9%, and +8% J_real against AV1 Fast in the bundle),
# the split inter layout (p_tx_split 0: +1.7% for -3.4%, pan guard) and the
# key-frame intra search (cut to AV1 Fast's breadth: worst-1% NEG and
# static classes, J_real +3% against AV1 Fast).
# Depth removal at threshold scale 1, as the Default (finer partitions on
# moving content): tuned jointly (eval/nceval/tune_pool.py, study
# av2-av2-fast-eq2-2026-11-11, trial #1, equal x86 CPU). Study clips J -1.49%,
# study L3 -1.06% [-1.40, -0.71] (overfit gap +0.43); re-checked at head
# 5911b553 on the study's rotation: L3 escalated to the full ladder (its
# single-point deltas trended with the rung, t -4.3) J -1.32% [-1.65, -0.97]
# on the 79 disjoint clips, L2 (ladder) -1.30% [-1.67, -0.96], no guard. CPU
# x86 +0.8%, Jetson cycles +0.2%.
planner.depth_removal_qp_scale = 1
# The Default's chroma P-frame rounding (48/128) is a Default quality arm;
# Fast keeps chroma at luma's 32/128.
av2.inter_chroma_rounding_delta_q7 = 0
# The Default's qindex-ramped finer chroma (av2.chroma_delta_q_coarse -12)
# is a Default quality arm, not screened on Fast.
av2.chroma_delta_q_coarse = 0
# The Default's luma give-back (P rounding 36/128, lambda 0.125 per squared
# step) is a Default quality arm, not screened on Fast.
av2.inter_rounding_q7 = 32
av2.lambda_per_step_squared = 0.135
# The Default's QP cadence moved to the engine's full scale (2026-11-11,
# nc-av2 RATE_MODEL); Fast keeps the old 0.7: at 1.0 vs 0.7 (k 0.6) proxy-6
# -1.2% but VAL WORSE (static +4.5% / low +6.7%, worst-1% VMAF +2.3%).
rate.cadence_scale = 0.7
# The Default's jointly tuned planner lambda (2026-11-12) is not screened for
# this preset: it keeps the previous value.
planner.lambda_scale = 2
