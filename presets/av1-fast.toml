# Earlier probe-stage measurements below precede the seed .1 update.
# AV1 speed/quality tradeoff: residual rejection, adaptive chroma, gated probes.
# Gated probes add TRAIN PSNR/V1 BD -1.700%/-1.948%, VAL -1.989%/-1.077%
# versus the previous Fast below. VAL airport V1 regresses +6.470%.
# Updated Fast versus adaptive Default: VAL +3.280% PSNR/+2.296% V1.
# Incremental native CPU: body -0.767%, crowd -1.362%, static +2.170%.
