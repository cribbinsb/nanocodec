# Callgrind +1.2% (lowlight) / +1.6% (crowd) instructions; J = dBD +
# 0.6 dCPU ~ -0.7. The noise gate meant to protect such clips
# (cdef_local_noise_full_search_sigma 1) never fires on them (sigma < 1).
# Strong-CDEF gate 300 -> 0 (as the Default since 7204ded): on TRAIN the
# streams are byte-identical except lowlight_bdd_00c497ae (PSNR/V1 BD
