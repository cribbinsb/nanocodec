# Incremental TRAIN PSNR/V1 BD +0.975%/+1.279%; held-out +1.018%/+1.109%.
# Worst held-out V1 clip: crowd +4.035%; fixed noise loss .0282 V1 points.
# Current Fast vs Default VAL: +4.384% PSNR/+3.451% V1; versus SVT
# +12.600% PSNR/-.690% V1. This remains a speed/quality tradeoff.
