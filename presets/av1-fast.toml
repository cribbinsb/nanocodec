# Worst: OTW390 PSNR +7.49% (V1 -9.71%); lowlight_bdd_00ce95b0 +2.78%/+3.22%.
# Noise: every best/200k/400k delta improves on both metrics (VAL); TRAIN
# pan noise loses up to 0.05 dB/0.6 V1 points, statics gain. Body/pan packets
# equal fixed strong15, which saved 5.6%/4.0% native CPU. Speed elsewhere not
