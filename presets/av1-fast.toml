# Historical pre-probe Fast results follow:
# Frozen 21-clip TRAIN, 15 natural clips versus historical fast0: PSNR/VMAF-v1 BD
# -8.232%/-5.979%; versus olddefault0: -3.617%/-6.645%.
# Supported 12-clip held-out VAL 10 natural clips versus CURRENT adaptive default:
# PSNR/VMAF-v1 BD +5.310%/+3.447%. Airport/homes390 VMAF costs
# +11.824%/+14.893%; crowd improves 2.305%. All 10 comparisons reliable.
# Inherited fast noise: worst fixed VAL loss 0.154 dB PSNR/0.365 V1 points;
# best high-noise V1 loses 0.594 points. No BD-rate is used on noise.
# This is not superior to current default; use it when its CPU saving matters.
# Native 720p fixed-QP three paired 150f runs: CPU -13.42% bodycam/-16.67%
# crowd versus current adaptive default, rates -0.77%/-0.58%; not matched-quality.
# Evidence: external cdef-agent/fast-adaptive-{train21,val12}/summary.json
# and fast-adaptive-val12/report-final.json. Historical candidates stay0/0.
# The quality-first Default (2026-11-08) adds sub-pel margins 1 and the
# cheap-vector refinement; Fast keeps the engine values (its probe stays
# gated below).
decision.subpel_move_bias = 1.1
decision.subpel_move_bias_nonzero = 1.1
decision.subpel_fractional_bias = 1.1
decision.refine_cheap_vector = 0
av1.inter_tx_split = 0
av1.pre_tx_luma_dominant = 1
av1.pre_tx_skip = 1
# SVT's fixed coded-cost guess in the RD signal (Default uses the
# zero-residual test since 2026-11-08; not screened on Fast).
av1.pre_tx_skip_model = 0
av1.pre_tx_skip_energy = 30
av1.pre_tx_skip_rd = 100
av1.pre_tx_skip_score = 70
av1.residual_rd_max_mv = 8
av1.transform_rd_gain_scale = 1.25
av1.transform_rd_skip = 2
av1.transform_rd_skip_chroma = 1
av1.transform_rd_uv_max_noise_sigma = 1
decision.codec_subpel_seed_lambdas = 0.1
decision.subpel_walk = 2
decision.subpel_walk_max_noise_sigma = 1
av1.chroma_delta_q = -24
# Fast keeps its own chroma offset, not the engine chroma policy (which the
# AV1 Default also left 2026-11-11): policy (offset -1) vs this Fast, staged TRAIN J_real k 0.6:
# +0.3% (dCPU 0; x86 instructions +0.43% more), WORSE
# (docs/handoff/chroma-policy.md).
chroma.policy = 0
av1.chroma_noise_scale = 2
decision.codec_fullpel_probe = 1
decision.codec_fullpel_probe_min_lambdas = 0.0094
av1.cdef_per_superblock = 1
av1.cdef_local_strong_luma = 1
av1.cdef_local_strong_primary = 15
av1.cdef_local_strong_variance_min = 0
av1.cdef_local_noise_full_search_sigma = 1
av1.cdef_local_strong_model_scale = 3
# Deblocking stays off in Fast when the Default adopted it (J_real TRAIN
# quality -5.1%, but +9.0% Fast instructions: J_real about 0 at k 0.6).
av1.loop_filter = 0
# Default's depth removal threshold (+5-10% instructions) stays off.
planner.depth_removal_min_quantizer = 0
# Trellis quantisation is a Default quality arm (+15% P-frame instructions
# for J_real quality -2.2% at k 0.1); Fast keeps the plain quantiser.
quant.trellis = 0
# The Default's fuller key-frame intra set (J_real TRAIN -0.3 at k 0.1, key
# frames +60-75% instructions: key/P up to 21x on x86) stays off: Fast keeps
# the ~10x key/P guard.
av1.keyframe_directional = 0
av1.keyframe_angle_deltas = 0
av1.keyframe_filter_intra = 0
# Fast keeps Default's start-up QP cadence (base boost 4) and cadence motion
# gate: proxy-6 J_real (k 0.6) vs both off BETTER -1.3% (crowd -3.5%, static
# -2.1%), no guard, pulse -0.01 dB; CPU-neutral (docs/handoff/vvc.md, qp-cascade).
# The Default's directional P-frame intra estimate and inter-frame intra
# search stay off: proxy-6 J_real (k 0.6) +0.6%, quality -0.5% / -0.5% at
# +1.9% x86 CPU (Jetson instructions +5.9% / +2.6%), stopped.
decision.intra_directional = 0
av1.inter_intra_search = 0
# Low-frequency forward for 32x32 and 64x64 residuals in coding too (as
# HEVC Fast's fast_forward16/32; av1-faster agent, 2026-11-11, owner
# decision). Proxy-6 150 f vs the previous Fast, k 0: J_real -1.0% (PSNR-YUV
# +1.1, VMAF v1 -1.7, MS-SSIM -2.8), Jetson -2.3% time. Worst-1% PSNR-Y
# +2.2% sits just over the 2.0 guard: it comes from the first frames after the
# key on pan_jaad_0117 (-0.5 dB on frame 1 at 600 kbps, worst 4-frame window
# itself unchanged or better), and the frame shows no artefact (softer fine
# texture only); the other metrics improve.
av1.partial_forward = 2
# P-frame rounding offset 41/128 (code default 48): a wider encoder-side
# deadzone drops more small P-frame coefficients. Sensitivity sweep
# (16 clips) J -2.20 % at x0.981 x86 CPU; parameter-only L3 final-check on
# the disjoint 2026-11-11 pool draw (79 clips, single-point) J -2.22 %
# [-2.65, -1.72] BETTER, no guards (44: sweep -1.94 %, L3 -1.70 %).
av1.inter_rounding_q7 = 41
# Key frames DC-only, as SVT M12 (intra DC_PRED only from M11 up) and
# av1-faster (av1-fast-speed, 2026-11-13). Key frame 633/909/746 -> 355/483/
# 419 M x86 instructions (bodycam_bc1/lowlight_city_night/crowd_mot17_09):
# 150 f -3.8% x86 instructions, Jetson -2.0% (jbins, CBR 600, 3 rounds).
