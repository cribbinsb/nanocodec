# VP9 Fast: the speed point (docs/PROCEDURES.md "Preset roles"). Bars
# (coordinator, 2026-11-09): CPU <= ~1.4x our HEVC Fast on the Jetson, and
# J_real vs our HEVC Fast with no class guard failing; judged at Fast's k 0.6.
#
# Smaller inter transforms only for locally concentrated residual (HEVC's
# inter_tu_split_spread): crowd 720p q230, Jetson -7.2% / x86 -3.9% CPU;
# J_real TRAIN quality vs Default +1.6% full / +1.2% low (proxy-6).
# HEVC Fast's sub-pel gates (seed variance 0.05 lambdas, move biases 1.1)
# and the quarter-sample stage only after a half-sample move: with the
# spread gate off, Jetson about -6%, x86 -7.3% CPU; quality vs Default
# (proxy-4) +3.4% full / +2.5% low, pan worst.
decision.codec_subpel_seed_lambdas = 0.05
decision.subpel_move_bias = 1.1
decision.subpel_move_bias_nonzero = 1.1
decision.subpel_fractional_bias = 1.1
decision.subpel_quarter_needs_half_move = 1
# 32x32 transforms code only their low 16x16 frequencies (encoder-side
# forward approximation; NEON computes only those): crowd 720p q230 Jetson
# -3.9%, x86 +1.6% (full forward then zeroed there), weighted -2.1%; J_real
# TRAIN quality vs Default +0.2% full / +0.3% low (proxy-6, no guards),
# J at Fast's k 0.6 about -1.0%.
vp9.partial_forward = 1
# Inter blocks whose largest transform codes at most 4 levels skip the
# smaller transform sizes: Jetson -9.4%, x86 -7.4% (weighted -8.7%); J_real
# full TRAIN at k 0.6 BETTER, -4.9% (quality +0.6% full / +0.1% low, no
# guards); long GOP (one key, 300 frames, crowd and pan at 400 kbps) holds
# its trend.
# Trellis quantisation is a Default quality arm (J_real quality -1.3% for
# +6.4% host / +11.2% Jetson P-frame CPU); Fast keeps the plain quantiser.
quant.trellis = 0
# Fast keeps Default's start-up QP cadence (base boost 4) and cadence motion
# gate: proxy-6 J_real (k 0.6) vs both off BETTER -1.3%, no guard, pulse
# -0.02 dB; CPU-neutral (docs/handoff/vvc.md, qp-cascade).
# Default's key-frame trellis, unshaved levels, ungated P-frame intra and
# fine-quantizer small blocks are quality arms; Fast keeps the cheaper
# engine values.
quant.trellis_key = 0
vp9.shave_gap = 8
planner.depth_removal_min_quantizer = 0
vp9.intra_mode_estimate = 0
# Tuned jointly (eval/nceval/tune_pool.py, study vp9-vp9-fast-eq2-2026-11-11,
# trial #92, equal x86 CPU at most): a speed/quality trade at the Fast weight
# (k 0.6). Study L3 J_real -0.71% [-0.96, -0.45] with x86 -1.4%, Jetson
# cycles -2.2%. Re-checked at head 5911b553 on the study's rotation: quality
# alone +0.46% [+0.22, +0.73] on the 79 disjoint L3 clips (L2 ladder +0.49%),
# no guard; x86 -1.7% at head, so J_real about -0.7%. Long-horizon guard (it
# moves the QP cadence 1.4 -> 1.3 and AQ): 3-clip J -0.24%, all z < 1,
# static key pulse -1.37 dB. (Earlier: QP cadence 1.4, J_real TRAIN -1.9%.)
vp9.inter_tx_split_spread = 1.531264569929075
vp9.inter_rounding_divisor = 4.501006167285609
rate.aq_strength = 0.000301923024994135
vp9.tx_search_min_levels = 5
vp9.lambda_per_step_squared = 0.09828267012310973
planner.lambda_scale = 1.972212232891943
planner.depth_removal_qp_scale = 1.089173167562608
rate.cadence_scale = 1.3021137320565115
planner.depth_removal_th_32_16 = 44.603320351213426
vp9.keyframe_step_permille = 277.3997809563062
vp9.chroma_delta_q = -6
decision.intra_gate_variance = 49.0420171397338
