# H.264 Faster: the speed point below Fast (h264-faster2 agent, 2026-11-10;
# docs/handoff/h264-faster.md). h264-fast plus the levers with the best
# measured CPU per bit on the Jetson, stopped at the knee of the frontier:
# beyond it each further 1% of speed costs about 3% bits or more.
# Jetson, CBR 600 kbps rung, chart clips: see the handoff for fps and BD.
quant.trellis = 0
decision.subpel_quarter_needs_half_move = 1
# h264-fast's pins of the Default's pre-quality-set values (so the streams do
# not move with the Default); the window width is set below.
decision.codec_fullpel_probe = 0
decision.refine_cheap_vector = 0
decision.subpel_walk = 0
h264.intra4x4_all_modes = 0
analysis.mixed_motion = 0
quant.trellis_lambda_scale = 1
h264.split_gate_lambda = 0
# Residual and partition work skipped on near-zero residual and flat MBs.
h264.inter_zero_luma_scale = 2
h264.split_gate_satd = 96
h264.split_refine_steps = 1
h264.intra4x4_gate_satd = 64
# A lighter source search: narrower HME, no level 1, HME skipped below
# 8 SAD/pixel at zero, a 4x1 full-pel window.
analysis.hme_range_x = 8
analysis.hme_level1 = 0
analysis.skip_hme_sad_per_pixel = 8
analysis.window_half_width = 2
analysis.window_half_height = 0
decision.static_zero_vector = 1
# Bilinear candidate ranking (the coded prediction stays 6-tap).
h264.exact_ranking = 0
# Deblocking stays on: off in P slices (h264.deblock_inter 0) was another
# -3.5% Jetson time, but blocking then accumulates in long GOPs (single key,
# 300 f, 600 kbps: static_meva_hospital -0.83 / -1.15 / -1.25 dB per third
# against -0.64 / -0.69 / -0.70 with it on).
# Intra_8x8 (the Default's since 2026-11-10) costs +2.7% P-frame instructions
# for -0.5% quality: J +1.1 at k 0.6.
h264.intra8x8 = 0
# Faster keeps Default's start-up QP cadence (base boost 4) and cadence
# motion gate: J_real (k 0.6, dCPU 0) vs both off: TRAIN proxy-4 BETTER -2.8%
# (pulse -0.10 dB), VAL BETTER -4.4% (static -20.2%, bodycam +2.6%; pulse
# +0.07 dB), no guard; long GOP (900 f, one key, CBR 300) chirla Y thirds
# +0.07 / +0.02 / +0.02 dB, pan_bdd +0.03 / +0.01 / +0.00; x86 instructions
# -1.7 / -0.1 / +0.2% (static_cam22 / crowd / bodycam).
# Gated temporal layers (layer-gate agent, 2026-11-10;
# docs/handoff/hierarchical-p.md "Layer gate"). L1T3 wherever the gate
# allows: the frames nothing references (T2, every other frame) run the
# cheap settings below, the bits they save go to the referenced frames.
# Gate fitted on 44 fresh clips (neither TRAIN nor VAL; 21 handheld): fixed
# L1T3 gained on handheld, pan and busy content and lost on sources
# repeating every other frame and on the most static scenes; on shaking
# cameras the mean gained but the worst windows lost. So the motion limits
# are off up to the search reach (16 px/frame: the T0 at distance 4 needs
# vectors past the narrow window), and repeated inputs, a static-block
# fraction above 0.68 or a camera jitter above 2 keep the stream flat.
# J_real vs flat h264-faster (k 0.6, dCPU +0.04% x86, full gate): TRAIN 18
# clips -8.0%, VAL 11 clips -7.0%, no guard, no VAL clip worse; long GOP
# (900 f, one key) per third within -0.08..+0.22 dB.
# The CBR layer step ratios stay at the engine's (T0 0.35, T1 0.7): the
# milder 0.5 / 0.75 first adopted drifted down over 1200-1500-frame
# single-key runs (crowd -0.10 dB, pan -0.06 per sixth late on); the
# engine's hold (crowd +0.17..+0.37, pan -0.08..+0.35). J_real vs 0.5 /
# 0.75 (k 0.6, full gate): TRAIN 18 clips -2.1%, VAL 11 clips -2.1%, no
# guard.
layers.count = 3
layers.adaptive = 1
layers.adaptive_max_camera_motion = 16
layers.adaptive_max_compensable = 1
layers.adaptive_max_repeat_share = 0.25
layers.adaptive_max_static = 0.68
layers.adaptive_max_camera_jitter = 2
decision.nonbase_disposable_only = 1
nonbase.h264.deblock_inter = 0
nonbase.decision.subpel_half_only = 1
nonbase.analysis.window_half_width = 1
nonbase.decision.intra_gate_variance = 1024
nonbase.h264.inter_zero_luma_scale = 3
nonbase.analysis.hme_from_seed = 1
# Even-row pre-analysis statistics and a decimated half-resolution search
# level (lean-preanalysis, 2026-11-11): Jetson -1.8% cycles, x86 -0.3%
# instructions; pool levels J_real -0.88% [-1.11, -0.67] (L2+L3 pooled,
# quality 0.0%), no guards; 900-frame single-key static run within 0.2 dB
# per third.
analysis.preanalysis_rows = 1
analysis.pyramid_downsample = 2
# Tuned jointly (eval/nceval/tune_pool.py, study h264-h264-faster-eq2-2026-11-11,
# equal x86 CPU): a 0.775x mode-decision lambda, intra tried above variance 25
# (was 50), sub-pel refinement skipped below 0.105 lambda, QP cadence 1.15x,
# a lower one-position SAD exit. Study clips J -4.86%, study L3 -4.57%
# [-5.18, -4.02] (overfit gap +0.29); re-checked at head 6b635fc1 on the
# study's rotation: disjoint L3 (79 clips, single-point) J -4.77% [-5.41,
# -4.16], L2 (ladder, 48 clips) -4.40% [-4.87, -3.93], no guard. CPU x86
# +1.0%, Jetson cycles +0.7%. (The Default's cadence 1.4 lost here on worst-1%
# windows; 1.15 trips no guard on the 48-clip ladder level.)
decision.lambda_scale = 0.775
decision.intra_gate_variance = 25.206211
decision.skip_no_refine_lambdas = 0.104975485
rate.cadence_scale = 1.15
analysis.one_position_sad_per_pixel = 0.6666667
# Intra modes by coded cost (Default since 2026-11-13, study
# h264-default-arms-2026-11-13) stay off here: pinned, byte-identical.
h264.intra_rd = 0
