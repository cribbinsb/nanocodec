<!doctype html><meta charset="utf-8"><title>Capture identity</title>
<video id="video" muted playsinline></video>
<script type="module">
// What a live view codes from a sample clip: the capture worker's frame
// (capture-worker.js) converted to each view size by nc-web SourceFrame, as the
// encode worker does. Run by capture-identity.py, which compares the hashes
// with the clip's ffmpeg-decoded planes placed by tools/web/source_frames.py.
import { MODULE_URL } from '../wasm.js';
const module = await import(MODULE_URL);
const wasm = await module.default();
const video = document.getElementById('video');
const worker = new Worker('../capture-worker.js', { type: 'module' });
const hex = async bytes => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(b => b.toString(16).padStart(2, '0')).join('');
/** The capture worker's frame for `picture` (a VideoFrame), as it posts it to one view. */
async function capture(picture) {
  const channel = new MessageChannel();
  worker.postMessage({ type: 'init', views: [{ port: channel.port1, width: video.videoWidth, height: video.videoHeight }] }, [channel.port1]);
  const received = new Promise(resolve => { channel.port2.onmessage = ({ data }) => resolve(data.frame); });
  worker.postMessage({ type: 'frame', id: 1, timestamp: 0, sources: [{ picture, sourceWidth: video.videoWidth,
    sourceHeight: video.videoHeight, views: [0] }], displays: ['i420'], coding: [true] }, [picture]);
  const frame = await received;
  channel.port2.close();
  return frame;
}
/**
 * Play `url` and convert a frame presented at or after each of `times` (s),
 * taken in its frame callback as capture.js stages frames. For each: the media
 * time of the frame the VideoFrame holds, the capture path and the SHA-256 of
 * each view's packed I420.
 */
window.compare = async ({ url, sizes, times }) => {
  video.src = url;
  await new Promise((resolve, reject) => { video.onloadeddata = resolve; video.onerror = () => reject(new Error(url)); });
  const staged = [];
  await new Promise(resolve => {
    const onFrame = (_, metadata) => {
      const next = times[staged.length];
      if (metadata.mediaTime >= next) {
        // The frame's own timestamp names the frame it holds (under load the element
        // may already show a later frame than the callback's).
        const picture = new VideoFrame(video);
        staged.push({ time: next, mediaTime: picture.timestamp / 1e6, picture });
      }
      if (staged.length < times.length) video.requestVideoFrameCallback(onFrame); else resolve();
    };
    video.requestVideoFrameCallback(onFrame);
    video.play();
  });
  video.pause();
  const results = [];
  for (const { time, mediaTime, picture } of staged) {
    const frame = await capture(picture);
    const hashes = [];
    for (const [width, height] of sizes) {
      const source = new module.SourceFrame(width, height);
      if (frame.kind === 'planes') {
        source.from_planes(new Uint8Array(frame.data), frame.format, frame.colour, frame.width, frame.height, Uint32Array.from(frame.layout));
      } else {
        source.from_rgba(new Uint8Array(frame.data));
      }
      // packed() may grow WASM memory: take its offset before the buffer.
      const offset = source.packed();
      hashes.push(await hex(new Uint8Array(wasm.memory.buffer, offset, source.packed_length).slice()));
      source.free();
    }
    results.push({ time, mediaTime, kind: frame.kind, format: frame.format, colour: frame.colour, hashes });
  }
  return results;
};
window.ready = true;
</script>
