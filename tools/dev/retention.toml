# --- the nn dataset (learned encoder models) ---------------------------------------------

[[keep]]
path = "nn-data"
class = "durable"
reader = "nceval.nndata (the only reader; capped at 50 GB, not under work/ whose budget the caches use): nn-lead's policy network, the probe agent's trial gate and controller oracle train and judge on its released versions (docs/analysis/nn-dataset-schema.md)"
regen = "re-encode every shard with --label-dump on rented boxes (a version's manifest names each shard's clip, preset, rate and commit); trained models name the version they saw, so a lost version cannot be reproduced bit for bit"

[[regenerable]]
path = "clips/nn-excerpts"
reader = "nceval.nndata generate: lossless FFV1 excerpts of raw pool clips, sent to the labelling boxes with --clip"
regen = "nceval.nndata plan rewrites any missing excerpt from its raw clip (seconds each)"

[[regenerable]]
path = "worktrees/nn-labels/remote-out"
reader = "nn-labels' own box run outputs (pipe-clean runs, packed parts before assembly)"
regen = "re-run the nceval.nndata job; released data lives in nn-data/"

[[regenerable]]
path = "worktrees/nn-labels-run/remote-out"
reader = "nn-labels' frozen run tree's box outputs (v0/v0.1 parts before assembly, the v0 quality run)"
regen = "re-run the nceval.nndata job; released data and quality.json live in nn-data/"

[[keep]]
path = "work/nn-fast"
class = "durable"
reader = "docs/analysis/distill-fast-2026-11-22.md: the fast-rung distillation study's measured results (oracle arm screens oracle/*.json, CPU A/B summaries cpu-*-run/summary.json, the partition transplant logs plogs/, the closed-loop A/Bs ab*-*.json and ctx-*.json, the box runs' model results box*/)"
regen = "the oracle: 48 + 16 L1 screens and three CPU A/B rounds (~$3 on rented boxes, ~1 h); the models: v0 feature extraction and fits (~$4 on demand); about 40 MB"
evicted_by = []

[[regenerable]]
path = "work/audit-decoders"
reader = "nothing: the 2026-11-23 decoder re-measure's working copies (build and session logs, the measured nanocodec binary and browser module, a libavcodec-bench copy); its inputs and raw outputs moved to results/decoder-speed-2026-11-23"
regen = "the binary and module rebuild from commit 1da4349e (release, tools/web/build.sh); libavcodec-bench is in anchors/*/bin (build_anchors.sh avbench)"

[[keep]]
path = "bench"
class = "durable"
evicted_by = ["tools.bench.fleet"]  # BP-3.5: scored Fixed QP streams, by exact path
reader = "tools/bench/report.py: each BP-3 run's frozen stage, jobs, manifest, the series' encode and score records and the streams the procedure keeps (docs/benchmark-procedure.md section 13)"
regen = "re-run the frozen run (tools/bench/fleet.py stage/run/score) on rented boxes: about $100+ for the full plan"
