reader = "docs/analysis/benchmark-method-2026-11-23.md and benchmark-procedure-response-2026-11-23.md cite these raw records (per-encode timings, start-up fits, I/O, concatenation, ISA probe, review-response streams' sizes and scores) and the scratch tools that made them"
regen = "about $2 of AWS and 3 h: the study's sessions (study 'Spend'); cannot be regenerated identically (cloud noise, spot boxes)"
