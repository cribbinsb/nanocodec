# What is kept under ~/nanocodec-data (eval/nceval/retention.py; docs/PROCEDURES.md
# "Data retention"). Everything not covered here is swept once it is older than
# grace_hours and nothing uses it. Add an entry in the same commit as the tool that
# starts keeping something; nobody deletes, or keeps, by guess.
#
# Directories of `durable` and `tool` entries carry a NANOCODEC-KEEP.md marker
# (`retention.py mark`; tools creating a store call retention.ensure_entry_marker), unless
# the entry says `marker = false` and why. [[regenerable]] entries are declared free to
# delete; anything neither kept nor declared is UNKNOWN, and UNKNOWN is kept.
#
# Each [[keep]]: path (relative to the data root; `*` and `?` match within one path
# component), class (durable: a published result's inputs or an expensive cache;
# tool: a tool needs it to run; cache: kept, its owner evicts inside it under cap_gb),
# reader (what reads it), regen (what losing it costs), evicted_by (the tools that may
# remove paths strictly inside it: retention.guard owner names), release (checked by
# `retention.py verify-release`), require_globs (each must match a file in it).

grace_hours = 24

# --- published charts' point stores and streams -----------------------------------------

[[keep]]
path = "work/realuse/f150-ip300"
class = "durable"
reader = "the shared 150-frame point cache (nceval.realuse.Runner.bench -> cbr.Bench.result_path): the main chart (nceval.chart; chart_refresh.py; release.py chain 'main', 11 VAL clips), the history page (tools/dev/history_chart.py runner() -> Runner.points), held-out points merged from cloud-results (aws_heldout_chart.merge_results), screens at 150 f"
regen = "main chart: 1,554 points at 2a5aa4a8 (35 families + both x264 zero lines), ~15 CPU-s each (nceval.realuse REAL_COST_FACTOR), ~6.5 CPU-h; history page: every day's locally measured points (re-measure each day's build); held-out points: re-merge from work/heldout-chart/cloud-results. Lost 2026-11-21 15:17Z to a clean-up"
evicted_by = ["nceval.sweep", "chart_refresh"]
release = true
require_globs = ["*/x264-medium/*.json", "*/x264-medium~psnr/*.json", "*/nanocodec-av1/*.json"]

