reader = "BP-3 Graviton history leg: the aarch64 twin of anchors/x86_64-opt-bp3 (every reference encoder with LTO + PGO trained on release/pgo-clips-2026-11-23, aomdec/vpxdec/avmdec, our aarch64 PGO build nanocodec with BUILD.json), SHA256SUMS, build-flags.json, build logs"
