tool = "vvencFFapp"
version = "v1.14.0 (VVENC_COMMIT 9428ea86, tools/anchors/versions.env; the build the CTC run used)"
build = "x86_64: anchors/x86_64-opt-bp3 (built 2026-11-23 by tools/anchors/build_anchors.sh --opt on the build box, gcc 15.2; SHA-256s in its SHA256SUMS, flags in its build-flags.json): LTO (VVENC_ENABLE_LINK_TIME_OPT, its default), PGO by gcc's generic -fprofile-generate / -fprofile-use -fprofile-partial-training (VVenC documents no route), trained on the PGO training set eval/clipset/pgo_training_2026-11-23.json (NASA/NOAA, disjoint from every dataset, nceval.content_id) with this record's own commands, every family but the +drop rows, CBR 600 kbps and Fixed QP at the middle of the tool's CTC table (tools/anchors/pgo_train.py). Plain vs PGO not yet measured"
cbr = ["{BIN}/vvencFFapp", "-c", "{CFG}/experimental/lowdelay_{PRESET}.cfg", "-c", "{CFG}/rc1p.cfg", "--LookAhead=1", "-i", "{INPUT}", "-s", "{W}x{H}", "--FrameRate", "{FPS_NUM}", "--FrameScale", "{FPS_DEN}", "--TicksPerSecond", "{VVENC_TICKS}", "-f", "{N}", "--IntraPeriod", "{KEYINT}", "--TargetBitrate", "{KBPS}000", "--MaxBitrate", "{KBPS_X1500}", "--InputBitDepth=8", "--OutputBitDepth=8", "--InternalBitDepth=8", "--ConformanceWindowMode=1", "--Threads=1", "--MaxParallelFrames=0", "-b", "{OUTPUT}", "-o", "/dev/null"]
qp = ["{BIN}/vvencFFapp", "-c", "{CFG}/experimental/lowdelay_{PRESET}.cfg", "-i", "{INPUT}", "-s", "{W}x{H}", "--FrameRate", "{FPS_NUM}", "--FrameScale", "{FPS_DEN}", "--TicksPerSecond", "{VVENC_TICKS}", "-f", "{N}", "--IntraPeriod", "{KEYINT}", "-q", "{QP}", "--InputBitDepth=8", "--OutputBitDepth=8", "--InternalBitDepth=8", "--ConformanceWindowMode=1", "--Threads=1", "--MaxParallelFrames=0", "-b", "{OUTPUT}", "-o", "/dev/null"]
[[encoder.why]]
flags = "--TicksPerSecond {VVENC_TICKS}"
controls = "VVenC's timing clock; it must be a multiple of the frame rate (vvencFFapp: 'TicksPerSecond must be a multiple of FrameRate/Framescale')"
value = "the largest multiple of the rate's numerator not above 27000000: 27000000 itself for NTSC (VVenC's own advice), and a valid clock for any rate num/den. Found by the first BP-3 Fixed QP run: VCD2 webcams at 17, 23 and 28 fps and Wikimedia uploads at 24.39, 29.089 and 29.833 fps were refused with the default"
fair = "timing metadata only: the coded pictures are unchanged"
remaining = "none"
[[encoder.why]]
flags = "-c experimental/lowdelay_faster.cfg | lowdelay_fast.cfg"
controls = "VVenC's low-delay configuration at its fastest presets"
value = "VVenC's own low-delay configs (cfg/experimental/ in the v1.14.0 tree, as the CTC lens used: nceval.ctc.reference_encoders VVENC_CONFIG); the fastest two"
fair = "the coordinator's VVC reference (2026-11-23); the same build as the AOM-CTC run"
remaining = "the low-delay configs are marked experimental in v1.14.0; low delay codes B slices (no P-only mode); VVenC has no real-time speed class: stated"
[[encoder.why]]
flags = "(coding order and references; evidence)"
controls = "whether the low-delay configs reorder pictures or reference future ones"
value = "verified on v1.14.0 streams, 2026-11-23: with lowdelay_faster and lowdelay_fast (cfg/experimental, PicReordering 0, GOPSize 8, every RPL entry a positive POC delta), at fixed QP and with single-pass rate control. The encoder's per-picture log (--Verbosity=6) shows coding order = display order (POC 0, 1, 2, ... for 24 of 24 pictures) and every L0/L1 entry a past picture (GPB: L1 = L0). Its temporal filter (MCTF, BIM) is set to past pictures only (MCTFFutureReference 0). Logs and configs: bench-method-records/vvenc-lowdelay/"
fair = "no picture reordering and no future reference, like every other encoder"
remaining = "none in the stream structure"
[[encoder.why]]
flags = "-c rc1p.cfg --LookAhead=1 --TargetBitrate {KBPS}000 --MaxBitrate {KBPS_X1500}"
controls = "VVenC's single-pass rate control: a VBR controller with a pre-analysis look-ahead (its log: 'VBR single-pass', 'LookAhead:1')"
value = "the shared rate (bits/s). VVenC refuses one-pass rate control without the look-ahead ('Look-ahead encoding must be used with one-pass rate control')"
fair = "the only single-pass rate control VVenC offers. --MaxBitrate ('approximate maximum instantaneous bitrate', vvencFFapp --fullhelp) is set to 1.5x the target, the lowest VVenC accepts ('MaxBitrate must be at least 1.5*TargetBitrate', tested 2026-11-23); every other peak is the target. VVenC has no buffer size or initial level, so it is judged by the same replay"
remaining = "VVenC's CBR points have a rate-control look-ahead and no buffer model, an advantage to VVenC that no other encoder has (depth not measured): stated beside every VVC comparison. VVenC's fixed-QP view has none"
[[encoder.why]]
flags = "--Threads=1 --MaxParallelFrames=0"
controls = "one thread, no frame parallelism"
value = "one thread"
fair = "same for all"
remaining = "VVenC is designed around threads: stated"
[[encoder.why]]
flags = "--IntraPeriod {KEYINT}"
controls = "one intra picture per clip"
value = "the shared structure; tested with GOPSize 8: v1.14.0 accepts 300 (its log: 'Intra period (keyframe): 300'), as it does 296 and 304, and codes one intra picture (bench-method-records/vvenc-lowdelay)"
fair = "same as all"
remaining = "none"

# AV2 has no real-time reference: AVM (the AV2 reference software) is a coding-efficiency
# reference at fixed QP only (eval/nceval/cbr.py _reference_command), far from real-time speed.
# Our AV2 rungs are compared only with other codecs' encoders in CBR. uvg266 (real-time VVC) has
# no pinned build in tools/anchors/versions.env; it is not charted until one is (task T9).
