# Benchmark fairness record (BP-2): every encoder's exact command, and why.
#
# The benchmark scripts build every command line from this file (`nceval.fairness.command`),
# and `python3 -m nceval.fairness render` writes the tables in docs/benchmark-procedure.md
# section 17 from it. `eval/tests/test_fairness_record.py` fails when:
# - a command breaks a shared constraint;
# - a flag has no explanation;
# - the document's tables differ from the render.
# So the document, the record and the runs cannot drift apart.
#
# Placeholders: {BIN} tool directory, {INPUT} raw I420 source, {OUTPUT} stream,
# {W} {H} picture size, {FPS_NUM} {FPS_DEN} frame rate, {FPS_FLOAT} the same as a decimal,
# {N} frames, {KEYINT} key interval (frames > N: one key per clip), {KBPS} target,
# {QP} quantizer in the encoder's own scale, {PRESET} the family's preset or speed.
# Measured effects cite docs/analysis/benchmark-procedure-response-2026-11-23.md ("response")
# and docs/analysis/benchmark-method-2026-11-23.md ("study").

version = "BP-3.10"

# The one initial fullness (owner, 2026-11-25, BP-4.0): the buffer starts full, 1.0 s, for every
# encoder. The 600 ms "final" phase is dropped. `current` names the one phase; the commands take its
# values.
[phase]
current = "full-start"
[phase.full-start]
INIT_MS = "1000"
VBV_INIT = "1.0"

[shared]
# The one constraint set every encoder is configured to, as far as its options allow.
rate_kbps = "the only ladder: 300 / 500 / 800 / 1200 kbps at 720p30, target = rung x (pixels / 1280x720)^0.75 x (fps / 30)^0.5, capped at half the source bitrate (owner, 2026-11-23)"
buffer_ms = 1000
initial_level_ms = "1000: the buffer starts full for every encoder (owner, 2026-11-25)"
optimal_level_ms = 600
peak = "equal to the target (no encoder gets a higher drain rate)"
frames = "150 (\"ours\", VC-1K); 130 (AOM-CTC, the CTC's count)"
keyint = 300
bframes = "0: no picture references a later one (no reordering, past references only); VVenC's low-delay B slices reference past pictures only (verified, VVenC entry)"
lookahead_frames = 0
scene_cut = "off"
threads = 1
frame_skip = "off on every main row (no encoder sends nothing for a frame); libvpx and libaom also have labelled +drop rows with their own frame dropping on (CBR only); ours codes a held frame as an all-skip frame (engine task T1; until it lands, hold off)"
resize = "allowed where it is the encoder's own recommended real-time setting: ours on (AV1), the references as their projects' real-time examples set it (off); size-changed frames are scored after one pinned upscale (nceval.display, bilinear centre-aligned) for all"
sei = "every stream loses its SEI NAL units (H.264 6, HEVC 39/40, VVC 23/24), AV1 metadata OBUs (5) and AV2 metadata OBUs (8/9) after the timed encode (nceval.streamstrip); decoded frames are checked identical in both standard decoders and ours; bytes removed recorded per point; x265 also runs --no-info"
zero_line = "x264 medium in its best tune for each metric (owner, 2026-11-25): BD-PSNR and BD-VMAF and the composite BD-J against --tune zerolatency,psnr, BD-MS-SSIM against --tune zerolatency,ssim; every chart names its zero's tune"
validity = "one external replay: 1 s bucket, initial decoder fullness 1000 ms, drain at the target, every counted bit; published per encoder as continuous compliance figures beside the BD (all points count in the BD; procedure section 8)"

[[encoder]]
family = "nanocodec-{codec}@{preset}"
tool = "nanocodec"
version = "the run's commit (manifest), one binary for every rung"
build = "release, fat LTO, -C target-cpu=x86-64-v3 (workspace .cargo/config.toml); PGO only for a release, trained on clips disjoint from every dataset (nceval.content_id). Measured on 0.6.0: the plain build takes 0.984-1.031x the PGO build's time (response M3). The BP-3 run's PGO build: anchors/x86_64-opt-bp3/nanocodec (BUILD.json: commit, SHA-256, training on eval/clipset/pgo_training_2026-11-23.json)"
cbr = ["{BIN}/nanocodec", "encode", "--codec", "{CODEC}", "--input", "{INPUT}", "--width", "{W}", "--height", "{H}", "--fps", "{FPS_NUM}/{FPS_DEN}", "--frames", "{N}", "--intra-period", "{KEYINT}", "--temporal-layers", "1", "--output", "{OUTPUT}", "--bitrate", "{KBPS}", "--buffer-ms", "1000", "--peak-bitrate", "{KBPS}", "--strict-buffer", "--param", "rate.first_key_lookahead_off=1", "--param", "hold.enable=1", "--param", "hold.code_skip=1", "--param", "stream.encoder_info=0", "{PRESET_ARGS}"]
qp = ["{BIN}/nanocodec", "encode", "--codec", "{CODEC}", "--input", "{INPUT}", "--width", "{W}", "--height", "{H}", "--fps", "{FPS_NUM}/{FPS_DEN}", "--frames", "{N}", "--intra-period", "{KEYINT}", "--temporal-layers", "1", "--output", "{OUTPUT}", "--qp", "{QP}", "--param", "hold.enable=0", "--param", "stream.encoder_info=0", "{PRESET_ARGS}"]
[[encoder.why]]
flags = "--bitrate --buffer-ms 1000 --peak-bitrate {KBPS}"
controls = "CBR target; 1 s buffer; drain at the target"
value = "the shared rate, buffer and peak"
fair = "the default peak is 2x the target (rate_control.rs); BP-2 sets it to the target, as x264/x265 --vbv-maxrate"
remaining = "none known"
[[encoder.why]]
flags = "--strict-buffer"
controls = "never pass one buffer (re-codes a frame that would); the key cap stays at its default, one buffer (params.rs)"
value = "the shared 1 s buffer, held"
fair = "owner, 2026-11-25 (final): ours holds the 1 s buffer strictly, even though x264, x265 and SVT-AV1 merely stay inside it by their own rate control and libaom, libvpx, openh264 and Kvazaar exceed it on 11-14 % of points (2026-11-24 report). It may cost ours a little; it removes the argument. Supersedes the 1.15 default bound of 2026-11-22 and option 5a"
remaining = "none"
[[encoder.why]]
flags = "--param rate.first_key_lookahead_off=1"
controls = "the start-up lookahead (frame 1 read before frame 0 is coded) no longer sizes the first key"
value = "off"
fair = "every reference runs with zero lookahead (--rc-lookahead 0, --lag-in-frames=0)"
remaining = "the CLI still reads frame 1 early (I/O only); measured effect of the cap: response B2"
[[encoder.why]]
flags = "--param hold.enable=1 --param hold.code_skip=1"
controls = "frame hold with all-skip output: a near-exact repeat of the last coded frame is coded as a frame whose every block copies it (no residual); every input frame is still coded"
value = "our default hold, with all-skip output (owner, 2026-11-25, D21)"
fair = "every frame is coded, as on every main row. Repeats exist in the benchmark sets: held-out 20 of 97 clips (2.4 % of frames, mostly static CCTV and video calls), VC-1K 10 of 100 (0.2 %) (sealed log 23). Conformance: 725/725 streams bit-exact in every standard decoder and ours"
remaining = "none"
[[encoder.why]]
flags = "(adaptive coded resolution: default, on for AV1)"
controls = "AV1 codes at half size per dimension at very low rates (standard reference scaling, no key frame)"
value = "on (owner, 2026-11-23: an allowed coding tool in standard syntax)"
fair = "each reference uses resize where its project's recommended real-time configuration does: libvpx's and libaom's real-time examples set it off (vpx_temporal_svc_encoder.c rc_resize_allowed = 0; svc_encoder_rtc.cc rc_resize_mode = 0), SVT's RTC default is off; scoring upscales any size-changed frame with one pinned filter for all (section 6)"
remaining = "measured: response Q3 (how often ours switches, its BD effect, and the references with dynamic resize on)"
[[encoder.why]]
flags = "--intra-period {KEYINT} --temporal-layers 1"
controls = "one key frame per clip; flat P"
value = "the shared key interval and structure"
fair = "same as every reference (--keyint, --kf-max-dist, -k)"
remaining = "none"
[[encoder.why]]
flags = "--preset {PRESET}"
controls = "the rung"
value = "every shipped single-layer rung"
fair = "the references are charted at several presets each"
remaining = "35 rungs against 2-4 per reference: a front through few reference points is interpolation (review M10)"
[[encoder.why]]
flags = "(no thread flag)"
controls = "threads"
value = "our encoder is single-threaded"
fair = "every reference runs one thread"
remaining = "none"
[[encoder.why]]
flags = "(DSP tier: runtime dispatch)"
controls = "SIMD tier"
value = "AVX-512 on the timing CPU, recorded; tiers are bit-exact (tools/ci/isa_identity.sh)"
fair = "every reference uses its own best runtime dispatch on the same CPU (x265 --asm avx512, below)"
remaining = "none known"
[[encoder.why]]
flags = "--qp {QP}"
controls = "Fixed QP = no rate control, a fixed base QP; ours keeps its own frame-level cadence, key offset and block offsets (rate.constant_qp off)"
value = "the codec's base-QP table (procedure section 5)"
fair = "owner, 2026-11-23: every encoder keeps its own frame- and block-level QP behaviour in fixed-QP mode (x264/x265 --ipratio, SVT and the others as listed in their tables)"
remaining = "measured key-frame offsets per encoder: response M4"

[[encoder]]
family = "x264-{preset}[~{tune}]" # presets ultrafast, superfast, veryfast, faster, fast, medium
tool = "x264"
version = "0.165 (anchors build_anchors.sh, X264_COMMIT in tools/anchors/versions.env)"
build = "x86_64: anchors/x86_64-opt-bp3 (built 2026-11-23 by tools/anchors/build_anchors.sh --opt on the build box, gcc 15.2; SHA-256s in its SHA256SUMS, flags in its build-flags.json): -O3, LTO (x264 configure --enable-lto), PGO through x264's own CFLAGSPROF/LDFLAGSPROF hooks (gcc -fprofile-generate / -fprofile-use -fprofile-partial-training), trained on the PGO training set eval/clipset/pgo_training_2026-11-23.json (NASA/NOAA, disjoint from every dataset, nceval.content_id) with this record's own commands, every family but the +drop rows, CBR 600 kbps and Fixed QP at the middle of the tool's CTC table (tools/anchors/pgo_train.py). Measured on the earlier x86_64-opt build (its own fprofiled training): the plain build takes 1.051 / 1.058 / 1.014x the time (medium / veryfast / ultrafast; response M3)"
cbr = ["{BIN}/x264", "--preset", "{PRESET}", "--tune", "{TUNE}", "--bframes", "0", "--rc-lookahead", "0", "--keyint", "{KEYINT}", "--bitrate", "{KBPS}", "--vbv-maxrate", "{KBPS}", "--vbv-bufsize", "{KBPS}", "--vbv-init", "{VBV_INIT}", "--input-res", "{W}x{H}", "--fps", "{FPS_NUM}/{FPS_DEN}", "--frames", "{N}", "--threads", "1", "--output", "{OUTPUT}", "{INPUT}"]
qp = ["{BIN}/x264", "--preset", "{PRESET}", "--tune", "{TUNE}", "--bframes", "0", "--rc-lookahead", "0", "--no-scenecut", "--keyint", "{KEYINT}", "--min-keyint", "{KEYINT}", "--qp", "{QP}", "--input-res", "{W}x{H}", "--fps", "{FPS_NUM}/{FPS_DEN}", "--frames", "{N}", "--threads", "1", "--output", "{OUTPUT}", "{INPUT}"]
[[encoder.why]]
flags = "--tune zerolatency[,psnr|,ssim]"
controls = "low-delay settings (no B-frames, no lookahead, no mb-tree, sliced-threads off at 1 thread); the twins turn psycho-visual tuning to the metric"
value = "x264's own real-time tune (x264 --fullhelp: 'zerolatency'); twins as x264 documents for metric runs"
fair = "the twin that suits each metric is charted (review M9: the rule per metric is fixed in the manifest)"
remaining = "--tune psnr disables AQ, which is not x264's best for VMAF/MS-SSIM: the default-tune family is charted beside it"
[[encoder.why]]
flags = "--bitrate --vbv-maxrate {KBPS} --vbv-bufsize {KBPS} --vbv-init {VBV_INIT}"
controls = "ABR inside a VBV: peak = target, 1 s buffer, decoder buffer {VBV_INIT} full at start"
value = "the shared bucket: 1 s, starting full"
fair = "same bucket as everyone; x264's default --vbv-init is 0.9"
remaining = "measured: 0.9 -> 0.6 costs x264 medium 1.4 % BD-PSNR-YUV (response B3); 0.9 -> 1.0 not measured"
[[encoder.why]]
flags = "--bframes 0 --rc-lookahead 0 --keyint {KEYINT}"
controls = "no B-frames, no lookahead (zerolatency's own values, restated); one key at the start, later keys x264's own choice"
value = "rule 2 (no added latency) and rule 3 (one key at the start of the test window)"
fair = "procedure section 3 (BP-4.0): scene-cut keys are x264's own choice (rule 4; default scenecut threshold 40, common/base.c:388), so --no-scenecut and --min-keyint {KEYINT} are dropped from the CBR command; x264's scene-cut detection runs without lookahead (encoder/encoder.c:1618, slicetype.c:1523). Audit: docs/analysis/reference-fair-config-2026-11-25.md"
remaining = "the Fixed QP command keeps --no-scenecut and --min-keyint; BP-4 measures no Fixed QP"
[[encoder.why]]
flags = "--threads 1"
controls = "one thread (also no lookahead thread)"
value = "the shared thread count"
fair = "same for all"
remaining = "x264 is designed around threads (review M10): stated"
[[encoder.why]]
flags = "(SEI, post-processing)"
controls = "x264 writes a ~0.6 kB user-data SEI with its options; x264 0.165 has no switch to omit it (x264 --fullhelp)"
value = "every SEI NAL is stripped after the timed encode (nceval.streamstrip), the decoded frames checked identical, the bytes removed recorded"
fair = "the same post-processing strips SEI and metadata from every encoder's stream, ours included. Ours runs with --param stream.encoder_info=0 (its encoder-information SEI/metadata, about 135 B per key since 117de821a, is charged by our rate control), as x265 runs --no-info. Asymmetry, stated: x264 cannot omit its SEI, so its rate control may spend bits on it that are then stripped; measured (response 2) 662 B median per stream, 0.8 % of the stream median, up to 15 % on the smallest streams"
remaining = "none"
[[encoder.why]]
flags = "--qp {QP}"
controls = "CQP: no rate control, fixed base QP; key frame at QP - 6 log2(ipratio 1.4) = about 3 QP finer; AQ and MB-tree are switched off by x264 itself in CQP"
value = "x264's own CQP mode"
fair = "Fixed QP = each encoder's no-rate-control mode with its own frame and block QP behaviour (procedure section 5)"
remaining = "verified in x264 source at the pinned commit (encoder/encoder.c lines 951-966: i_aq_mode = 0, b_mb_tree = 0; qp_i = qp_p - 6*log2f(f_ip_factor)) and measured (key QP 29 at --qp 32, response M4). Ours keeps block offsets where x264 has none in this mode: stated"

[[encoder]]
family = "x265-{preset}[~{tune}]"
tool = "x265"
version = "4.2 (X265_COMMIT)"
build = "x86_64: anchors/x86_64-opt-bp3 (built 2026-11-23 by tools/anchors/build_anchors.sh --opt on the build box, gcc 15.2; SHA-256s in its SHA256SUMS, flags in its build-flags.json): LTO (CMake CMAKE_INTERPROCEDURAL_OPTIMIZATION), PGO by gcc's generic -fprofile-generate / -fprofile-use -fprofile-partial-training (x265 documents no route), trained on the PGO training set eval/clipset/pgo_training_2026-11-23.json (NASA/NOAA, disjoint from every dataset, nceval.content_id) with this record's own commands, every family but the +drop rows, CBR 600 kbps and Fixed QP at the middle of the tool's CTC table (tools/anchors/pgo_train.py). Measured on the earlier LTO-only build: the plain build takes 1.017x the time (response M3); plain vs this PGO build not yet measured"
cbr = ["{BIN}/x265", "--preset", "{PRESET}", "--tune", "{TUNE}", "{TUNE_EXTRA}", "--bframes", "0", "--rc-lookahead", "0", "--no-scenecut", "--keyint", "{KEYINT}", "--min-keyint", "{KEYINT}", "--bitrate", "{KBPS}", "--vbv-maxrate", "{KBPS}", "--vbv-bufsize", "{KBPS}", "--vbv-init", "{VBV_INIT}", "--input-res", "{W}x{H}", "--fps", "{FPS_NUM}/{FPS_DEN}", "--frames", "{N}", "--frame-threads", "1", "--pools", "none", "--no-wpp", "--no-info", "--input-depth", "8", "--input", "{INPUT}", "--output", "{OUTPUT}"]
qp = ["{BIN}/x265", "--preset", "{PRESET}", "--tune", "{TUNE}", "{TUNE_EXTRA}", "--bframes", "0", "--rc-lookahead", "0", "--no-scenecut", "--keyint", "{KEYINT}", "--min-keyint", "{KEYINT}", "--qp", "{QP}", "--input-res", "{W}x{H}", "--fps", "{FPS_NUM}/{FPS_DEN}", "--frames", "{N}", "--frame-threads", "1", "--pools", "none", "--no-wpp", "--no-info", "--input-depth", "8", "--input", "{INPUT}", "--output", "{OUTPUT}"]
[[encoder.why]]
flags = "--tune psnr / --tune ssim at ultrafast and superfast"
controls = "x265's metric tunes"
value = "measured (30 frames, 600 kbps, superfast): the two tunes code byte-identical streams; x265 reports AQ strength 0.0 for --tune ssim at these presets. The first BP-3 run's BDs agree (ultrafast -4.77 % both, superfast -21.28 % both)"
fair = "at these two presets the PSNR and SSIM twins are one encoder, shown once and labelled"
remaining = "none"
[[encoder.why]]
flags = "--tune zerolatency|psnr|ssim (+ --no-cutree with a metric tune)"
controls = "low delay; metric twins (x265 takes one tune, so --no-cutree restores the rest of zerolatency)"
value = "x265's own real-time tune"
fair = "as x264"
remaining = "as x264"
[[encoder.why]]
flags = "--vbv-maxrate {KBPS} --vbv-bufsize {KBPS} --vbv-init {VBV_INIT}"
controls = "the shared bucket"
value = "as x264"
fair = "as x264"
remaining = "measured: response B3"
[[encoder.why]]
flags = "--frame-threads 1 --pools none --no-wpp"
controls = "one thread"
value = "the shared thread count (rule 3)"
fair = "WPP and frame threads exist only for parallelism; with one thread they would cost coding efficiency for nothing, so they are off (procedure section 3 rule 3)"
remaining = "x265 is designed around WPP threads: stated"
[[encoder.why]]
flags = "--no-info"
controls = "drops x265's 1.5-2.4 kB user-data SEI"
value = "off"
fair = "SEI is not counted for any encoder anyway; this removes it from the stream too"
remaining = "none"
[[encoder.why]]
flags = "(no --asm flag: x265's own runtime dispatch)"
controls = "x265 picks its SIMD tier itself; its default leaves AVX-512 off on x86_64 (source/common/cpu.cpp:158-226: cpu_detect adds AVX-512 only when asked) and uses NEON/SVE on aarch64"
value = "x265's default"
fair = "procedure section 3 rule 4 (BP-4.0): a speed flag is not a shared constraint, so the earlier --asm avx512 on x86_64 is dropped (audit, docs/analysis/reference-fair-config-2026-11-25.md). Output is unchanged by design; speed may move"
remaining = "the x86_64 speed effect of the change is measured by the first BP-4 timing run"
[[encoder.why]]
flags = "--qp {QP}"
controls = "CQP: fixed base QP, key about 3 QP finer (ipratio); AQ, hevc-aq, AQ-motion and CU-tree switched off by x265 itself in CQP"
value = "x265's own CQP mode"
fair = "as x264"
remaining = "verified in x265 source at the pinned commit (source/encoder/encoder.cpp lines 4049-4056; ratecontrol.cpp 345-350) and measured (key QP 29 at --qp 32)"

[[encoder]]
family = "openh264-baseline[~cabac][+drop]"
tool = "openh264-harness (tools/openh264-harness, SHA-256 in the manifest; the harness source is published)"
version = "openh264 v2.7.0 (OPENH264_COMMIT 1bca6231, tools/anchors/versions.env); harness commit 745b0166 (tools/openh264-harness), SHA-256 recorded in the manifest; the T16 harness (2026-11-25) adds --coded-frames and continues past a skip on the +drop row, main-row streams byte-identical (2 pool clips checked), and is rebuilt into the anchor stores before the next run"
build = "x86_64: anchors/x86_64-opt-bp3 (built 2026-11-23 by tools/anchors/build_anchors.sh --opt on the build box, gcc 15.2; SHA-256s in its SHA256SUMS, flags in its build-flags.json): libopenh264.a -O3 with gcc -flto=auto (archived with gcc-ar; the harness, -O2, links with -flto) and gcc's generic -fprofile-generate / -fprofile-use -fprofile-partial-training (its Makefile offers neither), trained through the harness, trained on the PGO training set eval/clipset/pgo_training_2026-11-23.json (NASA/NOAA, disjoint from every dataset, nceval.content_id) with this record's own commands, every family but the +drop rows, CBR 600 kbps and Fixed QP at the middle of the tool's CTC table (tools/anchors/pgo_train.py). Plain vs PGO not yet measured Plain-vs-PGO speed not measurable: the plain harness predates --bitrate"
cbr = ["{BIN}/openh264-harness", "--input", "{INPUT}", "--output", "{OUTPUT}", "--width", "{W}", "--height", "{H}", "--fps", "{FPS_FLOAT}", "--frames", "{N}", "--usage", "camera-realtime", "--complexity", "{COMPLEXITY}", "--cabac", "{CABAC}", "--bitrate", "{KBPS}", "--intra-period", "{KEYINT}", "--temporal-layers", "1", "--adaptive-quant", "{AQ}", "--scene-change", "1", "--background-detection", "1", "--denoise", "0", "--ltr", "0", "--frame-skip", "{SKIP}", "{SKIP_ARGS}", "--threads", "1"]
qp = ["{BIN}/openh264-harness", "--input", "{INPUT}", "--output", "{OUTPUT}", "--width", "{W}", "--height", "{H}", "--fps", "{FPS_FLOAT}", "--frames", "{N}", "--usage", "camera-realtime", "--complexity", "{COMPLEXITY}", "--cabac", "{CABAC}", "--qp", "{QP}", "--intra-period", "{KEYINT}", "--temporal-layers", "1", "--adaptive-quant", "{AQ}", "--scene-change", "0", "--background-detection", "1", "--denoise", "0", "--ltr", "0", "--frame-skip", "0", "--threads", "1"]
[[encoder.why]]
flags = "--usage camera-realtime --complexity medium|high --cabac 0|1"
controls = "openh264's real-time camera mode; CAVLC (baseline) or CABAC (~cabac twin)"
value = "openh264's own usage type for live camera; both entropy coders charted"
fair = "the CABAC twin is about 17 % better (audit finding 3) and is the H.264-to-H.264 comparison"
remaining = "none"
[[encoder.why]]
flags = "--adaptive-quant 1 --scene-change 1"
controls = "openh264's adaptive quantisation and scene-change detection"
value = "the library defaults (codec/api/wels/param_svc.h:166 bEnableSceneChangeDetect = true, :168 bEnableAdaptiveQuant = true); --background-detection 1 --denoise 0 --ltr 0 --temporal-layers 1 also equal the defaults (param_svc.h:165, 167, 170)"
fair = "procedure section 3 rule 4 (BP-4.0): defaults unless a shared constraint needs otherwise. AQ 1 codes byte-identical streams to AQ 0 in this mode (84/84 in the audit), so the former ~aq twin is gone; scene-change on: median BD-J unchanged, 3 of 23 streams gained keys (audit, docs/analysis/reference-fair-config-2026-11-25.md)"
remaining = "the Fixed QP command keeps --scene-change 0; BP-4 measures no Fixed QP"
[[encoder.why]]
flags = "--bitrate {KBPS}"
controls = "openh264's rate control"
value = "the shared rate"
fair = "openh264 exposes no buffer size, initial level or peak: it is judged by the same replay"
remaining = "its buffer cannot be set to the shared bucket: stated; measured compliance: response B3"
[[encoder.why]]
flags = "--frame-skip {SKIP} {SKIP_ARGS}"
controls = "openh264's frame skipping; on the '+drop' row the harness also lists the input frame of each coded picture (--coded-frames {OUTPUT}.frames)"
value = "0 on the main rows; 1 on the labelled 'openh264-baseline+drop' row, the library default (codec/api/wels/param_svc.h:169 bEnableFrameSkip = true)"
fair = "the main rows code every frame, as every encoder's (procedure section 3, measurement condition). The '+drop' row is the configuration openh264 is designed for: its rate control cannot hold the rate without skipping (its own warning: 'bitrate can't be controlled ... without enabling skip frame'). Annex B has no timestamps, so the harness's coded-frame list places each picture: a skipped frame shows the previous picture and is counted, and its slot carries 0 bytes in the rate and the buffer replay, as the libvpx and libaom '+drop' rows (tools/bench/score.py drop_slots, bytes_per_slot)"
remaining = "none"

[[encoder]]
family = "svtav1-m{PRESET}"
tool = "SvtAv1EncApp"
version = "v4.3.0 (SVTAV1_COMMIT)"
build = "x86_64: anchors/x86_64-opt-bp3 (built 2026-11-23 by tools/anchors/build_anchors.sh --opt on the build box, gcc 15.2; SHA-256s in its SHA256SUMS, flags in its build-flags.json): LTO (SVT_AV1_LTO, its default) + PGO by SVT's own route (SVT_AV1_PGO: PGOCompileGen / PGOCompileUse), trained on the PGO training set eval/clipset/pgo_training_2026-11-23.json (NASA/NOAA, disjoint from every dataset, nceval.content_id) with this record's own commands, every family but the +drop rows, CBR 600 kbps and Fixed QP at the middle of the tool's CTC table (tools/anchors/pgo_train.py). Measured on the earlier x86_64-opt build: the plain build takes 1.045 / 1.047x the time (M12 / M13)"
cbr = ["{BIN}/SvtAv1EncApp", "--rtc", "1", "--preset", "{PRESET}", "--pred-struct", "1", "--rc", "2", "--tbr", "{KBPS}", "--buf-sz", "1000", "--buf-initial-sz", "{INIT_MS}", "--buf-optimal-sz", "600", "--keyint", "{KEYINT}", "--scd", "0", "--lp", "1", "--fps-num", "{FPS_NUM}", "--fps-denom", "{FPS_DEN}", "-w", "{W}", "-h", "{H}", "-n", "{N}", "-i", "{INPUT}", "-b", "{OUTPUT}"]
qp = ["{BIN}/SvtAv1EncApp", "--rtc", "1", "--preset", "{PRESET}", "--pred-struct", "1", "--hierarchical-levels", "0", "--rc", "0", "--qp", "{QP}", "--keyint", "{KEYINT}", "--scd", "0", "--lp", "1", "--fps-num", "{FPS_NUM}", "--fps-denom", "{FPS_DEN}", "-w", "{W}", "-h", "{H}", "-n", "{N}", "-i", "{INPUT}", "-b", "{OUTPUT}"]
